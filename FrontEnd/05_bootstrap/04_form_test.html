<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Practice</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container my-5">

    <h1>회원가입 폼 만들기</h1>

    <!-- =====================================
    실습1

    이름 입력창 만들기

    조건

    1. label 사용
    2. form-control 사용
    ===================================== -->

    <div class="mb-3">

        <label class="form-label">
            이름
        </label>

        <!-- 작성 -->
        <input type="text"
               class="form-control">

    </div>



    <!-- =====================================
    실습2

    로그인 폼

    조건

    1. 아이디
    2. 비밀번호
    3. form-control 사용
    ===================================== -->

    <div class="mb-3">

        <label class="form-label">
            아이디
        </label>

        <!-- 작성 -->
        <input type="text"
               class="form-control">

    </div>

    <div class="mb-3">

        <label class="form-label">
            비밀번호
        </label>

        <!-- 작성 -->
        <input type="password"
               class="form-control">

    </div>



    <!-- =====================================
    실습3

    관심분야 선택

    조건

    1. checkbox
    2. Java
    3. Spring
    4. React
    ===================================== -->

    <div class="mb-3">

        <div class="form-check">

            <!-- 작성 -->
            <input type="checkbox"
                   class="form-check-input"
                   id="java">

            <label class="form-check-label"
                   for="java">
                Java
            </label>

        </div>

        <div class="form-check">

            <input type="checkbox"
                   class="form-check-input"
                   id="spring">

            <label class="form-check-label"
                   for="spring">
                Spring
            </label>

        </div>

        <div class="form-check">

            <input type="checkbox"
                   class="form-check-input"
                   id="react">

            <label class="form-check-label"
                   for="react">
                React
            </label>

        </div>

    </div>



    <!-- =====================================
    실습4

    성별 선택

    조건

    1. radio
    2. 남자
    3. 여자
    ===================================== -->

    <div class="mb-3">

        <div class="form-check">

            <!-- 작성 -->
            <input type="radio"
                   class="form-check-input"
                   name="gender"
                   id="male">

            <label class="form-check-label"
                   for="male">
                남자
            </label>

        </div>

        <div class="form-check">

            <input type="radio"
                   class="form-check-input"
                   name="gender"
                   id="female">

            <label class="form-check-label"
                   for="female">
                여자
            </label>

        </div>

    </div>



    <!-- =====================================
    실습5

    회원가입 폼 완성

    조건

    1. Grid 사용
    2. 이름
    3. 이메일
    4. 자기소개
    5. 수강과정
    6. 가입버튼
    ===================================== -->

    <div class="row">

        <div class="col-md-6">

            <label class="form-label">
                이름
            </label>

            <!-- 작성 -->
            <input type="text"
                   class="form-control">

        </div>

        <div class="col-md-6">

            <label class="form-label">
                이메일
            </label>

            <!-- 작성 -->
            <input type="email"
                   class="form-control">

        </div>

    </div>

    <div class="mt-3">

        <label class="form-label">
            자기소개
        </label>

        <!-- 작성 -->
        <textarea class="form-control"
                  rows="4"></textarea>

    </div>

    <div class="mt-3">

        <label class="form-label">
            수강과정
        </label>

        <!-- 작성 -->
        <select class="form-select">

            <option>Java</option>
            <option>Python</option>
            <option>React</option>

        </select>

    </div>

    <div class="mt-3">

        <!-- 작성 -->
        <button class="btn btn-primary">
            회원가입
        </button>

    </div>

</div>

</body>
</html>
