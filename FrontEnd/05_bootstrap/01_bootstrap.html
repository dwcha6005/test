<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 Bootstrap</title>

<!-- ===================================================
Bootstrap CDN

Bootstrap CSS를 사용할 수 있게 해준다.

직접 다운로드하지 않고
인터넷을 통해 불러온다.
=================================================== -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ===================================================
01 Bootstrap 이란?

Bootstrap은

HTML + CSS + JS를 이용해서

반응형 웹사이트를 빠르게 만들 수 있는
프론트엔드 프레임워크이다.


우리가 지금까지 직접 작성했던 것

display:flex
display:grid
@media

등을

Bootstrap에서는
미리 만들어진 클래스로 사용할 수 있다.


예)

직접 작성

display:flex;


Bootstrap

d-flex;
=================================================== */


/* ===================================================
02 Bootstrap Grid

Bootstrap은

12칸 Grid System을 사용한다.


1칸
col-1

6칸
col-6

12칸
col-12


예)

col-6 + col-6

50%
50%


col-4 + col-4 + col-4

33%
33%
33%
=================================================== */

.demo-box{
    background:#eeeeee;
    border:1px solid #cccccc;
    text-align:center;
    padding:30px;
}

</style>
</head>

<body>


<!-- ===================================================
03 Container

container
→ 가운데 정렬

container-fluid
→ 전체 너비
=================================================== -->

<div class="container">

    <h1 class="mt-5">
        Bootstrap
    </h1>

    <p>
        Bootstrap 시작하기
    </p>

</div>



<!-- ===================================================
04 Typography

Bootstrap은
제목 크기 클래스 제공

display-1
display-2
display-3
display-4
=================================================== -->

<div class="container mt-5">

    <h1 class="display-1">
        Display 1
    </h1>

    <h1 class="display-4">
        Display 4
    </h1>

</div>



<!-- ===================================================
05 Button

btn

btn-primary
btn-success
btn-danger
=================================================== -->

<div class="container mt-5">

    <button class="btn btn-primary">
        Primary
    </button>

    <button class="btn btn-success">
        Success
    </button>

    <button class="btn btn-danger">
        Danger
    </button>

</div>



<!-- ===================================================
06 Grid

row
→ 행

col
→ 열
=================================================== -->

<div class="container mt-5">

    <div class="row">

        <div class="col">
            <div class="demo-box">
                COL
            </div>
        </div>

        <div class="col">
            <div class="demo-box">
                COL
            </div>
        </div>

        <div class="col">
            <div class="demo-box">
                COL
            </div>
        </div>

    </div>

</div>



<!-- ===================================================
07 12 Column

col-6
→ 6칸

col-3
→ 3칸
=================================================== -->

<div class="container mt-5">

    <div class="row">

        <div class="col-6">
            <div class="demo-box">
                col-6
            </div>
        </div>

        <div class="col-6">
            <div class="demo-box">
                col-6
            </div>
        </div>

    </div>

</div>



<!-- ===================================================
08 Responsive Grid

col-md-6

768px 이상
→ 2열

768px 미만
→ 1열
=================================================== -->

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">

            <div class="demo-box">
                ITEM
            </div>

        </div>

        <div class="col-md-6">

            <div class="demo-box">
                ITEM
            </div>

        </div>

    </div>

</div>



<!-- ===================================================
09 Bootstrap 장점

1. 개발 속도 빠름

2. 반응형 지원

3. 디자인 통일

4. Grid 제공

5. 컴포넌트 제공
=================================================== -->


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
