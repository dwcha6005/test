<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 Icon Practice</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<div class="container my-5">
    <h1 class="mb-4">Bootstrap Icons 실습</h1>

    <!-- 작성 -->
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <!-- 상품 아이콘 -->
                    <i class="bi bi-headphones fs-1 text-primary"></i>
                    <h3 class="mt-3">무선 헤드폰</h3>
                    <p class="text-secondary">고음질 블루투스 헤드폰</p>
                    <h4>89,000원</h4>
                    <!-- 장바구니 / 좋아요 버튼 -->
                    <button class="btn btn-primary"><i class="bi bi-cart"></i> 장바구니</button>
                    <button class="btn btn-outline-danger"><i class="bi bi-heart"></i></button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <i class="bi bi-smartwatch fs-1 text-success"></i>
                    <h3 class="mt-3">스마트워치</h3>
                    <p class="text-secondary">건강 관리 스마트워치</p>
                    <h4>129,000원</h4>
                    <button class="btn btn-success"><i class="bi bi-cart"></i> 장바구니</button>
                    <button class="btn btn-outline-danger"><i class="bi bi-heart"></i></button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    <i class="bi bi-camera fs-1 text-warning"></i>
                    <h3 class="mt-3">디지털 카메라</h3>
                    <p class="text-secondary">고화질 미러리스 카메라</p>
                    <h4>599,000원</h4>
                    <button class="btn btn-warning"><i class="bi bi-cart"></i> 장바구니</button>
                    <button class="btn btn-outline-danger"><i class="bi bi-heart"></i></button>
                </div>
            </div>
        </div>
    </div>

    <hr class="my-5">

    <!-- 추가 실습 -->
    <div class="text-center">
        <h3>회원 기능</h3>
        <button class="btn btn-primary"><i class="bi bi-person-plus"></i> 회원가입</button>
        <button class="btn btn-secondary"><i class="bi bi-box-arrow-in-right"></i> 로그인</button>
        <button class="btn btn-danger"><i class="bi bi-box-arrow-right"></i> 로그아웃</button>
    </div>

    <!-- 작성 -->
</div>
</body>
</html>
