<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>09 Carousel Practice</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
.carousel img{height:450px;object-fit:cover;}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="bi bi-shop"></i> MY SHOP</a>
        <button class="btn btn-outline-light"><i class="bi bi-cart"></i> 장바구니</button>
    </div>
</nav>

<!-- 작성 -->
<div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
    <!-- 인디케이터 -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
    </div>

    <!-- 슬라이드 -->
    <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="3000">
            <img src="https://picsum.photos/id/1060/1600/600" class="d-block w-100" alt="신상품">
            <div class="carousel-caption">
                <h2>NEW ARRIVAL</h2>
                <p>새롭게 출시된 신상품을 만나보세요.</p>
                <button class="btn btn-primary"><i class="bi bi-bag"></i> 상품 보기</button>
            </div>
        </div>

        <div class="carousel-item" data-bs-interval="3000">
            <img src="https://picsum.photos/id/1069/1600/600" class="d-block w-100" alt="할인">
            <div class="carousel-caption">
                <h2>SUMMER SALE</h2>
                <p>인기 상품을 최대 50% 할인된 가격으로 만나보세요.</p>
                <button class="btn btn-danger"><i class="bi bi-tag"></i> 할인 상품</button>
            </div>
        </div>

        <div class="carousel-item" data-bs-interval="3000">
            <img src="https://picsum.photos/id/1074/1600/600" class="d-block w-100" alt="이벤트">
            <div class="carousel-caption">
                <h2>SPECIAL EVENT</h2>
                <p>회원 가입하고 특별한 혜택을 받아보세요.</p>
                <button class="btn btn-success"><i class="bi bi-gift"></i> 이벤트 보기</button>
            </div>
        </div>
    </div>

    <!-- 이전 / 다음 -->
    <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>

<div class="container my-5">
    <h2 class="text-center mb-4">BEST PRODUCT</h2>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card text-center p-4">
                <i class="bi bi-headphones fs-1 text-primary"></i>
                <h4 class="mt-3">무선 헤드폰</h4>
                <p>89,000원</p>
                <button class="btn btn-outline-primary"><i class="bi bi-cart"></i> 장바구니</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center p-4">
                <i class="bi bi-smartwatch fs-1 text-success"></i>
                <h4 class="mt-3">스마트워치</h4>
                <p>129,000원</p>
                <button class="btn btn-outline-success"><i class="bi bi-cart"></i> 장바구니</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center p-4">
                <i class="bi bi-camera fs-1 text-warning"></i>
                <h4 class="mt-3">디지털 카메라</h4>
                <p>599,000원</p>
                <button class="btn btn-outline-warning"><i class="bi bi-cart"></i> 장바구니</button>
            </div>
        </div>
    </div>
</div>
<!-- 작성 -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
