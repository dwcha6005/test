<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>03 Bootstrap Component</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* =====================================
01 Component

Bootstrap은

Button
Alert
Badge
Card
Table
Navbar
Modal

등의 UI를
클래스만으로 제공한다.

직접 CSS를 작성하지 않아도 된다.
===================================== */

.demo{
    border:1px dashed #ccc;
    padding:20px;
    margin-bottom:30px;
}

</style>

</head>
<body>

<div class="container my-5">

    <h1>Bootstrap Components</h1>

    <!-- =====================================
    02 Button
    ===================================== -->

    <div class="demo">

        <h3>Button</h3>

        <button class="btn btn-primary">
            Primary
        </button>

        <button class="btn btn-success">
            Success
        </button>

        <button class="btn btn-danger">
            Danger
        </button>

        <button class="btn btn-warning">
            Warning
        </button>

    </div>


    <!-- =====================================
    03 Alert
    ===================================== -->

    <div class="demo">

        <h3>Alert</h3>

        <div class="alert alert-primary">
            회원가입이 완료되었습니다.
        </div>

        <div class="alert alert-success">
            저장되었습니다.
        </div>

        <div class="alert alert-danger">
            오류가 발생했습니다.
        </div>

    </div>


    <!-- =====================================
    04 Badge
    ===================================== -->

    <div class="demo">

        <h3>Badge</h3>

        <span class="badge bg-primary">
            NEW
        </span>

        <span class="badge bg-success">
            EVENT
        </span>

        <span class="badge bg-danger">
            HOT
        </span>

    </div>


    <!-- =====================================
    05 Card
    ===================================== -->

    <div class="demo">

        <h3>Card</h3>

        <div class="card" style="width:300px">

            <div class="card-body">

                <h5 class="card-title">
                    상품명
                </h5>

                <p class="card-text">
                    상품 설명입니다.
                </p>

                <a href="javascript:void(0)"
                   class="btn btn-primary">
                    자세히 보기
                </a>

            </div>

        </div>

    </div>


    <!-- =====================================
    06 Table
    ===================================== -->

    <div class="demo">

        <h3>Table</h3>

        <table class="table table-striped">

            <thead>

                <tr>
                    <th>번호</th>
                    <th>이름</th>
                    <th>점수</th>
                </tr>

            </thead>

            <tbody>

                <tr>
                    <td>1</td>
                    <td>홍길동</td>
                    <td>90</td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>김학생</td>
                    <td>85</td>
                </tr>

            </tbody>

        </table>

    </div>


    <!-- =====================================
    07 List Group
    ===================================== -->

    <div class="demo">

        <h3>List Group</h3>

        <ul class="list-group">

            <li class="list-group-item">
                Java
            </li>

            <li class="list-group-item">
                JSP
            </li>

            <li class="list-group-item">
                Spring
            </li>

        </ul>

    </div>


    <!-- =====================================
    08 Utility

    mt-3
    mb-3
    p-3
    text-center

    Bootstrap은
    유틸리티 클래스도 제공한다.
    ===================================== -->

    <div class="demo text-center p-3">

        Utility Class

    </div>

</div>

</body>
</html>
