<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar Practice</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container my-5">

    <h1>Navbar 실습</h1>

    <!-- =====================================
    실습1

    기본 Navbar 만들기

    조건

    1. navbar 사용
    2. 브랜드명 ITWILL
    ===================================== -->

    <!-- 작성 -->

    <nav class="navbar bg-light mb-5">

        <div class="container-fluid">

            <span class="navbar-brand">
                ITWILL
            </span>

        </div>

    </nav>



    <!-- =====================================
    실습2

    메뉴 만들기

    조건

    HOME
    COURSE
    CONTACT
    ===================================== -->

    <!-- 작성 -->

    <nav class="navbar navbar-expand-lg bg-light mb-5">

        <div class="container-fluid">

            <a href="javascript:void(0)"
               class="navbar-brand">
                LOGO
            </a>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a href="javascript:void(0)"
                       class="nav-link">
                        HOME
                    </a>
                </li>

                <li class="nav-item">
                    <a href="javascript:void(0)"
                       class="nav-link">
                        COURSE
                    </a>
                </li>

                <li class="nav-item">
                    <a href="javascript:void(0)"
                       class="nav-link">
                        CONTACT
                    </a>
                </li>

            </ul>

        </div>

    </nav>



    <!-- =====================================
    실습3

    로그인 메뉴 오른쪽 배치

    조건

    ms-auto 사용

    Login
    Join
    ===================================== -->

    <!-- 작성 -->

    <nav class="navbar navbar-expand-lg bg-light mb-5">

        <div class="container-fluid">

            <span class="navbar-brand">
                ITWILL
            </span>

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a href="javascript:void(0)"
                       class="nav-link">
                        Login
                    </a>

                </li>

                <li class="nav-item">

                    <a href="javascript:void(0)"
                       class="nav-link">
                        Join
                    </a>

                </li>

            </ul>

        </div>

    </nav>



    <!-- =====================================
    실습4

    쇼핑몰 Navbar

    조건

    LOGO

    메뉴
    - 상품
    - 이벤트
    - 고객센터

    로그인 버튼
    ===================================== -->

    <!-- 작성 -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark mb-5">

        <div class="container-fluid">

            <a href="javascript:void(0)"
               class="navbar-brand">
                SHOP
            </a>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a href="javascript:void(0)"
                       class="nav-link">
                        상품
                    </a>
                </li>

                <li class="nav-item">
                    <a href="javascript:void(0)"
                       class="nav-link">
                        이벤트
                    </a>
                </li>

                <li class="nav-item">
                    <a href="javascript:void(0)"
                       class="nav-link">
                        고객센터
                    </a>
                </li>

            </ul>

            <button class="btn btn-primary ms-auto">
                Login
            </button>

        </div>

    </nav>



    <!-- =====================================
    실습5

    IT 학원 Navbar

    조건

    로고

    국비교육
    취업지원
    수강후기
    상담신청

    상담신청 버튼
    ===================================== -->

    <!-- 작성 -->

    <nav class="navbar navbar-expand-lg bg-primary navbar-dark">

        <div class="container-fluid">

            <a href="javascript:void(0)"
               class="navbar-brand">
                ITWILL
            </a>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a href="javascript:void(0)"
                       class="nav-link">
                        국비교육
                    </a>
                </li>

                <li class="nav-item">
                    <a href="javascript:void(0)"
                       class="nav-link">
                        취업지원
                    </a>
                </li>

                <li class="nav-item">
                    <a href="javascript:void(0)"
                       class="nav-link">
                        수강후기
                    </a>
                </li>

            </ul>

            <button class="btn btn-light ms-auto">
                상담신청
            </button>

        </div>

    </nav>

</div>

</body>
</html>
