<div class="container my-5">

    <h1>Bootstrap 실습</h1>

    <!-- 
    < 실습1 >

    - 회원가입 완료 메시지

    조건)
    1. 초록색 Alert 사용
    2. "회원가입 완료"
     -->
    <div class="alert alert-success">
        회원가입 완료
    </div>



    <!-- 
    < 실습2 >
    - 게시판 제목

    조건)
    1. h3 "공지사항"
    2. 공지사항 뒤에 "NEW" 빨간 Badge 
    -->
    <h3>
        공지사항
        <span class="badge bg-danger">
            NEW
        </span>
    </h3>



    <!-- 
    < 실습3 >
    - 상품 카드 만들기

    조건)
    1. Card 사용
    2. 상품명 (h5)
    3. 가격 (p)
    4. 구매 버튼 (파란 버튼)
     -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">
                무선 마우스
            </h5>
            <p>
                29,000원
            </p>
            <button class="btn btn-primary">
                구매하기
            </button>
        </div>
    </div>



    <!-- 
    < 실습4 >
    - 상품 목록

    조건)
    1. Grid 사용
    2. 768px 이상: 3열, 768px 이하: 1열
    3. 카드 3개
     -->
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5>상품1</h5>
                    <button class="btn btn-success">
                        구매
                    </button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5>상품2</h5>
                    <button class="btn btn-success">
                        구매
                    </button>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5>상품3</h5>
                    <button class="btn btn-success">
                        구매
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 
    < 실습5 >
    - 수강생 관리 테이블

    조건)
    1. 짝수 행마다 배경색이 적용된 table 사용
    2. 상태 Badge 사용
       => 수강중: 초록, 완료: 파랑, 탈락: 빨강
     -->
    <table class="table table-striped mt-5">
        <thead>
            <tr>
                <th>이름</th>
                <th>과정</th>
                <th>상태</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>홍길동</td>
                <td>Java</td>
                <td>
                    <span class="badge bg-success">
                        수강중
                    </span>
                </td>
            </tr>
            <tr>
                <td>김학생</td>
                <td>Spring</td>
                <td>
                    <span class="badge bg-primary">
                        완료
                    </span>
                </td>
            </tr>
            <tr>
                <td>이학생</td>
                <td>Bootstrap</td>
                <td>
                    <span class="badge bg-danger">
                        탈락
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
