<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05 Navbar</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* =====================================
Navbar

웹사이트 상단 메뉴 영역

Bootstrap 제공 클래스

navbar
navbar-expand-lg
navbar-brand
navbar-nav
nav-item
nav-link
===================================== */

.demo{
    border:1px solid #ddd;
    padding:20px;
    margin-top:20px;
}

</style>
</head>
<body>

<div class="container my-5">

    <h1>Bootstrap Navbar</h1>

    <!-- =====================================
    01 기본 Navbar
    ===================================== -->

    <nav class="navbar bg-light">

        <div class="container-fluid">

            <span class="navbar-brand">
                ITWILL
            </span>

        </div>

    </nav>



    <!-- =====================================
    02 메뉴 추가
    ===================================== -->

    <div class="demo">

        <nav class="navbar navbar-expand-lg bg-light">

            <div class="container-fluid">

                <a href="javascript:void(0)"
                   class="navbar-brand">
                    ITWILL
                </a>

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a href="javascript:void(0)"
                           class="nav-link">
                            HOME
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="javascript:void(0)"
                           class="nav-link">
                            COURSE
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="javascript:void(0)"
                           class="nav-link">
                            CONTACT
                        </a>
                    </li>

                </ul>

            </div>

        </nav>

    </div>



    <!-- =====================================
    03 배경색
    ===================================== -->

    <div class="demo">

        <nav class="navbar navbar-dark bg-dark">

            <div class="container-fluid">

                <span class="navbar-brand">
                    Dark Navbar
                </span>

            </div>

        </nav>

    </div>



    <!-- =====================================
    04 메뉴 오른쪽 정렬

    ms-auto
    ===================================== -->

    <div class="demo">

        <nav class="navbar navbar-expand-lg bg-light">

            <div class="container-fluid">

                <a href="javascript:void(0)"
                   class="navbar-brand">
                    LOGO
                </a>

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a href="javascript:void(0)"
                           class="nav-link">
                            Login
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="javascript:void(0)"
                           class="nav-link">
                            Join
                        </a>
                    </li>

                </ul>

            </div>

        </nav>

    </div>



    <!-- =====================================
    05 Navbar + Button
    ===================================== -->

    <div class="demo">

        <nav class="navbar bg-light">

            <div class="container-fluid">

                <span class="navbar-brand">
                    ITWILL
                </span>

                <button class="btn btn-primary">
                    Login
                </button>

            </div>

        </nav>

    </div>



    <!-- =====================================
    06 실제 사이트 형태
    ===================================== -->

    <div class="demo">

        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

            <div class="container-fluid">

                <a href="javascript:void(0)"
                   class="navbar-brand">
                    NETFLIX
                </a>

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a href="javascript:void(0)"
                           class="nav-link">
                            HOME
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="javascript:void(0)"
                           class="nav-link">
                            MOVIE
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="javascript:void(0)"
                           class="nav-link">
                            LOGIN
                        </a>
                    </li>

                </ul>

            </div>

        </nav>

    </div>

</div>

</body>
</html>
