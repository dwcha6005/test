<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11 Offcanvas Practice</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="bi bi-shop"></i> MY SHOP</a>
        <div>
            <button class="btn btn-outline-light" data-bs-toggle="offcanvas" data-bs-target="#shopMenu">
                <i class="bi bi-list"></i> 메뉴
            </button>
            <button class="btn btn-outline-light">
                <i class="bi bi-cart"></i> 장바구니
            </button>
        </div>
    </div>
</nav>

<!-- 작성 -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="shopMenu">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title"><i class="bi bi-shop"></i> MY SHOP</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <h6 class="text-secondary mb-3">CATEGORY</h6>
        <nav class="nav flex-column">
            <a class="nav-link text-dark" href="#"><i class="bi bi-phone"></i> 스마트폰</a>
            <a class="nav-link text-dark" href="#"><i class="bi bi-laptop"></i> 노트북</a>
            <a class="nav-link text-dark" href="#"><i class="bi bi-headphones"></i> 음향기기</a>
            <a class="nav-link text-dark" href="#"><i class="bi bi-camera"></i> 카메라</a>
            <a class="nav-link text-dark" href="#"><i class="bi bi-smartwatch"></i> 스마트워치</a>
        </nav>
        <hr>
        <h6 class="text-secondary mb-3">MY PAGE</h6>
        <nav class="nav flex-column">
            <a class="nav-link text-dark" href="#"><i class="bi bi-person"></i> 내 정보</a>
            <a class="nav-link text-dark" href="#"><i class="bi bi-bag"></i> 주문 내역</a>
            <a class="nav-link text-dark" href="#"><i class="bi bi-heart"></i> 찜한 상품</a>
        </nav>
        <button class="btn btn-primary w-100 mt-4"><i class="bi bi-box-arrow-in-right"></i> 로그인</button>
    </div>
</div>

<div class="container my-5">
    <h1 class="text-center">BEST PRODUCT</h1>
    <p class="text-center text-secondary">인기 상품을 만나보세요.</p>
    <div class="row g-4 mt-3">
        <div class="col-md-4">
            <div class="card text-center p-4">
                <i class="bi bi-laptop fs-1 text-primary"></i>
                <h4 class="mt-3">노트북</h4>
                <p>1,290,000원</p>
                <button class="btn btn-outline-primary"><i class="bi bi-cart"></i> 장바구니</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center p-4">
                <i class="bi bi-headphones fs-1 text-success"></i>
                <h4 class="mt-3">무선 헤드폰</h4>
                <p>89,000원</p>
                <button class="btn btn-outline-success"><i class="bi bi-cart"></i> 장바구니</button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center p-4">
                <i class="bi bi-camera fs-1 text-warning"></i>
                <h4 class="mt-3">디지털 카메라</h4>
                <p>599,000원</p>
                <button class="btn btn-outline-warning"><i class="bi bi-cart"></i> 장바구니</button>
            </div>
        </div>
    </div>
</div>
<!-- 작성 -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
