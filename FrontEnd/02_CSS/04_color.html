<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Color</title>

<style>
    /* 1. color: 글자 색상 */
    .text-red {
        color: red;
    }
    .text-blue {
        color: blue;
    }

    /* 2. background-color: 배경 색상 */
    .bg-yellow {
        background-color: yellow;
    }
    .bg-black {
        background-color: black;
        color: white;
    }

    /* 3. 색상 이름 사용 */
    .name-color {
        color: green;
    }

    /* 4. HEX 색상: #RRGGBB */
    .hex-color {
        color: #ff0000;
    }

    /* 5. RGB: rgb(빨강, 초록, 파랑) 0 ~ 255 */
    .rgb-color {
        color: rgb(0, 0, 255);
    }

    /* 
    6. RGBA (마지막 값은 투명도)
    0 = 완전 투명
    1 = 완전 불투명
    */
    .rgba-color {
        background-color: rgba(255, 0, 0, 0.3);
    }

</style>
</head>
<body>

<h1>글자 색상</h1>

<p class="text-red">빨간색</p>
<p class="text-blue">파란색</p>
<hr>

<h1>배경 색상</h1>
<p class="bg-yellow">노란 배경</p>
<p class="bg-black">검은 배경</p>
<hr>

<h1>색상 이름</h1>
<p class="name-color">green</p>
<hr>

<h1>HEX</h1>
<p class="hex-color">#ff0000</p>


<hr>

<h1>RGB</h1>
<p class="rgb-color">rgb(0,0,255)</p>
<hr>

<h1>RGBA</h1>
<p class="rgba-color">rgba(255,0,0,0.3)</p>

</body>
</html>
