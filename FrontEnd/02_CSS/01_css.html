<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS 기초</title>

    <!--
        1. CSS란?

        CSS = Cascading Style Sheets

        HTML: 웹 페이지의 구조와 내용을 작성
        CSS : 웹 페이지의 디자인과 표현을 담당
        JS  : 웹 페이지의 동작을 담당
    -->

</head>
<body>
    <!--
        2. CSS 기본 문법
        선택자 {
            속성: 값;
        }

        예)
        p {
            color: red;
        }

        p: 선택자, color: 속성, red:속성값
    -->

    <h2>1. CSS 기본 문법</h2>

    <p style="color: red;">
        빨간색 글자입니다.
    </p>


    <!--
        3. Inline Style

        HTML 태그에 style 속성을 직접 작성하는 방법

        장점: 특정 요소 하나만 빠르게 수정할 수 있다.
        단점: HTML과 CSS가 섞여서 관리하기 어렵다.
    -->

    <h2>2. Inline Style</h2>

    <p style="color: blue;">
        파란색 글자입니다.
    </p>

    <p style="font-size: 24px;">
        글자 크기를 크게 만들었습니다.
    </p>


    <!--
        3. Internal Style Sheet

        <head> 영역의 <style> 태그 안에
        CSS를 작성하는 방법

        하나의 HTML 문서에서
        여러 요소에 CSS를 적용할 때 사용할 수 있다.
    -->
    <h2>3. Internal Style Sheet</h2>
    <style>

        h3 {
            color: green;
        }

        .description {
            font-size: 18px;
        }
    </style>

    <h3>CSS를 적용한 제목</h3>

    <p class="description">
        CSS를 적용한 문장입니다.
    </p>


    <!--
        5. External Style Sheet

        CSS를 별도의 .css 파일로 작성하고
        HTML에서 연결하는 방법

        실제 프로젝트에서 가장 많이 사용하는 방법
    -->
    <h2>4. External Style Sheet</h2>

    <!--
        외부 CSS 파일 연결 예시

        <link rel="stylesheet" href="style.css">

        현재 실습에서는 실제 파일을 만들지 않았기 때문에
        주석으로만 확인합니다.
    -->


    <!--
        6. CSS 여러 속성 사용하기

        하나의 요소에 여러 개의 CSS 속성을
        적용할 수 있다.
    -->


    <h2>5. 여러 CSS 속성 사용</h2>

    <p
        style="
            color: purple;
            font-size: 24px;
            background-color: lightgray;
        "
    >
        여러 가지 CSS 속성을 적용했습니다.
    </p>


    <!--
        7. 주석

        CSS 주석

        /* 주석 내용 */

        HTML 주석과 문법이 다르다.
    -->


    <!--
        8. CSS 기본 속성 예제

        color: 글자 색상
        background-color: 배경 색상
        font-size: 글자 크기
        text-align: 글자 정렬
        width: 너비
        height: 높이
        margin: 바깥 여백
        padding: 안쪽 여백

        자세한 내용은 이후 수업에서 학습한다.
    -->


    <h2>6. 기본 CSS 속성</h2>

    <div
        style="
            color: white;
            background-color: black;
            width: 300px;
            height: 100px;
            text-align: center;
        "
    >
        CSS로 꾸민 영역
    </div>


    <!--
        ========================================
        9. HTML과 CSS의 역할
        ========================================

        HTML
        → 구조와 의미

        CSS
        → 디자인과 표현

        예:

        HTML
        <h1>안녕하세요</h1>

        CSS
        h1 {
            color: blue;
            font-size: 40px;
        }
    -->
    <h2>7. HTML + CSS</h2>

    <h1 style="color: blue; font-size: 40px;">
        안녕하세요
    </h1>


</body>
</html>
