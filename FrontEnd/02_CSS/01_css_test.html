<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 기초 Test</title>
</head>
<body>
    <!-- 
    - h1 글자 색상 → 파란색
    - h1 글자 크기 → 40px
    - 첫 번째 p → 빨간색
    - 두 번째 p → 초록색
    -->
    <h1>나의 홈페이지</h1>
    <p>웹 개발을 공부하고 있습니다.</p>
    <p>HTML과 CSS를 배우고 있습니다.</p>

    <h1 style="color: blue; font-size: 40px;">나의 홈페이지</h1>
    <p style="color: red;">웹 개발을 공부하고 있습니다.</p>
    <p style="color: green;">HTML과 CSS를 배우고 있습니다.</p>

    <!-- 
    h1: 빨강색, 32px
    p: 회색, 18px
    -->

    <h1>나의 홈페이지</h1>
    <p>HTML을 공부하고 있습니다.</p>
    <p>CSS를 공부하고 있습니다.</p>
    <p>JavaScript도 공부할 예정입니다.</p>

    <style>
        h1 {
            color: red;
            font-size: 32px;
        }

        p {
            color: gray;
            font-size: 18px;
        }
    </style>

</body>
</html>
