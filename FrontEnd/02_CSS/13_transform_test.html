<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform 실습</title>

    <style>

        /*
        ==================================================
        실습 1. 오른쪽으로 이동
        ==================================================

        아래 박스를 오른쪽으로 100px 이동하세요.

        조건

        - transform: translateX()
        */

        .box1 {
            width: 150px;
            height: 100px;

            background-color: lightblue;

            transform: translateX(100px);
        }


        /*
        ==================================================
        실습 2. 위로 이동
        ==================================================

        마우스를 올리면 박스가 위로 20px 이동하도록
        만들어보세요.

        조건

        - :hover
        - transform: translateY()
        - transition: transform 0.5s
        */

        .box2 {
            width: 150px;
            height: 100px;

            background-color: lightcoral;

            transition: transform 0.5s;
        }

        .box2:hover {
            transform: translateY(-20px);
        }


        /*
        ==================================================
        실습 3. 확대
        ==================================================

        마우스를 올리면 박스가
        1.3배 확대되도록 만드세요.

        변화는 0.5초 동안 진행됩니다.
        */

        .box3 {
            width: 150px;
            height: 100px;

            background-color: lightgreen;

            transition: transform 0.5s;
        }

        .box3:hover {
            transform: scale(1.3);
        }


        /*
        ==================================================
        실습 4. 회전
        ==================================================

        마우스를 올리면
        박스가 45도 회전하도록 만드세요.

        transition도 적용하세요.
        */

        .box4 {
            width: 120px;
            height: 120px;

            background-color: lightblue;

            transition: transform 0.5s;
        }

        .box4:hover {
            transform: rotate(45deg);
        }


        /*
        ==================================================
        실습 5. 기울이기
        ==================================================

        박스를 X축 방향으로
        20도 기울여보세요.

        조건

        - transform: skewX()
        */

        .box5 {
            width: 150px;
            height: 100px;

            background-color: lightcoral;

            transform: skewX(20deg);
        }


        /*
        ==================================================
        실습 6. 여러 transform 조합
        ==================================================

        마우스를 올렸을 때

        1. 오른쪽으로 50px 이동
        2. 1.2배 확대
        3. 10도 회전

        하도록 만드세요.

        세 가지 transform을
        하나의 transform 속성에서 사용하세요.
        */

        .box6 {
            width: 120px;
            height: 120px;

            background-color: lightgreen;

            transition: transform 0.5s;
        }

        .box6:hover {
            transform:
                translateX(50px)
                scale(1.2)
                rotate(10deg);
        }


        /*
        ==================================================
        실습 7. 카드가 떠오르는 효과
        ==================================================

        카드에 마우스를 올리면

        - 위로 10px 이동
        - 그림자 강화

        효과를 만들어보세요.

        transition을 이용하여
        부드럽게 변경되어야 합니다.
        */

        .card7 {
            width: 250px;

            padding: 20px;

            border: 1px solid #ddd;

            border-radius: 10px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);

            transition:
                transform 0.3s,
                box-shadow 0.3s;
        }

        .card7:hover {
            transform: translateY(-10px);

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.25);
        }


        /*
        ==================================================
        실습 8. 버튼 클릭 효과
        ==================================================

        버튼을 클릭하는 순간

        - 아래쪽으로 3px 이동
        - 그림자 크기 감소

        효과를 만들어보세요.

        :active와 transform을 사용하세요.
        */

        .button8 {
            display: inline-block;

            padding: 12px 25px;

            border: 1px solid #333;

            text-decoration: none;

            color: black;

            box-shadow:
                0 4px 0 #333;
        }

        .button8:active {
            transform: translateY(3px);

            box-shadow:
                0 1px 0 #333;
        }


        /*
        ==================================================
        실습 9. 이미지 확대
        ==================================================

        이미지에 마우스를 올리면
        1.1배 확대되도록 만드세요.

        단, 이미지가 부모 영역 밖으로
        보이지 않아야 합니다.

        힌트

        부모

        overflow: hidden;

        이미지

        transform: scale()
        transition
        */

        .image9 {
            width: 300px;
            height: 200px;

            overflow: hidden;
        }

        .image9 img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: transform 0.5s;
        }

        .image9:hover img {
            transform: scale(1.1);
        }


        /*
        ==================================================
        실습 10. 상품 카드 종합 실습
        ==================================================

        쇼핑몰 상품 카드 3개를 만드세요.

        조건

        1. 카드 크기 220px

        2. padding 20px

        3. border 적용

        4. border-radius 적용

        5. box-shadow 적용

        6. 마우스를 올리면
           카드가 위로 10px 이동

        7. 마우스를 올리면
           그림자가 커짐

        8. 변화는 transition으로 부드럽게 처리

        9. 상품명에 마우스를 올리면
           크기가 1.1배 커지도록 작성

        10. 구매 버튼은 hover하면
            크기가 1.05배 커지도록 작성


        지금까지 배운

        - display
        - box model
        - border-radius
        - box-shadow
        - transform
        - transition
        - :hover

        를 조합하는 종합 실습입니다.
        */

        .product10 {
            display: inline-block;

            width: 220px;

            padding: 20px;

            margin: 10px;

            border: 1px solid #ddd;

            border-radius: 10px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);

            vertical-align: top;

            transition:
                transform 0.3s,
                box-shadow 0.3s;
        }

        .product10:hover {
            transform: translateY(-10px);

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.25);
        }

        .product10 h3 {
            transition:
                transform 0.3s;
        }

        .product10 h3:hover {
            transform: scale(1.1);
        }

        .buy10 {
            display: inline-block;

            padding: 8px 15px;

            border: 1px solid #333;

            text-decoration: none;

            color: black;

            transition:
                transform 0.3s;
        }

        .buy10:hover {
            transform: scale(1.05);
        }


    </style>
</head>

<body>

    <h1>CSS Transform 실습</h1>


    <!-- ==================================================
         실습 1
         ================================================== -->

    <h2>실습 1. 오른쪽 이동</h2>

    <div class="box1"></div>


    <!-- ==================================================
         실습 2
         ================================================== -->

    <h2>실습 2. 위로 이동</h2>

    <div class="box2"></div>


    <!-- ==================================================
         실습 3
         ================================================== -->

    <h2>실습 3. 확대</h2>

    <div class="box3"></div>


    <!-- ==================================================
         실습 4
         ================================================== -->

    <h2>실습 4. 회전</h2>

    <div class="box4"></div>


    <!-- ==================================================
         실습 5
         ================================================== -->

    <h2>실습 5. 기울이기</h2>

    <div class="box5"></div>


    <!-- ==================================================
         실습 6
         ================================================== -->

    <h2>실습 6. transform 조합</h2>

    <div class="box6"></div>


    <!-- ==================================================
         실습 7
         ================================================== -->

    <h2>실습 7. 카드 hover</h2>

    <div class="card7">

        <h3>
            카드 제목
        </h3>

        <p>
            마우스를 올려보세요.
        </p>

    </div>


    <!-- ==================================================
         실습 8
         ================================================== -->

    <h2>실습 8. 버튼 클릭 효과</h2>

    <a class="button8">
        클릭해보세요.
    </a>


    <!-- ==================================================
         실습 9
         ================================================== -->

    <h2>실습 9. 이미지 확대</h2>

    <div class="image9">

        <img
            src="https://picsum.photos/300/200"
            alt="샘플 이미지"
        >

    </div>


    <!-- ==================================================
         실습 10
         ================================================== -->

    <h2>실습 10. 상품 카드</h2>

    <div class="product10">

        <h3>
            운동화
        </h3>

        <p>
            편안한 데일리 운동화
        </p>

        <p>
            59,000원
        </p>

        <a class="buy10">
            구매하기
        </a>

    </div>


    <div class="product10">

        <h3>
            백팩
        </h3>

        <p>
            실용적인 데일리 백팩
        </p>

        <p>
            79,000원
        </p>

        <a class="buy10">
            구매하기
        </a>

    </div>


    <div class="product10">

        <h3>
            모자
        </h3>

        <p>
            가볍게 착용할 수 있는 데일리 모자
        </p>

        <p>
            29,000원
        </p>

        <a class="buy10">
            구매하기
        </a>

    </div>


</body>
</html>
