<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Selector</title>

    <style>

        /*
        ========================================
        1. 태그 선택자
        ========================================
        */

        h1 {
            color: blue;
        }

        p {
            color: gray;
        }


        /*
        ========================================
        2. 클래스 선택자
        ========================================
        */

        .red {
            color: red;
        }

        .big {
            font-size: 30px;
        }


        /*
        ========================================
        3. 아이디 선택자
        ========================================
        */

        #green {
            color: green;
        }


        /*
        ========================================
        4. 그룹 선택자
        ========================================
        */

        h2, h3 {
            color: purple;
        }


        /*
        ========================================
        5. 자손 선택자
        ========================================
        */

        .box p {
            color: orange;
        }


        /*
        ========================================
        6. 자식 선택자
        ========================================
        */

        .parent > span {
            color: hotpink;
        }


        /*
        ========================================
        7. 전체 선택자
        ========================================
        */

        * {
            font-family: Arial;
        }

    </style>
</head>
<body>

    <h1>태그 선택자</h1>

    <p>
        모든 p 태그에 적용됩니다.
    </p>


    <hr>


    <h2>클래스 선택자</h2>

    <p class="red">
        빨간색 글자
    </p>

    <p class="big">
        큰 글자
    </p>

    <p class="red big">
        빨간색 + 큰 글자
    </p>


    <hr>


    <h2>아이디 선택자</h2>

    <p id="green">
        초록색 글자
    </p>


    <hr>


    <h2>그룹 선택자</h2>

    <h3>보라색 제목</h3>


    <hr>


    <h2>자손 선택자</h2>

    <div class="box">

        <p>
            주황색 적용
        </p>

    </div>


    <p>
        적용되지 않음
    </p>


    <hr>


    <h2>자식 선택자</h2>

    <div class="parent">

        <span>
            자식 span
        </span>

        <div>

            <span>
                손자 span
            </span>

        </div>

    </div>

</body>
</html>
