<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CSS Display</title>

    <style>

        /*
        01. display: block

        block 요소는 한 줄 전체를 차지한다.

        대표적인 block 요소
        div, h1, p, ul, li 등

        특징
        - 한 줄 전체 차지
        - width, height 지정 가능
        - margin, padding 지정 가능
        */

        .box1 {
            width: 200px;
            height: 100px;
            border: 1px solid black;
        }


        /*
        02. display: inline

        inline 요소는 필요한 공간만 차지한다.

        대표적인 inline 요소
        span, a, strong, em 등

        특징
        - 같은 줄에 배치
        - width, height 지정이 제대로 적용되지 않음
        */

        .text2 {
            width: 200px;
            height: 100px;
            border: 1px solid red;
        }


        /*
        03. display: inline-block

        inline-block은 inline과 block의 특징을
        함께 가지고 있다.

        - 같은 줄에 배치할 수 있다.
        - width, height 지정 가능
        - padding, margin 사용 가능
        */

        .box3 {
            display: inline-block;

            width: 150px;
            height: 100px;

            border: 1px solid blue;
        }


        /*
        04. display 변경하기

        div는 기본적으로 block 요소이지만
        display 속성을 변경하면 inline-block으로
        사용할 수 있다.
        */

        .box4 {
            display: inline-block;

            width: 150px;
            height: 100px;

            border: 1px solid green;

            margin: 10px;
        }


        /*
        05. inline → block

        span은 기본적으로 inline 요소이다.

        display: block을 사용하면
        block 요소처럼 사용할 수 있다.
        */

        .text5 {
            display: block;

            width: 300px;
            height: 50px;

            border: 1px solid orange;

            margin: 10px;
        }


        /*
        06. display: none

        display: none을 사용하면
        요소가 화면에서 보이지 않는다.

        또한 요소가 차지하던 공간도 사라진다.
        */

        .hidden {
            display: none;
        }


        /*
        07. 메뉴 만들기

        li는 기본적으로 block 요소이므로
        여러 개를 작성하면 세로로 배치된다.

        display: inline-block을 사용하면
        가로 방향으로 배치할 수 있다.
        */

        .menu {
            padding: 0;
        }

        .menu li {
            display: inline-block;

            width: 120px;
            padding: 10px;

            border: 1px solid black;

            text-align: center;
        }


    </style>
</head>

<body>

    <h1>CSS Display</h1>


    <!-- 01. display: block -->

    <h2>display: block</h2>

    <div class="box1">Box 1</div>
    <div class="box1">Box 2</div>
    <div class="box1">Box 3</div>

    <!-- 02. display: inline -->
    <h2>display: inline</h2>

    <span class="text2">HTML</span>
    <span class="text2">CSS</span>
    <span class="text2">JavaScript</span>


    <!-- 03. display: inline-block -->

    <h2>display: inline-block</h2>

    <div class="box3">Box 1</div>
    <div class="box3">Box 2</div>
    <div class="box3">Box 3</div>


    <!-- 04. display 변경하기 -->

    <h2>block → inline-block</h2>

    <div class="box4">Box 1</div>
    <div class="box4">Box 2</div>
    <div class="box4">Box 3</div>


    <!-- 05. inline → block -->
    <h2>inline → block</h2>

    <span class="text5">HTML</span>
    <span class="text5">CSS</span>
    <span class="text5">JavaScript</span>


    <!-- 06. display: none -->

    <h2>display: none</h2>

    <div>Box 1</div>

    <div class="hidden">Box 2</div>

    <div>Box 3</div>


    <!-- 07. 메뉴 만들기 -->
    <h2>메뉴 만들기</h2>
    <ul class="menu">
        <li>홈</li>
        <li>상품</li>
        <li>이벤트</li>
        <li>고객센터</li>
    </ul>

</body>
</html>
