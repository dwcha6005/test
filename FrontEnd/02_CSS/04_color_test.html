<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Color Practice</title>

<style>

    /*
    실습 1
    h1: 파란색, p: 회색
    */
    h1 {
        color: blue;
    }
    p {
        color: gray;
    }

    /*
    실습 2

    .warning: 빨간색
    .success: 초록색
    */
    .warning {
        color: red;
    }
    .success {
        color: green;
    }

    /*
    실습 3

    .notice: 노란 배경
    .dark: 검은 배경, 흰색 글자
    */
    .notice {
        background-color: yellow;
    }
    .dark {
        background-color: black;
        color: white;
    }

    /*
    실습 4

    .hex(HEX 사용): #ff6600
    */
    .hex {
        color: #ff6600;
    }

    /*
    실습 5

    쇼핑몰 꾸미기

    .shop-title: navy
    .menu a: darkred
    .sale: red
    .event: rgba 사용
    배경 빨강: 투명도 0.2
    */
    .shop-title {
        color: navy;
    }
    .menu a {
        color: darkred;
    }
    .sale {
        color: red;
    }
    .event {
        background-color: rgba(255, 0, 0, 0.2);
    }


</style>
</head>
<body>

<hr>
<h2>실습 1</h2>

<h1>웹 개발</h1>

<p>HTML과 CSS</p>
<hr>

<h2>실습 2</h2>

<p class="warning">오류가 발생했습니다.</p>
<p class="success">저장되었습니다.</p>
<hr>

<h2>실습 3</h2>
<p class="notice">공지사항입니다.</p>
<p class="dark">다크 모드</p>
<hr>

<h2>실습 4</h2>
<p class="hex">HEX 색상 적용</p>
<hr>

<h2>실습 5 - 쇼핑몰</h2>
<h1 class="shop-title">My Shop</h1>
<nav class="menu">
    <a href="#">홈</a>
    <a href="#">상품</a>
    <a href="#">게시판</a>
</nav>
<p class="sale">50% 할인</p>
<p class="event">이벤트 진행중</p>

</body>
</html>
