<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Background Practice</title>

<style>

    /*
    =====================================
    실습 1

    .box1

    배경색
    lightblue
    =====================================
    */
    .box1 {
        background-color: lightblue;
    }

    /*
    =====================================
    실습 2
    .box2

    배경 이미지 적용

    images/bg.jpg
    =====================================
    */
    .box2 {
        background-image:
            url("images/bg.jpg");
    }

    /*
    =====================================
    실습 3

    .box3

    배경 이미지 적용

    반복 제거
    =====================================
    */
    .box3 {

        background-image:
            url("images/icon.png");

        background-repeat:
            no-repeat;
    }

    /*
    =====================================
    실습 4

    .box4

    이미지 가운데 배치

    =====================================
    */
    .box4 {

        background-image:
            url("images/icon.png");

        background-repeat:
            no-repeat;

        background-position:
            center;

    }

    /*
    =====================================
    실습 5

    쇼핑몰 메인 배너

    .banner

    bg.jpg

    반복 제거

    가운데 배치

    cover 사용

    =====================================
    */
    .banner {

        background-image:
            url("images/bg.jpg");

        background-repeat:
            no-repeat;

        background-position:
            center;

        background-size:
            cover;

    }

   

</style>
</head>
<body>

<hr>
<h2>실습 1</h2>

<div class="box1">

    배경색

</div>



<hr>
<h2>실습 2</h2>

<div class="box2">

</div>



<hr>
<h2>실습 3</h2>

<div class="box3">

</div>



<hr>
<h2>실습 4</h2>

<div class="box4">

</div>



<hr>
<h2>실습 5 - 쇼핑몰 배너</h2>

<div class="banner">

    여름 세일

</div>

</body>
</html>
