<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Font</title>

<style>

    /* 1. font-size: 글자 크기 */
    .size1 {
        font-size: 16px;
    }
    .size2 {
        font-size: 24px;
    }

    /* 2. font-family: 글꼴 */
    .family1 {
        font-family: "궁서";
    }
    .family2 {
        font-family: Arial;
    }
    /* font-family: Arial, Helvetica, sans-serif; */

    /* 3. font-weight: 글자 굵기 */
    .weight1 {
        font-weight: normal;
    }
    .weight2 {
        font-weight: bold;
    }
    .weight3 {
        font-weight: 900;
    }

    /* 4. font-style: 기울임 */
    .style1 {
        font-style: normal;
    }

    .style2 {
        font-style: italic;
    }


    /* 5. text-align: 정렬 */
    .left {
        text-align: left;
    }

    .center {
        text-align: center;
    }

    .right {
        text-align: right;
    }


    /* 6. line-height: 줄 간격 */
    .line {
        line-height: 2;
    }


    /* 7. text-decoration: 밑줄 */
    .underline {
        text-decoration: underline;
    }
    .through {
        text-decoration: line-through;
    }
    .none {
        text-decoration: none;
    }

</style>
</head>
<body>

<h1>font-size</h1>
<p class="size1">기본 크기</p>
<p class="size2">큰 글자</p>
<hr>

<h1>font-family</h1>
<p class="family1">궁서체</p>
<p class="family2">Arial</p>
<hr>

<h1>font-weight</h1>
<p class="weight1">normal</p>
<p class="weight2">bold</p>
<p class="weight3">900</p>
<hr>

<h1>font-style</h1>
<p class="style1">normal</p>
<p class="style2">italic</p>
<hr>

<h1>text-align</h1>
<p class="left">왼쪽 정렬</p>
<p class="center">가운데 정렬</p>
<p class="right">오른쪽 정렬</p>
<span class="right">asdasd</span>
<hr>

<h1>line-height</h1>
<p class="line">
    HTML과 CSS를 공부하고 있습니다.
    HTML과 CSS를 공부하고 있습니다.
    HTML과 CSS를 공부하고 있습니다.
    HTML과 CSS를 공부하고 있습니다.
</p>
<hr>

<h1>text-decoration</h1>
<p class="underline">밑줄</p>
<p class="through">취소선</p>
<a href="#" class="none">밑줄 제거 링크</a>

</body>
</html>
