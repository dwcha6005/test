<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transition 실습</title>

    <style>

        /*
        ==================================================
        실습 1. 배경색 부드럽게 변경
        ==================================================

        마우스를 올리면 배경색이 변경되는 박스입니다.

        transition을 사용하여
        배경색이 1초 동안 부드럽게 변경되도록 만드세요.

        조건

        - transition
        - background-color
        - 1s
        */

        .box1 {
            width: 200px;
            height: 100px;

            background-color: lightblue;

            transition: background-color 1s;
        }

        .box1:hover {
            background-color: lightcoral;
        }


        /*
        ==================================================
        실습 2. 크기 변경
        ==================================================

        마우스를 올리면 박스의 width가

        200px → 300px

        으로 변경되도록 만드세요.

        단, 변화가 0.5초 동안 부드럽게 진행되어야 합니다.
        */

        .box2 {
            width: 200px;
            height: 100px;

            background-color: lightblue;

            transition: width 0.5s;
        }

        .box2:hover {
            width: 300px;
        }


        /*
        ==================================================
        실습 3. 여러 속성 동시에 변경
        ==================================================

        hover했을 때

        1. width → 300px
        2. background-color → lightcoral
        3. border-radius → 20px

        로 변경하세요.

        transition: all 0.5s를 사용해보세요.
        */

        .box3 {
            width: 200px;
            height: 100px;

            background-color: lightblue;

            transition: all 0.5s;
        }

        .box3:hover {
            width: 300px;

            background-color: lightcoral;

            border-radius: 20px;
        }


        /*
        ==================================================
        실습 4. 확대 효과
        ==================================================

        마우스를 올리면
        박스가 1.2배 커지도록 만드세요.

        transform: scale()
        transition을 함께 사용합니다.
        */

        .box4 {
            width: 150px;
            height: 150px;

            background-color: lightblue;

            transition: transform 0.5s;
        }

        .box4:hover {
            transform: scale(1.2);
        }


        /*
        ==================================================
        실습 5. 회전 효과
        ==================================================

        마우스를 올리면
        박스가 45도 회전하도록 만드세요.

        조건

        - transform: rotate()
        - transition: transform 0.5s
        */

        .box5 {
            width: 120px;
            height: 120px;

            background-color: lightblue;

            transition: transform 0.5s;
        }

        .box5:hover {
            transform: rotate(45deg);
        }


        /*
        ==================================================
        실습 6. 위로 올라오는 카드
        ==================================================

        카드에 마우스를 올리면

        - 위로 10px 이동
        - 그림자가 커짐

        효과를 만들어보세요.

        transition을 이용해서
        부드럽게 변경되어야 합니다.

        앞에서 배운

        transform
        box-shadow
        :hover

        를 함께 사용하세요.
        */

        .card6 {
            width: 250px;

            padding: 20px;

            border: 1px solid #ddd;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);

            transition:
                transform 0.3s,
                box-shadow 0.3s;
        }

        .card6:hover {
            transform: translateY(-10px);

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.25);
        }


        /*
        ==================================================
        실습 7. 버튼 효과
        ==================================================

        버튼에 마우스를 올리면

        - 배경색 변경
        - 글자색 변경
        - 그림자 변경

        이 되도록 만드세요.

        세 가지 변화 모두
        0.3초 동안 부드럽게 진행합니다.
        */

        .button7 {
            display: inline-block;

            padding: 12px 25px;

            border: 1px solid #333;

            text-decoration: none;

            color: black;

            box-shadow:
                0 3px 0 #333;

            transition:
                background-color 0.3s,
                color 0.3s,
                box-shadow 0.3s;
        }

        .button7:hover {
            background-color: black;

            color: white;

            box-shadow:
                0 5px 10px rgba(0, 0, 0, 0.2);
        }


        /*
        ==================================================
        실습 8. opacity 효과
        ==================================================

        박스의 기본 opacity를 0.5로 만들고

        마우스를 올리면 opacity가 1이 되도록 하세요.

        변화는 0.5초 동안 진행합니다.
        */

        .box8 {
            width: 200px;
            height: 100px;

            background-color: lightblue;

            opacity: 0.5;

            transition: opacity 0.5s;
        }

        .box8:hover {
            opacity: 1;
        }


        /*
        ==================================================
        실습 9. 이미지 확대
        ==================================================

        이미지에 마우스를 올리면
        이미지가 1.1배 확대되도록 만드세요.

        단, 이미지가 원래 영역 밖으로
        삐져나오지 않도록 해야 합니다.

        힌트

        이미지 부모 요소에

        overflow: hidden;

        을 사용하세요.
        */

        .image9 {
            width: 300px;
            height: 200px;

            overflow: hidden;
        }

        .image9 img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            transition: transform 0.5s;
        }

        .image9:hover img {
            transform: scale(1.1);
        }


        /*
        ==================================================
        실습 10. 쇼핑몰 상품 카드 종합 실습
        ==================================================

        실제 쇼핑몰에서 볼 수 있는
        상품 카드 UI를 만들어보세요.

        조건

        1. 카드 3개를 가로 배치

        2. 카드에 border와 border-radius 적용

        3. 기본적으로 약한 box-shadow 적용

        4. 마우스를 올리면
           카드가 위로 10px 이동

        5. 마우스를 올리면
           그림자가 커짐

        6. 상품명에 transition 적용

        7. 구매 버튼에 hover 효과 적용

        8. 구매 버튼의 변화도 부드럽게 처리

        지금까지 배운

        - box model
        - display
        - border-radius
        - box-shadow
        - transform
        - :hover
        - transition

        을 모두 활용하는 종합 실습입니다.
        */

        .product10 {
            display: inline-block;

            width: 220px;

            padding: 20px;

            margin: 10px;

            border: 1px solid #ddd;

            border-radius: 10px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);

            vertical-align: top;

            transition:
                transform 0.3s,
                box-shadow 0.3s;
        }

        .product10:hover {
            transform: translateY(-10px);

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.25);
        }

        .product10 h3 {
            transition:
                color 0.3s;
        }

        .product10:hover h3 {
            color: blue;
        }

        .buy10 {
            display: inline-block;

            padding: 8px 15px;

            border: 1px solid #333;

            text-decoration: none;

            color: black;

            transition:
                background-color 0.3s,
                color 0.3s;
        }

        .buy10:hover {
            background-color: black;

            color: white;
        }


    </style>
</head>

<body>

    <h1>CSS Transition 실습</h1>


    <!-- ==================================================
         실습 1. 배경색 변경
         ================================================== -->

    <h2>실습 1. 배경색 변경</h2>

    <div class="box1"></div>


    <!-- ==================================================
         실습 2. 크기 변경
         ================================================== -->

    <h2>실습 2. 크기 변경</h2>

    <div class="box2"></div>


    <!-- ==================================================
         실습 3. 여러 속성
         ================================================== -->

    <h2>실습 3. 여러 속성 변경</h2>

    <div class="box3"></div>


    <!-- ==================================================
         실습 4. 확대
         ================================================== -->

    <h2>실습 4. 확대 효과</h2>

    <div class="box4"></div>


    <!-- ==================================================
         실습 5. 회전
         ================================================== -->

    <h2>실습 5. 회전 효과</h2>

    <div class="box5"></div>


    <!-- ==================================================
         실습 6. 카드
         ================================================== -->

    <h2>실습 6. 카드 hover</h2>

    <div class="card6">

        <h3>
            카드 제목
        </h3>

        <p>
            마우스를 올려보세요.
        </p>

    </div>


    <!-- ==================================================
         실습 7. 버튼
         ================================================== -->

    <h2>실습 7. 버튼</h2>

    <a class="button7">
        구매하기
    </a>


    <!-- ==================================================
         실습 8. opacity
         ================================================== -->

    <h2>실습 8. opacity</h2>

    <div class="box8"></div>


    <!-- ==================================================
         실습 9. 이미지 확대
         ================================================== -->

    <h2>실습 9. 이미지 확대</h2>

    <div class="image9">

        <img
            src="https://picsum.photos/300/200"
            alt="샘플 이미지"
        >

    </div>


    <!-- ==================================================
         실습 10. 상품 카드 종합
         ================================================== -->

    <h2>실습 10. 쇼핑몰 상품 카드</h2>

    <div class="product10">

        <h3>
            운동화
        </h3>

        <p>
            편안한 데일리 운동화
        </p>

        <p>
            59,000원
        </p>

        <a class="buy10">
            구매하기
        </a>

    </div>


    <div class="product10">

        <h3>
            백팩
        </h3>

        <p>
            실용적인 데일리 백팩
        </p>

        <p>
            79,000원
        </p>

        <a class="buy10">
            구매하기
        </a>

    </div>


    <div class="product10">

        <h3>
            모자
        </h3>

        <p>
            가볍게 착용할 수 있는 데일리 모자
        </p>

        <p>
            29,000원
        </p>

        <a class="buy10">
            구매하기
        </a>

    </div>


</body>
</html>
