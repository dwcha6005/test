<!-- HTML5 문서 선언 -->
<!DOCTYPE html> 
<!-- 기능 -->
<html lang="ko">
<!-- 브라우제에게 알려주는 정보 -->
<head>
    <!-- JS연결, CSS연결, SEO, Favicon 등 -->

    <!-- 
    SEO란? Search Engine Optimization의 약자로 "검색 엔진 최적화" 
    <meta name="keywords" content="부산국비지원, 자바학원, 스프링, 리액트"> 
    -->

    <!-- 한글 깨짐 방지 -->
    <meta charset="UTF-8">
    <!-- 반응형 웹을 위한 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭 부분에 보여지는 제목 -->
    <title>Document</title>
</head>
<body>
    <!-- 사용자에게 표시되는 영역 -->
</body>
</html>
