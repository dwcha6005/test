<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Test</title>
</head>
<body>

    <!-- 

    < 쇼핑몰 카테고리 메뉴 만들기 >

    쇼핑몰
    │
    ├─ 전체상품
    │
    ├─ 여성
    │  ├─ 상의
    │  ├─ 하의
    │  └─ 신발
    │
    ├─ 남성
    │  ├─ 상의
    │  ├─ 하의
    │  └─ 신발
    │
    └─ 인기상품 TOP 3
        1. 무지 반팔 티셔츠
        2. 데님 팬츠
        3. 러닝화
    -->
    <ul>
        <li>전체상품</li>

        <li>
            여성
            <ul>
                <li>상의</li>
                <li>하의</li>
                <li>신발</li>
            </ul>
        </li>

        <li>
            남성
            <ul>
                <li>상의</li>
                <li>하의</li>
                <li>신발</li>
            </ul>
        </li>

        <li>
            인기상품 TOP 3
            <ol>
                <li>무지 반팔 티셔츠</li>
                <li>데님 팬츠</li>
                <li>러닝화</li>
            </ol>
        </li>
    </ul>

</body>
</html>
