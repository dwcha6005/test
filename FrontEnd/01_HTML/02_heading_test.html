    <!-- 
    1. 주어진 내용을 보고 h1 ~ h3으로 구조를 만들어 보시오.
    엠비씨 아카데미
    │
    ├─ 교육과정
    │  ├─ Java 풀스택 개발자
    │  ├─ Python AI 개발자
    │  └─ 프론트엔드 개발자

    │  └─ 휴게공간
    │
    └─ 학원소개
    ├─ 강사소개
    └─ 오시는 길

    <h1>엠비씨 아카데미</h1>

    2. 잘못된 heading 구조를 찾아 수정
    -->

    <h3>한식</h3>
