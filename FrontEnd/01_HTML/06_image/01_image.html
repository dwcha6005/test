<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Image</title>
</head>
<body>

    <h1>HTML Image</h1>

    <!--
        1. 이미지 삽입
        
        <img> 태그를 사용하여 이미지를 표시한다.

        src : 이미지 파일의 경로
        alt : 이미지에 대한 설명
    -->

    <h2>1. 이미지 삽입</h2>

    <img src="cat.jpg" alt="고양이">


    <!--
        2. 이미지 경로
    -->

    <h2>2. 이미지 경로</h2>

    <!-- 같은 폴더 -->
    <img src="cat.jpg" alt="고양이">

    <!-- 하위 폴더 -->
    <img src="images/dog.jpg" alt="강아지">


    <!--
        3. 이미지 크기
        
        width  : 이미지 너비
        height : 이미지 높이
        
        일반적으로 한쪽 크기만 지정하면
        원본 비율을 유지할 수 있다.
    -->

    <h2>3. 이미지 크기</h2>

    <img src="cat.jpg" alt="고양이" width="500">

    <br><br>

    <img src="cat.jpg" alt="고양이" width="500" height="200">


    <!--
        ========================================
        4. alt 속성
        ========================================
        
        alt는 이미지의 내용을 설명한다.
        
        이미지가 표시되지 않거나
        스크린리더를 사용하는 경우 활용된다.
    -->

    <h2>4. alt 속성</h2>

    <img src="cat.jpg" alt="소파 위에 앉아 있는 고양이">


    <!-- 장식용 이미지는 alt를 비워둘 수 있다. -->
    <img src="line.png" alt="">


    <!--
        ========================================
        5. 이미지에 링크 걸기
        ========================================
        
        <a> 태그 안에 <img>를 넣으면
        이미지를 클릭하여 다른 페이지로 이동할 수 있다.
    -->

    <h2>5. 이미지에 링크 걸기</h2>

    <a href="https://www.google.com">
        <img src="images/google.png" alt="Google" width="200">
    </a>







</body>
</html>
