<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Test</title>
</head>
<body>
    
    <!-- 
            학생성적표
    이름      국어    영어    수학
    홍길동     90      85      95
    김철수     80      90      85
    이영희     95      95      90
    -->
    <table>
        <caption>학생 성적표</caption>
        <tr>
            <th>이름</th>
            <th>국어</th>
            <th>영어</th>
            <th>수학</th>
        </tr>
        <tr>
            <td>홍길동</td>
            <td>90</td>
            <td>85</td>
            <td>95</td>
        </tr>
        <tr>
            <td>김철수</td>
            <td>80</td>
            <td>90</td>
            <td>85</td>
        </tr>
        <tr>
            <td>이영희</td>
            <td>95</td>
            <td>95</td>
            <td>90</td>
        </tr>
    </table>

    <!-- 
              국어    영어    수학
    홍길동     90      85      95
    김철수     80      90      85
                평균 점수 : 87.5
    -->
    <table>
        <tr>
            <th>이름</th>
            <th>국어</th>
            <th>영어</th>
            <th>수학</th>
        </tr>

        <tr>
            <td>홍길동</td>
            <td>90</td>
            <td>85</td>
            <td>95</td>
        </tr>

        <tr>
            <td>김철수</td>
            <td>80</td>
            <td>90</td>
            <td>85</td>
        </tr>

        <tr>
            <td colspan="4">평균 점수 : 87.5</td>
        </tr>
    </table>
    <!-- 
    카테고리    상품명          가격
    상의        반팔 티셔츠     20,000원
                긴팔 티셔츠     30,000원
    하의        청바지          50,000원
                반바지          30,000원    
    -->
    <table>
        <tr>
            <th>카테고리</th>
            <th>상품명</th>
            <th>가격</th>
        </tr>

        <tr>
            <td rowspan="2">상의</td>
            <td>반팔 티셔츠</td>
            <td>20,000원</td>
        </tr>

        <tr>
            <td>긴팔 티셔츠</td>
            <td>30,000원</td>
        </tr>

        <tr>
            <td rowspan="2">하의</td>
            <td>청바지</td>
            <td>50,000원</td>
        </tr>

        <tr>
            <td>반바지</td>
            <td>30,000원</td>
        </tr>
    </table>


</body>
</html>
