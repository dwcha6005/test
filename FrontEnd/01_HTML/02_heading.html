<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Heading</title>
</head>

<!-- 나중에 css에서 크기, 모양, 색상 등 변경 -->
<style>
    h1 {
        font-size: 20px;
    }
</style>

<body>

    <!-- 
    < 제목 태그 h1 ~ h6 >
    - h1 부터 h6 까지 존재하며 점점 크기가 작아진다.
    - 단순 폰크 크기 용도로 사용하는 것이 아니라 "계층 구조"를 위해 사용
    - 계층 구조가 잘 잡혀있으면 검색 엔진이 페이지의 구조와 주제를 파악하기 편함 (SEO에 유리)

    예)
    <h1>우리 회사</h1>

    <h2>회사 소개</h2>
    <h3>회사 연혁</h3>
    <h3>조직도</h3>

    <h2>사업 분야</h2>
    <h3>웹 개발</h3>
    <h3>AI 개발</h3>
    
    -->
    <h1>HTML 수업</h1>
    <h2>HTML 기본 문법</h2>
    <h3>제목 태그</h3>
    <h4>h4 제목</h4>
    <h5>h5 제목</h5>
    <h6>h6 제목</h6>

</body>
</html>
