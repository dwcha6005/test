<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form</title>
</head>
<body>

    <h1>HTML Form</h1>
    <!--
        1. form

        <form>은 사용자가 입력한 데이터를
        서버로 전송하기 위한 영역이다.

        action : 데이터를 전송할 주소
        method : 데이터를 전송하는 방법
    -->

    <h2>1. form</h2>

    <form action="#" method="get">
        <input type="text">
        <button type="submit">전송</button>
    </form>


    <!--
        2. label
        <label>은 입력 요소의 제목을 나타낸다.
        for와 input의 id를 연결할 수 있다.
    -->

    <h2>2. label</h2>
    <form>
        <label for="name">이름</label>
        <input type="text" id="name">
    </form>


    <!-- 3. input - text -->

    <h2>3. text</h2>
    <label for="userName">이름</label>
    <input type="text" id="userName">

    <!-- 4. input - password -->
    <h2>4. password</h2>
    <label for="password">비밀번호</label>
    <input type="password" id="password">

    <!--
        5. input - email 
        => 일반적인 text와 비슷해 보이지만 모바일에서 
           @ 문자 및 . 문자와 같은 "이메일 주소 입력에 편리한 키패드" 지원됨
    -->

    <h2>5. email</h2>

    <label for="email">이메일</label>
    <input type="email" id="email">


    <!--
        ========================================
        6. input - number
        ========================================
    -->

    <h2>6. number</h2>

    <label for="age">나이</label>
    <input type="number" id="age">


    <!--
        ========================================
        7. radio
        ========================================

        여러 개 중 하나를 선택할 때 사용한다.

        같은 그룹의 radio는
        같은 name을 사용한다.
    -->

    <h2>7. radio</h2>

    <input type="radio" id="male" name="gender" value="male">
    <label for="male">남성</label>

    <input type="radio" id="female" name="gender" value="female">
    <label for="female">여성</label>


    <!--
        8. checkbox

        여러 개를 선택할 수 있다.
        선택한 항목의 갯수에 상관없이 서버로 전송될때 같은 변수명으로 전달되어야 하므로 name 속성의 값이 일치해야한다.       
    -->

    <h2>8. checkbox</h2>

    <input type="checkbox" id="html" name="skill" value="html">
    <label for="html">HTML</label>

    <input type="checkbox" id="css" name="skill" value="css">
    <label for="css">CSS</label>

    <input type="checkbox" id="javascript" name="skill" value="javascript">
    <label for="javascript">JavaScript</label>


    <!--
        9. select
    -->

    <h2>9. select</h2>

    <label for="job">직업</label>

    <select id="job" name="job">
        <option value="">선택하세요</option>
        <option value="student">학생</option>
        <option value="developer">개발자</option>
        <option value="designer">디자이너</option>
    </select>


    <!-- 10. textarea -->
    <h2>10. textarea</h2>

    <label for="message">문의 내용</label>
    <textarea id="message" name="message" rows="5" cols="40"></textarea>


    <!-- 11. button -->
    <h2>11. button</h2>

    <button type="button">일반 버튼</button>
    <button type="submit">전송</button>
    <button type="reset">초기화</button>


    <!--
        ========================================
        12. name과 value
        ========================================

        서버로 데이터를 전송할 때
        name과 value가 중요하다.

        예:
        name="userName"
        value="홍길동"

        → userName=홍길동
    -->

    <h2>12. name과 value</h2>

    <form action="#" method="get">

        <label for="userName2">이름</label>
        <input type="text"
               id="userName2"
               name="userName">

        <button type="submit">전송</button>

    </form>


    <!--
        13. submit
    -->

    <h2>13. 회원가입 폼</h2>

    <form action="#">
        <input type="hidden" name="test" value="테스트">

        <input type="submit" value="input submit">
        <button>버튼(default)</button>
        <button type="submit">버튼(submit)</button>
        <button type="button">버튼(button)</button>
    </form>

</body>
</html>
