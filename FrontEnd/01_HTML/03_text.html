<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text</title>
</head>
<body>
    <!-- p 태그 (Paragraph): 하나의 문단을 표시할때 <p>태그 사용 -->
    <p>HTML은 웹 페이지의 구조를 만드는 언어입니다.</p>
    <p>CSS는 웹 페이지의 디자인을 담당합니다.</p>

    <!-- br 태그: 강제 줄바꿈 -->
    안녕하세요.<br>
    저는 홍길동입니다.

    <hr>

    <!-- strong: 중요하다는 의미, b: 시각적으로 굵게  -->
    <strong>중요한 내용</strong><br>
    <b>굵은 글씨</b>    

    <br>

    <!-- em: 내용을 강조한다는 의미, i: 단순 기울임 -->
    <em>강조할 내용</em><br>
    <i>기울임 글씨</i>

    <!-- 
    < 시멘틱(Semantic) 태그 = 의미가 있는 태그 >
    - 웹접근성, 유지보수, SEO 등을 신경 쓴다면 의미가 있는 태그를 사용해야함
    <header>	: 페이지/영역의 머리말
    <nav>		: 주요 내비게이션
    <main>		: 페이지의 주요 콘텐츠
    <section>	: 콘텐츠의 하나의 주제 영역
    <article>	: 독립적인 콘텐츠
    <footer> 	: 페이지/영역의 바닥글
    -->
</body>
</html>
