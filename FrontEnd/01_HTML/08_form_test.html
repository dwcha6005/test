<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Test</title>
</head>
<body>
    <!-- 
    회원가입
    이름 (input 타입: text, name으로 전송)
    [                    ]

    이메일 (input 타입: email, email로 전송)
    [                    ]

    비밀번호 (input 타입: password, passwd로 전송)
    [                    ]

    나이 (input 타입: number, age로 전송)
    [                    ]

    성별 (radio, gender로 전송)
    ○ 남성  ○ 여성

    관심 기술 (checkbox, skill로 전송)
    □ HTML
    □ CSS
    □ JavaScript

    직업 (select 옵션: 개발자, 디자이너, 학생 job으로 전송)
    [ 선택하세요 ▼ ]

    자기소개 (textarea, self로 전송)
    [                    ]
    [                    ]
    [                    ]

    [ 회원가입 ] [ 초기화 ]
    -->
    <form action="#" method="get">
        <p>
            <label for="name">이름</label>
            <input type="text"
                id="name"
                name="name">
        </p>
        <p>
            <label for="email">이메일</label>
            <input type="email"
                id="email"
                name="email">
        </p>
        <p>
            <label for="password">비밀번호</label>
            <input type="password"
                id="password"
                name="password">
        </p>
        <p>
            <label for="age">나이</label>
            <input type="number"
                id="age"
                name="age">
        </p>
        <p>
            성별

            <input type="radio"
                id="male"
                name="gender"
                value="male">
            <label for="male">남성</label>

            <input type="radio"
                id="female"
                name="gender"
                value="female">
            <label for="female">여성</label>
        </p>
        <p>
            관심 기술

            <input type="checkbox"
                id="html"
                name="skill"
                value="html">
            <label for="html">HTML</label>

            <input type="checkbox"
                id="css"
                name="skill"
                value="css">
            <label for="css">CSS</label>

            <input type="checkbox"
                id="javascript"
                name="skill"
                value="javascript">
            <label for="javascript">JavaScript</label>
        </p>
        <p>
            <label for="job">직업</label>

            <select id="job" name="job">
                <option value="">선택하세요</option>
                <option value="student">학생</option>
                <option value="developer">개발자</option>
                <option value="designer">디자이너</option>
            </select>
        </p>
        <p>
            <label for="message">자기소개</label>
            <br>

            <textarea id="message"
                    name="message"
                    rows="5"
                    cols="40"></textarea>
        </p>
        <button type="submit">회원가입</button>
        <button type="reset">초기화</button>
    </form>
</body>
</html>
