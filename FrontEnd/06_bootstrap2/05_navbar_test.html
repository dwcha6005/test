<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar 실습</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- 문제 1. 기본 Navbar -->
<!-- 작성 조건
1. 화면 양쪽에 너무 붙지 않도록 적당한 가로 여백을 만든다. (정답: container)
2. 사이트 이름을 강조해서 표시한다. (정답 예: navbar-brand fw-bold)
3. 메뉴를 가로 방향으로 배치한다. (정답: navbar-nav + flex-row)
4. 메뉴 사이에 일정한 간격을 준다. (정답 예: gap-3)
-->
<nav class="navbar bg-light">
    <div class="container">
        <a class="navbar-brand fw-bold" href="javascript:void(0)">개발자 교육센터</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link active" href="javascript:void(0)">홈</a>
            <a class="nav-link" href="javascript:void(0)">교육과정</a>
            <a class="nav-link" href="javascript:void(0)">수강후기</a>
            <a class="nav-link" href="javascript:void(0)">문의하기</a>
        </div>
    </div>
</nav>

<!-- 문제 2. 어두운 Navbar -->
<!-- 작성 조건
1. Navbar 전체에 어두운 배경을 적용한다. (정답 예: bg-dark)
2. 어두운 배경에서도 글자가 잘 보이도록 한다. (정답: navbar-dark)
3. 사이트 이름은 굵게 표시한다.
4. 메뉴는 가로로 배치한다.
-->
<nav class="navbar bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="javascript:void(0)">WEB CAMP</a>
        <div class="navbar-nav flex-row gap-4">
            <a class="nav-link active" href="javascript:void(0)">홈</a>
            <a class="nav-link" href="javascript:void(0)">과정</a>
            <a class="nav-link" href="javascript:void(0)">커뮤니티</a>
            <a class="nav-link" href="javascript:void(0)">취업지원</a>
        </div>
    </div>
</nav>

<!-- 문제 3. 반응형 Navbar -->
<!-- 작성 조건
1. 사이트 이름과 메뉴를 하나의 Navbar로 구성한다.
2. 넓은 화면에서는 메뉴가 가로로 표시되도록 한다. (정답 예: navbar-expand-lg)
3. 좁은 화면에서는 메뉴를 접을 수 있도록 만든다.
4. 좁은 화면에서 메뉴 버튼이 나타나도록 한다.
5. 버튼을 클릭하면 메뉴가 열리고 다시 클릭하면 닫혀야 한다.
6. 메뉴 영역과 버튼이 정상적으로 연결되어야 한다.
-->
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="javascript:void(0)">CODE BOOTCAMP</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#practiceNavbar" aria-controls="practiceNavbar" aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="practiceNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="javascript:void(0)">홈</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)">교육과정</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)">수강후기</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)">취업지원</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 문제 4. Dropdown 메뉴 -->
<!-- 작성 조건
1. 교육과정 메뉴를 클릭하면 하위 메뉴가 나타나도록 만든다.
2. 하위 메뉴에 3개의 교육과정을 넣는다.
3. 각각의 하위 메뉴를 클릭할 수 있는 형태로 만든다.
4. Bootstrap의 Dropdown 기능을 이용한다. (정답: dropdown / dropdown-toggle / dropdown-menu / dropdown-item)
-->
<nav class="navbar bg-primary navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="javascript:void(0)">CODE CAMP</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" href="javascript:void(0)">홈</a>
            <div class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="javascript:void(0)" role="button" data-bs-toggle="dropdown" aria-expanded="false">교육과정</a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="javascript:void(0)">Java 웹 개발</a></li>
                    <li><a class="dropdown-item" href="javascript:void(0)">프론트엔드 개발</a></li>
                    <li><a class="dropdown-item" href="javascript:void(0)">Python & AI</a></li>
                </ul>
            </div>
            <a class="nav-link" href="javascript:void(0)">수강후기</a>
        </div>
    </div>
</nav>

<!-- 문제 5. Navbar + 검색 -->
<!-- 작성 조건
1. 왼쪽에는 사이트 이름과 메뉴를 배치한다.
2. 오른쪽에는 검색창과 검색 버튼을 배치한다.
3. 넓은 화면에서는 메뉴와 검색 영역이 한 줄에 표시되도록 한다.
4. 좁은 화면에서는 메뉴를 접을 수 있도록 한다.
5. 검색창과 버튼은 Bootstrap Form과 Button을 활용한다.
-->
<nav class="navbar navbar-expand-lg bg-light">
    <div class="container">
        <a class="navbar-brand fw-bold" href="javascript:void(0)">DEV ACADEMY</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#searchPractice" aria-controls="searchPractice" aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="searchPractice">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" href="javascript:void(0)">홈</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)">교육과정</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)">공지사항</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="검색어 입력">
                <button class="btn btn-primary" type="submit">검색</button>
            </form>
        </div>
    </div>
</nav>

<!-- 문제 6. 교육센터 통합 Navbar -->
<!-- 작성 조건
1. 사이트 이름을 왼쪽에 배치한다.
2. 교육과정, 수강후기, 취업지원 메뉴를 구성한다.
3. 교육과정에는 하위 메뉴를 만든다.
4. 넓은 화면에서는 메뉴를 가로로 표시한다.
5. 좁은 화면에서는 메뉴를 접었다 펼칠 수 있도록 한다.
6. 오른쪽에는 수강신청 버튼을 배치한다.
7. 전체적으로 실제 교육기관 홈페이지에서 사용할 수 있는 Navbar 형태로 구성한다.
-->
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="javascript:void(0)">개발자 교육센터</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#finalNavbar" aria-controls="finalNavbar" aria-expanded="false" aria-label="메뉴 열기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="finalNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" href="javascript:void(0)">홈</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="javascript:void(0)" role="button" data-bs-toggle="dropdown" aria-expanded="false">교육과정</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="javascript:void(0)">Java 웹 개발</a></li>
                        <li><a class="dropdown-item" href="javascript:void(0)">프론트엔드 개발</a></li>
                        <li><a class="dropdown-item" href="javascript:void(0)">Python & AI</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)">수강후기</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="javascript:void(0)">취업지원</a>
                </li>
            </ul>
            <a href="javascript:void(0)" class="btn btn-primary">수강신청</a>
        </div>
    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
