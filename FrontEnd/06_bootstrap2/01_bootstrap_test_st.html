<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 기본 실습</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-box { max-width: 900px; }
        .product-image { height: 300px; object-fit: cover; }
        .product-info { border: 1px solid #dee2e6; border-radius: 10px; }
        .product-info:hover { box-shadow: 0 5px 15px rgba(0,0,0,.1); }
    </style>
</head>
<body>

<!-- 기본 Bootstrap -->
<!-- 문제 1. 상품 소개 영역 -->
<!-- 작성 조건
1. 전체 영역은 container로 설정한다.
2. 제목은 Bootstrap Typography를 사용한다.
3. 상품 정보 영역에 padding과 border를 적용한다.
4. 상품 이미지가 너무 크지 않도록 설정한다.
-->
<section class="">
    <h1 class="">MY SHOP</h1>
    <div class="">
        <div class="">
            <div class="">
                <img src="https://picsum.photos/600/400?random=1" alt="상품 이미지" class="">
            </div>
            <div class="">
                <span class="">BEST</span>
                <h2 class="">무선 블루투스 헤드폰</h2>
                <p class="">편안한 착용감과 선명한 음질을 제공하는 무선 헤드폰입니다.</p>
                <p class="">★★★★★ <span class="">(128개 리뷰)</span></p>
                <p class="">89,000원</p>
                <button type="button" class="">장바구니</button>
                <button type="button" class="">구매하기</button>
            </div>
        </div>
    </div>
</section>

<!-- 문제 2. 배송 정보 -->
<!-- 작성 조건
1. 배송 정보를 별도의 영역으로 만든다.
2. 위쪽 여백은 mt-4를 사용한다.
3. 배송 정보 안쪽에 p-3을 적용한다.
4. 배경색은 bg-light를 사용한다.
5. 배송비는 fw-bold로 강조한다.
-->
<section class="">
    <div class="">
        <div class="">
            <p class="">🚚 배송 안내</p>
            <p class="">배송비 <span class="">3,000원</span> / 50,000원 이상 구매 시 무료배송</p>
        </div>
    </div>
</section>

<!-- 문제 3. 상품 할인 정보 -->
<!-- 작성 조건
1. SALE 배지를 추가한다.
2. 기존 가격은 text-decoration-line-through로 취소선을 적용한다.
3. 할인 가격은 fs-4와 fw-bold를 사용한다.
4. 할인 가격은 text-danger로 강조한다.
-->
<section class="">
    <div class="">
        <span class="">SALE</span>
        <p class=""><span class="">120,000원</span></p>
        <p class="">89,000원</p>
    </div>
</section>

<!-- 문제 4. 추가 상품 -->
<!-- 작성 조건
1. 상품 3개를 가로로 배치한다.
2. 각 상품 사이에 gap을 적용한다.
3. 상품 제목은 h5 크기로 표시한다.
4. 상품 가격은 fw-bold로 강조한다.
5. 버튼은 btn과 btn-outline-primary를 사용한다.
-->
<section class="">
    <h2 class="">함께 보면 좋은 상품</h2>
    <div class="">
        <div class="">
            <div class="">
                <img src="https://picsum.photos/400/250?random=2" alt="상품 이미지" class="">
                <h3 class="">무선 이어폰</h3>
                <p class="">59,000원</p>
                <button type="button" class="">자세히 보기</button>
            </div>
        </div>
        <div class="">
            <div class="">
                <img src="https://picsum.photos/400/250?random=3" alt="상품 이미지" class="">
                <h3 class="">스마트 워치</h3>
                <p class="">149,000원</p>
                <button type="button" class="">자세히 보기</button>
            </div>
        </div>
        <div class="">
            <div class="">
                <img src="https://picsum.photos/400/250?random=4" alt="상품 이미지" class="">
                <h3 class="">휴대용 스피커</h3>
                <p class="">79,000원</p>
                <button type="button" class="">자세히 보기</button>
            </div>
        </div>
    </div>
</section>

</body>
</html>
