<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Icons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <!--
        < 1. Bootstrap Icons >

        Bootstrap Icons
        : Bootstrap에서 제공하는 아이콘 라이브러리
        : 다양한 아이콘을 <i> 또는 <span> 요소에 적용하여 사용
        : CSS를 이용하는 아이콘 폰트 방식

        Bootstrap CSS와 별도로 Bootstrap Icons CSS를 추가해야 한다.

        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        아이콘 기본 사용법

        <i class="bi bi-house"></i>

        bi
        : Bootstrap Icons를 사용하기 위한 기본 클래스

        bi-house
        : 사용할 아이콘을 지정하는 클래스

        아이콘 종류에 따라 두 번째 클래스만 변경한다.
        예)
        bi-house
        bi-person
        bi-search
        bi-heart
        bi-cart
        bi-bell
        bi-star
    -->
    <h1 class="container my-4">Bootstrap Icons</h1>
    <div class="container">
        <i class="bi bi-house"></i>
        <i class="bi bi-person"></i>
        <i class="bi bi-search"></i>
        <i class="bi bi-heart"></i>
        <i class="bi bi-cart"></i>
        <i class="bi bi-bell"></i>
        <i class="bi bi-star"></i>
    </div>

    <!--
        < 2. 아이콘 크기 >

        Bootstrap Icons는 별도의 아이콘 크기 클래스가 있는 것이 아니라
        일반적인 CSS 속성으로 크기를 조절할 수 있다.

        Bootstrap의 fs-* 클래스를 사용할 수도 있다.

        fs-1
        fs-2
        fs-3
        fs-4
        fs-5
        fs-6

        숫자가 작을수록 글자가 크다.

        아이콘은 글자처럼 동작하기 때문에
        font-size, color 등의 영향을 받는다.
    -->
    <div class="container my-5">
        <i class="bi bi-star fs-1"></i>
        <i class="bi bi-star fs-2"></i>
        <i class="bi bi-star fs-3"></i>
        <i class="bi bi-star fs-4"></i>
        <i class="bi bi-star fs-5"></i>
        <i class="bi bi-star fs-6"></i>
    </div>

    <!--
        < 3. 아이콘 색상 >

        아이콘은 글자처럼 동작하기 때문에
        Bootstrap의 text-* 클래스를 사용할 수 있다.

        text-primary
        text-success
        text-danger
        text-warning
        text-info
        text-secondary
        text-dark
        text-body
        text-muted
    -->
    <div class="container my-5">
        <i class="bi bi-check-circle-fill fs-3 text-success"></i>
        <i class="bi bi-exclamation-circle-fill fs-3 text-warning"></i>
        <i class="bi bi-x-circle-fill fs-3 text-danger"></i>
        <i class="bi bi-info-circle-fill fs-3 text-primary"></i>
    </div>

    <!--
        < 4. 아이콘과 텍스트 >

        아이콘은 텍스트와 함께 사용하는 경우가 많다.

        아이콘과 텍스트 사이에 여백이 필요하다면
        Bootstrap의 margin utility를 사용할 수 있다.

        me-1
        me-2
        me-3
        : 오른쪽 margin

        예)
        <i class="bi bi-person me-2"></i>회원정보
    -->
    <div class="container my-5">
        <p><i class="bi bi-person me-2"></i>회원정보</p>
        <p><i class="bi bi-envelope me-2"></i>이메일</p>
        <p><i class="bi bi-telephone me-2"></i>전화번호</p>
        <p><i class="bi bi-geo-alt me-2"></i>주소</p>
    </div>

    <!--
        < 5. 버튼에 아이콘 적용 >

        버튼 안에도 아이콘을 사용할 수 있다.

        아이콘을 이용하면 버튼의 기능을
        사용자가 직관적으로 이해할 수 있다.

        예)
        검색 : bi-search
        수정 : bi-pencil
        삭제 : bi-trash
        다운로드 : bi-download
        장바구니 : bi-cart
        로그인 : bi-box-arrow-in-right
    -->
    <div class="container my-5">
        <button class="btn btn-primary">
            <i class="bi bi-search me-1"></i>검색
        </button>
        <button class="btn btn-success">
            <i class="bi bi-download me-1"></i>다운로드
        </button>
        <button class="btn btn-warning">
            <i class="bi bi-pencil me-1"></i>수정
        </button>
        <button class="btn btn-danger">
            <i class="bi bi-trash me-1"></i>삭제
        </button>
    </div>

    <!--
        < 6. 아이콘을 이용한 실제 UI >

        아이콘은 단순히 장식하는 용도보다
        실제 기능을 표현하는 UI에서 많이 사용한다.

        예)
        검색창 : search
        장바구니 : cart
        알림 : bell
        사용자 : person
        좋아요 : heart
        설정 : gear
        위치 : geo-alt
    -->
    <section class="container my-5">
        <h2 class="mb-4">마이페이지</h2>
        <div class="row g-3">
            <div class="col-6 col-md-3">
                <div class="border rounded p-4 text-center">
                    <i class="bi bi-person fs-1 d-block mb-2"></i>
                    <span>회원정보</span>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="border rounded p-4 text-center">
                    <i class="bi bi-bag-check fs-1 d-block mb-2"></i>
                    <span>주문내역</span>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="border rounded p-4 text-center">
                    <i class="bi bi-heart fs-1 d-block mb-2"></i>
                    <span>찜 목록</span>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="border rounded p-4 text-center">
                    <i class="bi bi-gear fs-1 d-block mb-2"></i>
                    <span>설정</span>
                </div>
            </div>
        </div>
    </section>

    <!--
        < 7. 아이콘 사용 시 주의사항 >

        ① Bootstrap Icons CSS를 반드시 추가해야 한다.

        ② bi와 실제 아이콘 이름을 함께 작성해야 한다.
           예) class="bi bi-house"

        ③ 아이콘만 보고 의미가 전달되지 않는 경우
           텍스트나 aria-label 등을 함께 사용하는 것이 좋다.

        ④ 아이콘의 크기와 색상은 font-size와 color의 영향을 받는다.

        ⑤ 아이콘은 장식뿐만 아니라 검색, 수정, 삭제,
           장바구니, 설정 등의 기능을 표현하는 UI에도 활용한다.
    -->
</body>
</html>
```
