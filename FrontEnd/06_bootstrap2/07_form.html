```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!--
        Bootstrap Form

        Bootstrap은 HTML form 요소에 클래스를 적용하여
        입력창, 선택창, 체크박스, 라디오 버튼 등을
        일관된 디자인으로 만들 수 있다.

        주요 클래스
        .form-label       : label 스타일
        .form-control     : input, textarea 스타일
        .form-select      : select 스타일
        .form-check       : checkbox, radio 영역
        .form-check-input : checkbox, radio 버튼
        .form-check-label : checkbox, radio label
        .input-group      : 입력 요소를 하나의 그룹으로 구성
        .form-text        : 입력 도움말
        .is-valid         : 유효한 입력 표시
        .is-invalid       : 잘못된 입력 표시
    -->

    <div class="container py-5">

        <!-- 기본 Form -->
        <h2>기본 Form</h2>

        <form>
            <div class="mb-3">
                <label for="userId" class="form-label">아이디</label>
                <input type="text" id="userId" class="form-control" placeholder="아이디를 입력하세요">
            </div>

            <div class="mb-3">
                <label for="userPassword" class="form-label">비밀번호</label>
                <input type="password" id="userPassword" class="form-control" placeholder="비밀번호를 입력하세요">
            </div>

            <button type="submit" class="btn btn-primary">로그인</button>
        </form>

        <!-- textarea -->
        <h2 class="mt-5">Textarea</h2>

        <div class="mb-3">
            <label for="content" class="form-label">문의 내용</label>
            <textarea id="content" class="form-control" rows="5" placeholder="문의 내용을 입력하세요"></textarea>
        </div>

        <!-- Select -->
        <h2 class="mt-5">Select</h2>

        <div class="mb-3">
            <label for="course" class="form-label">수강 과정</label>
            <select id="course" class="form-select">
                <option selected>과정을 선택하세요</option>
                <option>Java 웹 개발</option>
                <option>프론트엔드 개발</option>
                <option>Python 데이터 분석</option>
            </select>
        </div>

        <!-- Checkbox -->
        <h2 class="mt-5">Checkbox</h2>

        <div class="form-check">
            <input type="checkbox" id="agree" class="form-check-input">
            <label for="agree" class="form-check-label">개인정보 수집에 동의합니다.</label>
        </div>

        <!-- Radio -->
        <h2 class="mt-5">Radio</h2>

        <div class="form-check">
            <input type="radio" name="type" id="student" class="form-check-input" checked>
            <label for="student" class="form-check-label">학생</label>
        </div>

        <div class="form-check">
            <input type="radio" name="type" id="worker" class="form-check-input">
            <label for="worker" class="form-check-label">직장인</label>
        </div>

        <!-- Input Group -->
        <h2 class="mt-5">Input Group</h2>

        <div class="input-group mb-3">
            <span class="input-group-text">@</span>
            <input type="text" class="form-control" placeholder="아이디">
        </div>

        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="검색어">
            <button type="button" class="btn btn-primary">검색</button>
        </div>

        <!-- Form Text -->
        <h2 class="mt-5">도움말</h2>

        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" id="email" class="form-control">
            <div class="form-text">수강 관련 안내를 받을 이메일을 입력하세요.</div>
        </div>

        <!-- Validation -->
        <h2 class="mt-5">입력 상태 표시</h2>

        <div class="mb-3">
            <label for="validEmail" class="form-label">이메일</label>
            <input type="email" id="validEmail" class="form-control is-valid" value="student@example.com">
            <div class="valid-feedback">사용 가능한 이메일입니다.</div>
        </div>

        <div class="mb-3">
            <label for="invalidEmail" class="form-label">이메일</label>
            <input type="email" id="invalidEmail" class="form-control is-invalid" value="wrong">
            <div class="invalid-feedback">올바른 이메일을 입력하세요.</div>
        </div>

        <!-- 실제 회원가입 Form -->
        <h2 class="mt-5">회원가입 Form</h2>

        <form>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="joinName" class="form-label">이름</label>
                    <input type="text" id="joinName" class="form-control" placeholder="이름">
                </div>

                <div class="col-12 col-md-6">
                    <label for="joinPhone" class="form-label">연락처</label>
                    <input type="tel" id="joinPhone" class="form-control" placeholder="010-0000-0000">
                </div>

                <div class="col-12">
                    <label for="joinEmail" class="form-label">이메일</label>
                    <input type="email" id="joinEmail" class="form-control" placeholder="example@email.com">
                </div>

                <div class="col-12">
                    <label for="joinCourse" class="form-label">관심 과정</label>
                    <select id="joinCourse" class="form-select">
                        <option selected>과정을 선택하세요</option>
                        <option>Java 웹 개발</option>
                        <option>프론트엔드 개발</option>
                        <option>Python 데이터 분석</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="joinMessage" class="form-label">문의 내용</label>
                    <textarea id="joinMessage" class="form-control" rows="4"></textarea>
                </div>

                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" id="joinAgree" class="form-check-input">
                        <label for="joinAgree" class="form-check-label">개인정보 수집 및 이용에 동의합니다.</label>
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">상담 신청</button>
                    <button type="reset" class="btn btn-outline-secondary">초기화</button>
                </div>
            </div>
        </form>

    </div>

</body>
</html>
```
