<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 시작하기</title>

    <!--
        < Bootstrap 시작하기 >

        Bootstrap : 웹페이지를 빠르게 만들 수 있도록 미리 만들어진 CSS와
                    JavaScript를 제공하는 CSS Framework

        Bootstrap을 사용한다고 해서 CSS를 몰라도 되는 것이 아니다.
        오히려 기존 CSS와 Bootstrap을 함께 사용하는 방법을 알아야 한다.
    -->
    <!--
        < 1. Bootstrap 연결 >
        - Bootstrap은 CDN을 이용해서 간단하게 연결할 수 있다.
        - 아래 CSS가 연결되면 Bootstrap에서 제공하는
          다양한 클래스들을 사용할 수 있다.
    -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /*
            < 2. 내가 작성하는 CSS >
            - Bootstrap을 사용하더라도 프로젝트에서 필요한 디자인은
              직접 CSS를 작성할 수 있다.
            - Bootstrap = 기본적인 UI를 빠르게 구성
              내가 작성한 CSS = 프로젝트만의 디자인 적용
        */
        .brand {
            color: #0d6efd;
        }
        .course-box {
            border: 1px solid #dee2e6;
            transition: 0.2s;
        }
        .course-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
        }

        /*
            Bootstrap 클래스도 일반 CSS와 같은 CSS 규칙을 사용한다.

            Bootstrap에서 이미 지정된 스타일을 내가 원하는 형태로
            변경할 수도 있다.

            단, 무조건 !important를 사용하는 것은 좋지 않다.
            선택자 우선순위와 CSS 작성 순서를 먼저 고려한다.
        */
    </style>
</head>
<body>

    <!--
        < 3. Bootstrap의 기본 사용법 >

        Bootstrap은 HTML 요소에 클래스를 추가하는 방식으로 사용한다.

        예)
        <button class="btn btn-primary">버튼</button>

        btn: Bootstrap 버튼이라는 기본 형태
        btn-primary: primary 색상의 버튼

        여러 클래스를 조합해서 하나의 UI를 만들 수 있다.
    -->

    <header class="border-bottom">
        <div class="container py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h4 mb-0 brand">ITWILL</h1>

                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary btn-sm">로그인</button>
                    <button class="btn btn-primary btn-sm">회원가입</button>
                </div>
            </div>
        </div>
    </header>


    <!--
        < 4. container >
        container: 콘텐츠의 최대 너비를 지정하고 가운데 정렬
        container-fluid: 화면 전체 너비 사용

        Bootstrap에서는 콘텐츠를 적절한 폭으로 제한하기 위해
        container를 자주 사용한다.
    -->

    <main class="container py-5">

        <!--
            < 5. Typography Utility >
            - Bootstrap에는 글자와 관련된 Utility 클래스가 있다.

            display-*: 큰 제목
            text-muted: 흐린 텍스트
            fw-bold: 굵은 글자
            fs-*: 글자 크기
            mb-*: margin-bottom
        -->

        <section class="mb-5">
            <p class="text-primary fw-bold mb-2">BOOTCAMP</p>
            <h2 class="display-6 fw-bold mb-3">개발자로 성장하는 가장 빠른 방법</h2>
            <p class="text-secondary mb-4">
                Java, Spring, React를 활용한 실무 중심 개발자 교육과정을 확인해보세요.
            </p>

            <div class="d-flex gap-2">
                <button class="btn btn-primary">교육과정 보기</button>
                <button class="btn btn-outline-dark">상담 신청</button>
            </div>
        </section>


        <!--
            < 6. Utility를 조합해서 UI 만들기 >

            - Bootstrap의 중요한 특징 중 하나는
              별도의 CSS를 작성하지 않고 Utility 클래스를
              여러 개 조합해서 UI를 만들 수 있다는 것이다.

            d-flex: Flex Container
            justify-content-between: 양쪽 끝으로 배치
            align-items-center: 세로 가운데 정렬
            gap-3: 요소 사이 간격
            p-4: padding
            mb-3: margin-bottom
            rounded: border-radius
            shadow-sm: 작은 그림자
        -->

        <section>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="h4 mb-0">추천 교육과정</h3>
                <a href="courses.html" class="text-decoration-none">전체보기</a>
            </div>
            <div class="course-box rounded p-4 mb-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div>
                        <span class="badge text-bg-primary">K-Digital Training</span>
                        <h4 class="h5 fw-bold mt-2 mb-1">Java 풀스택 개발자 과정</h4>
                        <p class="text-secondary mb-0">Java · Spring · React · Database</p>
                    </div>
                    <span class="fw-bold text-primary">6개월</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="small text-secondary">수강생 모집중</span>
                    <button class="btn btn-primary">과정 상세보기</button>
                </div>
            </div>
        </section>


        <!--
            < 7. Bootstrap + 기존 CSS >

            - 위의 course-box는 내가 작성한 CSS이다.
              Bootstrap 클래스와 직접 작성한 CSS를 함께 사용할 수 있다.

            - Bootstrap: p-4, rounded, mb-3, d-flex ...
              내가 작성한 CSS: border, transition, hover ...

            실제 프로젝트에서는 이 두 가지를 함께 사용하는 경우가 많다.
        -->
    </main>


    <!--
        < 8. Bootstrap JavaScript >

        - Bootstrap의 모든 기능에 JavaScript가 필요한 것은 아니다.

        아래와 같은 기능은 Bootstrap CSS만으로도 사용할 수 있다.

        - Typography
        - Color
        - Button 기본 스타일
        - Margin / Padding
        - Flex Utility
        - Border
        - Shadow

        반면 아래와 같은 기능은 Bootstrap JavaScript가 필요하다.

        - Modal
        - Carousel
        - Dropdown
        - Collapse
        - Offcanvas
        - Tooltip

        따라서 지금 수업에서는 JS Bundle을 연결하지 않아도 된다.

        필요한 기능을 배울 때 Bootstrap Bundle을 추가한다.
    -->

</body>
</html>
