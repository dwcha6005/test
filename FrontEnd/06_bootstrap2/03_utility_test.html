<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Utility 실습</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .profile { width: 80px; height: 80px; object-fit: cover; }
        .product-image { height: 220px; object-fit: cover; }
    </style>
</head>
<body>

<!-- 문제 1. 프로필 카드 -->
<!-- 작성 조건
1. 전체 영역을 container로 설정한다.
2. 카드에 border, rounded, shadow를 적용한다.
3. 카드 안쪽 여백은 p-4를 사용한다.
4. 이름은 fw-bold로 강조한다.
5. 설명은 text-secondary를 사용한다.
-->
<section class="container py-5">
    <div class="border rounded-3 shadow p-4">
        <img src="https://picsum.photos/100/100?random=20" alt="프로필" class="profile rounded-circle mb-3">
        <h2 class="h5 fw-bold">김개발</h2>
        <p class="text-secondary mb-0">웹 개발자 · 부산</p>
    </div>
</section>

<!-- 문제 2. 공지사항 -->
<!-- 작성 조건
1. 제목 아래에 mb-3을 적용한다.
2. 공지사항 영역은 bg-light와 p-4를 사용한다.
3. 중요한 문장은 fw-bold를 사용한다.
4. 날짜는 text-secondary와 small을 사용한다.
-->
<section class="container pb-5">
    <h2 class="h4 mb-3">공지사항</h2>
    <div class="bg-light p-4 rounded">
        <p class="fw-bold mb-1">새로운 교육과정이 개설되었습니다.</p>
        <p class="text-secondary small mb-0">2026.09.30</p>
    </div>
</section>

<!-- 문제 3. 회원 정보 -->
<!-- 작성 조건
1. 정보를 d-flex로 가로 배치한다.
2. 양쪽 끝에 요소가 배치되도록 한다.
3. 세로 가운데 정렬한다.
4. 정보 영역에 border, rounded, p-3을 적용한다.
-->
<section class="container pb-5">
    <div class="d-flex justify-content-between align-items-center border rounded p-3">
        <div>
            <strong class="fw-bold">홍길동</strong>
            <p class="text-secondary mb-0">hong@example.com</p>
        </div>
        <button type="button" class="btn btn-outline-primary btn-sm">수정</button>
    </div>
</section>

<!-- 문제 4. 메뉴 -->
<!-- 작성 조건
1. 메뉴를 d-flex로 배치한다.
2. 메뉴 사이에는 gap-4를 적용한다.
3. 메뉴 영역에 p-3과 bg-dark를 적용한다.
4. 메뉴 글자는 text-white로 표시한다.
-->
<section class="container pb-5">
    <nav class="d-flex gap-4 bg-dark p-3 rounded">
        <a href="index.html" class="text-white text-decoration-none">홈</a>
        <a href="course.html" class="text-white text-decoration-none">교육과정</a>
        <a href="notice.html" class="text-white text-decoration-none">공지사항</a>
        <a href="contact.html" class="text-white text-decoration-none">문의하기</a>
    </nav>
</section>

<!-- 문제 5. 상품 목록 -->
<!-- 작성 조건
1. 상품을 모바일 1열 / md 이상 3열로 배치한다.
2. Grid 간격은 g-4를 사용한다.
3. 상품 카드에 border, rounded, shadow-sm을 적용한다.
4. 이미지 너비는 w-100을 사용한다.
5. 카드 내용에는 p-3을 적용한다.
6. 가격과 버튼은 d-flex로 양쪽 정렬한다.
-->
<section class="container pb-5">
    <h2 class="h4 fw-bold mb-4">인기 상품</h2>
    <div class="row g-4">
        <div class="col-12 col-md-4">
            <article class="border rounded-3 shadow-sm overflow-hidden">
                <img src="https://picsum.photos/500/300?random=30" alt="상품 이미지" class="w-100 product-image">
                <div class="p-3">
                    <span class="badge text-bg-danger mb-2">SALE</span>
                    <h3 class="h5 fw-bold">무선 이어폰</h3>
                    <p class="text-secondary small">고음질 블루투스 이어폰</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <strong class="fw-bold">59,000원</strong>
                        <button type="button" class="btn btn-primary btn-sm">구매</button>
                    </div>
                </div>
            </article>
        </div>
        <div class="col-12 col-md-4">
            <article class="border rounded-3 shadow-sm overflow-hidden">
                <img src="https://picsum.photos/500/300?random=31" alt="상품 이미지" class="w-100 product-image">
                <div class="p-3">
                    <span class="badge text-bg-success mb-2">NEW</span>
                    <h3 class="h5 fw-bold">스마트 워치</h3>
                    <p class="text-secondary small">운동과 건강을 위한 스마트 워치</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <strong class="fw-bold">149,000원</strong>
                        <button type="button" class="btn btn-primary btn-sm">구매</button>
                    </div>
                </div>
            </article>
        </div>
        <div class="col-12 col-md-4">
            <article class="border rounded-3 shadow-sm overflow-hidden">
                <img src="https://picsum.photos/500/300?random=32" alt="상품 이미지" class="w-100 product-image">
                <div class="p-3">
                    <span class="badge text-bg-warning mb-2">BEST</span>
                    <h3 class="h5 fw-bold">블루투스 스피커</h3>
                    <p class="text-secondary small">휴대하기 좋은 블루투스 스피커</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <strong class="fw-bold">79,000원</strong>
                        <button type="button" class="btn btn-primary btn-sm">구매</button>
                    </div>
                </div>
            </article>
        </div>
    </div>
</section>

</body>
</html>
