<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Customizing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /*
            < 1. Bootstrap CSS와 사용자 CSS >

            Bootstrap을 사용하면 미리 만들어진 스타일을 사용할 수 있다.

            하지만 실제 프로젝트에서는
            Bootstrap의 기본 디자인을 그대로 사용하지 않고
            프로젝트에 맞게 수정하는 경우가 많다.

            Bootstrap CSS
            → 내가 작성한 CSS

            같은 요소에 여러 CSS가 적용되면
            CSS의 Cascading 규칙에 따라 최종 스타일이 결정된다.
        */

        .custom-btn {
            background-color: #6f42c1;
            color: white;
            border: 0;
        }

        /*
            Bootstrap의 btn-primary가 적용되어 있어도
            내가 작성한 .custom-btn을 추가하여
            원하는 디자인으로 변경할 수 있다.
        */

        /*
            < 2. Bootstrap Utility + 사용자 CSS >

            Bootstrap Utility는 빠르게 스타일을 적용할 때 유용하다.

            예)
            p-3
            rounded
            text-center
            shadow

            하지만 Bootstrap에 없는 세부 디자인은
            직접 CSS를 작성할 수 있다.
        */

        .custom-card {
            border: 2px solid #198754;
            border-radius: 20px;
            transition: transform 0.2s;
        }

        .custom-card:hover {
            transform: translateY(-5px);
        }

        /*
            < 3. CSS 선택자와 Cascading >

            같은 요소에 여러 스타일이 적용될 경우
            선택자의 우선순위와 작성 순서에 따라 결정된다.

            .box {
                color: blue;
            }

            .box {
                color: red;
            }

            같은 선택자라면 뒤에서 작성한 CSS가 적용된다.
        */

        /*
            < 4. 더 구체적인 선택자 >

            Bootstrap 클래스보다 더 구체적인 선택자를 사용하여
            스타일을 변경할 수도 있다.

            예)
            .custom-area .btn {
                background-color: black;
            }

            .custom-area 안에 있는 btn에 적용된다.
        */

        .custom-area .btn {
            border-radius: 30px;
        }

        /*
            < 5. !important >

            !important는 해당 선언의 우선순위를 매우 높인다.

            예)
            .btn {
                background-color: red !important;
            }

            Bootstrap의 스타일을 강제로 덮어써야 하는
            특별한 경우 사용할 수 있다.

            단, 남용하면 CSS 관리가 어려워지므로
            가능한 한 선택자의 우선순위와 작성 순서로 해결한다.
        */

        /*
            < 6. Bootstrap CSS 변수 >

            Bootstrap 5에서는 일부 디자인 값을
            CSS 변수로 관리한다.

            예)
            --bs-btn-bg
            --bs-btn-border-color
            --bs-btn-color

            버튼의 기본 스타일을 직접 수정할 때
            CSS 변수를 이용할 수도 있다.
        */
        .my-button {
            --btn-color: tomato;
            color: white;
            background-color: var(--btn-color);
            border-color: var(--btn-color);
        }

        .variable-btn {
            background-color: orange;
            /* --bs-btn-bg: #fd7e14; */
            --bs-btn-border-color: orange;
            --bs-btn-hover-bg: darkorange;
            --bs-btn-hover-border-color: darkorange;
        }

        /*
            < 7. Bootstrap 커스터마이징 기본 원칙 >

            ① Bootstrap CSS를 직접 수정하지 않는다.
            ② 별도의 CSS를 작성하여 Bootstrap을 덮어쓴다.
            ③ Bootstrap Utility와 사용자 CSS를 함께 사용할 수 있다.
            ④ !important는 꼭 필요한 경우에만 사용한다.
            ⑤ Bootstrap CSS 변수를 이용하면 간단하게 변경할 수 있다.

            Bootstrap
            + Utility
            + Custom CSS
            = 프로젝트에 맞는 UI
        */
    </style>
</head>
<body>
    <section class="container my-5">
        <h2 class="mb-4">Bootstrap Customizing</h2>
        <button class="btn btn-primary custom-btn">커스텀 버튼</button>
    </section>

    <section class="container my-5">
        <div class="custom-card p-4 shadow">
            <h3>커스텀 카드</h3>
            <p class="mb-0">Bootstrap Utility와 사용자 CSS를 함께 사용한 카드입니다.</p>
        </div>
    </section>

    <section class="container my-5 custom-area">
        <button class="btn btn-primary px-4">버튼 1</button>
        <button class="btn btn-success px-4">버튼 2</button>
        <button class="btn btn-danger px-4">버튼 3</button>
    </section>

    <button class="my-button">내 버튼</button>

    <section class="container my-5">
        <button class="btn variable-btn btn-primary ">CSS 변수 버튼</button>
    </section>
</body>
</html>
