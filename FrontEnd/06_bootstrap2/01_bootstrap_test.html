<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 시작하기 - 실습</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /*
            ========================================================
            [실습] 온라인 쇼핑몰 상품 소개 페이지
            ========================================================

            아래 화면을 Bootstrap Utility를 활용하여 완성하세요.

            조건
            --------------------------------------------------------
            1. Bootstrap CDN을 사용한다.
            2. container를 사용하여 전체 콘텐츠 폭을 제한한다.
            3. Bootstrap Utility를 적극적으로 사용한다.
            4. 별도의 CSS 작성은 최소화한다.
            5. Bootstrap 클래스와 직접 작성한 CSS를 함께 사용할 수 있다.
            6. 버튼은 Bootstrap Button을 사용한다.
            7. 상품 영역은 border / rounded / shadow 등을 활용한다.
            8. 상품 정보와 가격 영역은 Flex를 활용한다.
        */

        /* ========================================================
           [작성]
           필요한 CSS가 있다면 이곳에 작성하세요.
           ======================================================== */


        /*
        ============================================================
        [정답 예시]
        ============================================================

        .product-image {
            width: 220px;
            height: 220px;
            object-fit: cover;
        }

        .product-box {
            transition: 0.2s;
        }

        .product-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
        }

        .price {
            font-size: 1.25rem;
        }
        */
    </style>
</head>
<body>

    <!--
        ============================================================
        [실습 문제]

        다음 조건을 만족하는 쇼핑몰 상품 소개 페이지를 완성하세요.

        ------------------------------------------------------------
        화면 구성
        ------------------------------------------------------------

        [SHOPPING MALL]

        인기 상품
        이번 주 가장 많이 판매된 상품입니다.

        ------------------------------------------------------------

        [상품 이미지]

        [BEST]
        무선 블루투스 헤드폰

        선명한 음질과 편안한 착용감을 제공하는
        무선 블루투스 헤드폰입니다.

        ★ 4.8   리뷰 328개

        89,000원

        [장바구니] [구매하기]

        ------------------------------------------------------------

        Bootstrap에서 제공하는 Utility 클래스를 최대한 활용하세요.


        힌트
        ------------------------------------------------------------

        container
        p-*
        m-*
        mb-*
        d-flex
        justify-content-between
        align-items-center
        gap-*
        fw-bold
        text-*
        border
        rounded
        shadow
        btn
        badge

        등을 활용할 수 있습니다.


        [응용 문제]
        ------------------------------------------------------------

        기본 상품 하나를 완성한 뒤 아래 내용을 추가하세요.

        1. 상품 아래에 배송 정보를 추가하세요.

           무료배송
           평일 오후 2시 이전 주문 시 당일 발송

        2. 상품의 가격 영역을 수정하세요.

           109,000원
           89,000원

           기존 가격에는 취소선이 적용되도록 합니다.

        3. "BEST" 대신 "SALE" 배지를 하나 추가하세요.

        4. 장바구니 버튼은 outline 스타일로 변경하세요.

        5. 구매하기 버튼은 primary 색상을 사용하세요.

        6. 상품 박스에 마우스를 올렸을 때 살짝 위로 올라가는
           효과를 CSS로 직접 작성하세요.

        ------------------------------------------------------------

        [추가 응용]
        ------------------------------------------------------------

        완성한 상품을 하나 더 추가하세요.

        단, 기존 상품 HTML을 그대로 복사한 뒤 내용만 바꾸지 말고
        상품의 구성이나 정보 배치를 조금 다르게 만들어보세요.

        예:
        - 무선 키보드
        - 스마트워치
        - 노트북 가방
        - USB 허브
    -->


    <header class="border-bottom">
        <div class="container py-3">

            <!--
                [작성]

                쇼핑몰 로고와 장바구니 버튼을 배치하세요.

                조건
                - 양쪽 끝에 배치
                - 세로 가운데 정렬
                - Bootstrap Utility 사용
            -->

            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h4 mb-0">MY SHOP</h1>

                <button class="btn btn-outline-dark">
                    장바구니
                </button>
            </div>

        </div>
    </header>


    <main class="container py-5">

        <!-- 페이지 제목 -->
        <section class="mb-4">
            <p class="text-primary fw-bold mb-2">BEST PRODUCT</p>
            <h2 class="h3 fw-bold mb-2">인기 상품</h2>
            <p class="text-secondary mb-0">
                이번 주 가장 많이 판매된 상품입니다.
            </p>
        </section>


        <!--
            ========================================================
            상품 영역
            ========================================================

            [작성]

            아래 영역을 Bootstrap Utility를 활용하여 완성하세요.

            상품 이미지
            상품 정보
            가격
            버튼

            등을 적절하게 배치하세요.
        -->

        <section>

            <div class="border rounded p-4">

                <div class="d-flex gap-4">

                    <!-- 상품 이미지 -->
                    <div>
                        <img
                            src="https://picsum.photos/300/300?random=10"
                            alt="무선 블루투스 헤드폰"
                            width="220"
                            height="220"
                            class="rounded">
                    </div>


                    <!-- 상품 정보 -->
                    <div class="flex-grow-1">

                        <div class="d-flex justify-content-between align-items-start">

                            <div>
                                <span class="badge text-bg-danger">BEST</span>

                                <h3 class="h4 fw-bold mt-2 mb-2">
                                    무선 블루투스 헤드폰
                                </h3>
                            </div>

                        </div>


                        <p class="text-secondary mb-3">
                            선명한 음질과 편안한 착용감을 제공하는
                            무선 블루투스 헤드폰입니다.
                        </p>


                        <div class="mb-3">
                            <span class="text-warning">★ 4.8</span>
                            <span class="text-secondary ms-2">
                                리뷰 328개
                            </span>
                        </div>


                        <!--
                            [작성]

                            가격 영역을 완성하세요.

                            응용 문제에서는

                            109,000원
                            89,000원

                            형태로 변경합니다.
                        -->

                        <div class="mb-4">
                            <span class="fs-4 fw-bold text-primary">
                                89,000원
                            </span>
                        </div>


                        <!--
                            [작성]

                            버튼 2개를 배치하세요.

                            장바구니
                            구매하기

                            조건
                            - Bootstrap Button 사용
                            - 두 버튼 사이 간격 적용
                        -->

                        <div class="d-flex gap-2">

                            <button class="btn btn-outline-primary">
                                장바구니
                            </button>

                            <button class="btn btn-primary">
                                구매하기
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!--
            ========================================================
            [응용 문제]

            아래 배송 정보를 추가하세요.

            무료배송
            평일 오후 2시 이전 주문 시 당일 발송

            Bootstrap Utility를 이용하여
            상품 영역과 적절하게 구분되도록 구성하세요.
        -->

        <section class="mt-4 border rounded p-3">

            <div class="d-flex justify-content-between align-items-center">
                <strong>배송정보</strong>

                <span class="text-secondary">
                    무료배송
                </span>
            </div>

            <p class="small text-secondary mt-2 mb-0">
                평일 오후 2시 이전 주문 시 당일 발송
            </p>

        </section>

    </main>

</body>
</html>
