```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form 실습</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container py-5">

        <!--
            문제 1. 로그인 Form
            아이디와 비밀번호 입력창을 보기 좋게 배치하고
            각 입력창 위에 설명을 표시한다.
            로그인 버튼은 주요 버튼으로 표현한다.

            (정답: mb-3, form-label, form-control, btn btn-primary)
        -->
        <h2>문제 1. 로그인 Form</h2>

        <form>
            <div class="mb-3">
                <label for="loginId" class="form-label">아이디</label>
                <input type="text" id="loginId" class="form-control" placeholder="아이디를 입력하세요">
            </div>

            <div class="mb-3">
                <label for="loginPw" class="form-label">비밀번호</label>
                <input type="password" id="loginPw" class="form-control" placeholder="비밀번호를 입력하세요">
            </div>

            <button type="submit" class="btn btn-primary">로그인</button>
        </form>

        <!--
            문제 2. 문의 Form
            여러 줄의 내용을 입력할 수 있는 영역을 만들고
            입력 영역 아래에 안내 문구를 표시한다.

            (정답: form-label, form-control, form-text)
        -->
        <h2 class="mt-5">문제 2. 문의 Form</h2>

        <div class="mb-3">
            <label for="question" class="form-label">문의 내용</label>
            <textarea id="question" class="form-control" rows="5" placeholder="문의 내용을 입력하세요"></textarea>
            <div class="form-text">문의 내용을 자세하게 작성해주세요.</div>
        </div>

        <!--
            문제 3. 과정 선택
            사용자가 하나의 과정을 선택할 수 있도록 선택 목록을 만든다.
            선택 목록 위에 설명을 표시한다.

            (정답: form-label, form-select)
        -->
        <h2 class="mt-5">문제 3. 과정 선택</h2>

        <div class="mb-3">
            <label for="selectCourse" class="form-label">수강 과정</label>
            <select id="selectCourse" class="form-select">
                <option selected>과정을 선택하세요</option>
                <option>Java 웹 개발</option>
                <option>프론트엔드 개발</option>
                <option>Python 데이터 분석</option>
            </select>
        </div>

        <!--
            문제 4. 수강 유형
            여러 선택지 중 하나를 선택할 수 있도록 만든다.
            두 선택지는 같은 그룹으로 동작해야 한다.

            (정답: form-check, form-check-input, form-check-label)
        -->
        <h2 class="mt-5">문제 4. 수강 유형</h2>

        <div class="form-check">
            <input type="radio" name="courseType" id="fullTime" class="form-check-input">
            <label for="fullTime" class="form-check-label">취업 준비생</label>
        </div>

        <div class="form-check">
            <input type="radio" name="courseType" id="workerType" class="form-check-input">
            <label for="workerType" class="form-check-label">재직자</label>
        </div>

        <!--
            문제 5. 검색창
            검색어 입력창과 검색 버튼을 하나의 영역처럼 연결한다.

            (정답 예: input-group, form-control, btn btn-dark)
        -->
        <h2 class="mt-5">문제 5. 검색창</h2>

        <div class="input-group">
            <input type="text" class="form-control" placeholder="검색어를 입력하세요">
            <button type="button" class="btn btn-dark">검색</button>
        </div>

        <!--
            문제 6. 상담 신청 Form
            이름과 연락처는 작은 화면에서 한 줄씩,
            중간 크기 이상의 화면에서는 두 항목이 한 줄에 배치되도록 만든다.
            이메일과 과정 선택은 한 줄 전체를 사용한다.
            마지막에 개인정보 동의와 신청 버튼을 배치한다.

            (정답 예:
            row g-3
            col-12 col-md-6
            col-12
            form-label
            form-control
            form-select
            form-check
            form-check-input
            form-check-label
            btn btn-primary
            )
        -->
        <h2 class="mt-5">문제 6. 상담 신청 Form</h2>

        <form>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="name" class="form-label">이름</label>
                    <input type="text" id="name" class="form-control" placeholder="이름">
                </div>

                <div class="col-12 col-md-6">
                    <label for="phone" class="form-label">연락처</label>
                    <input type="tel" id="phone" class="form-control" placeholder="010-0000-0000">
                </div>

                <div class="col-12">
                    <label for="emailAddress" class="form-label">이메일</label>
                    <input type="email" id="emailAddress" class="form-control" placeholder="example@email.com">
                </div>

                <div class="col-12">
                    <label for="courseName" class="form-label">관심 과정</label>
                    <select id="courseName" class="form-select">
                        <option selected>과정을 선택하세요</option>
                        <option>Java 웹 개발</option>
                        <option>프론트엔드 개발</option>
                        <option>Python 데이터 분석</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="memo" class="form-label">문의 내용</label>
                    <textarea id="memo" class="form-control" rows="4" placeholder="궁금한 내용을 작성해주세요."></textarea>
                </div>

                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" id="privacy" class="form-check-input">
                        <label for="privacy" class="form-check-label">개인정보 수집 및 이용에 동의합니다.</label>
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">상담 신청</button>
                    <button type="reset" class="btn btn-outline-secondary">초기화</button>
                </div>
            </div>
        </form>

    </div>

</body>
</html>
```
