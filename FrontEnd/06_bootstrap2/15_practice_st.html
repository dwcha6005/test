        주제 : 반응형 쇼핑몰 메인 페이지

        [문제 1] 상단 Navbar

        다음 조건을 만족하는 반응형 Navbar를 제작하세요.

        - 왼쪽에 쇼핑몰 로고를 배치한다.
        - 오른쪽에 다음 메뉴를 배치한다.
          HOME / 상품 / 베스트 / 이벤트 / 고객센터
        - 모바일에서는 메뉴가 버튼으로 접히도록 한다.
        - Navbar에 검색 아이콘과 장바구니 아이콘을 추가한다.

        --------------------------------------------------

        [문제 2] 메인 이벤트 배너

        Carousel을 사용하여 메인 이벤트 영역을 제작하세요.

        - 3개의 배너를 사용한다.
        - 첫 번째 배너가 처음 표시되어야 한다.
        - 자동으로 다음 배너로 이동하도록 한다.
        - Indicators를 표시한다.
        - 이전 / 다음 버튼을 표시한다.
        - 각 배너에는 제목과 설명을 표시한다.
        - 배너 이미지는 화면 너비에 맞게 표시한다.

        --------------------------------------------------

        [문제 3] 카테고리 메뉴

        다음 카테고리를 가로로 배치하세요.

        전체 / 의류 / 신발 / 가방 / 액세서리

        - 모바일에서도 화면을 벗어나지 않도록 구성한다.
        - 선택된 카테고리는 다른 색상으로 강조한다.
        - Bootstrap Button을 활용한다.

        --------------------------------------------------

        [문제 4] 인기 상품

        상품 카드 6개를 제작하세요.

        각 카드에는 다음 내용을 포함합니다.

        - 상품 이미지
        - 상품 Badge
        - 상품명
        - 상품 설명
        - 가격
        - 상품 보기 버튼
        - 장바구니 아이콘

        반응형 조건:

        모바일 : 1열
        태블릿 : 2열
        PC : 3열

        --------------------------------------------------

        [문제 5] 할인 이벤트 영역

        할인 이벤트를 강조하는 별도의 영역을 제작하세요.

        - 할인율을 크게 표시한다.
        - 이벤트 설명을 표시한다.
        - 이벤트 참여 버튼을 만든다.
        - Bootstrap Icon을 사용한다.
        - 배경색과 여백을 사용하여 상품 영역과 구분한다.

        --------------------------------------------------

        [문제 6] 쇼핑 정보

        다음 3개의 정보를 카드 형태로 제작하세요.

        무료 배송
        안전한 결제
        빠른 배송

        각 영역에는 아이콘 / 제목 / 설명을 포함합니다.

        모바일에서는 1열,
        태블릿 이상에서는 3열로 배치합니다.

        --------------------------------------------------

        [문제 7] 뉴스레터 신청

        다음 입력 영역을 제작하세요.

        - 이메일 입력창
        - 신청 버튼
        - 가운데 정렬
        - PC에서는 입력창과 버튼을 가로로 배치
        - 모바일에서는 자연스럽게 배치

        Bootstrap Form을 활용하세요.

        --------------------------------------------------

        [문제 8] Footer

        Footer에 다음 내용을 표시하세요.

        - 쇼핑몰 이름
        - 회사 정보
        - 고객센터 전화번호
        - 이용약관
        - 개인정보처리방침
        - SNS 아이콘

        Footer는 어두운 배경을 사용하고
        텍스트와 아이콘을 적절하게 배치하세요.

        --------------------------------------------------

        [문제 9] 사용자 정의 CSS

        Bootstrap Utility만 사용하지 말고
        직접 CSS를 작성하여 디자인을 개선하세요.

        다음 중 2개 이상을 적용하세요.

        - 상품 카드 Hover 효과
        - 버튼 Hover 효과
        - 이미지 크기 또는 비율 조정
        - Border Radius 변경
        - Transition 적용
        - 이벤트 영역 디자인 변경
        - 기타 필요한 사용자 정의 스타일

        □ Carousel이 정상적으로 동작하는가?
        □ 상품 카드가 화면 크기에 따라 변경되는가?
        □ 버튼과 아이콘이 적절하게 배치되어 있는가?
        □ Form이 정상적으로 보이는가?

        □ Bootstrap 컴포넌트를 적절하게 조합했는가?
        □ 전체적인 여백과 정렬이 자연스러운가?

    -->

</body>
