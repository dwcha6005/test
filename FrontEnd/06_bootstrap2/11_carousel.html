<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
    <!--
        < 1. Carousel >

        Carousel
        : 여러 개의 콘텐츠를 일정 영역 안에서 슬라이드 형태로 보여주는 UI
        : 이미지 배너, 상품, 이벤트 등에 활용
        : JS 필요

        기본 구조

        <div id="carouselExample" class="carousel slide">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="..." class="d-block w-100">
                </div>
                <div class="carousel-item">
                    <img src="..." class="d-block w-100">
                </div>
            </div>
        </div>

        carousel
        : Carousel 전체 영역

        carousel-inner
        : 슬라이드들을 묶는 영역

        carousel-item
        : 각각의 슬라이드

        active
        : 처음 화면에 보여줄 슬라이드
        : 반드시 하나의 carousel-item에 지정

        d-block
        : 이미지를 block 요소로 변경

        w-100
        : 부모 영역의 100% 너비
    -->

    <h2 class="text-center my-4">예제 1. 기본 Carousel</h2>

    <div id="carousel01" class="carousel slide w-75 mx-auto">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://picsum.photos/1000/400?random=1" class="d-block w-100" alt="첫 번째 이미지">
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400?random=2" class="d-block w-100" alt="두 번째 이미지">
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400?random=3" class="d-block w-100" alt="세 번째 이미지">
            </div>
        </div>
    </div>

    <!--
        < 2. Previous / Next >

        기본 Carousel에는 직접 슬라이드를 이동할 수 있는
        이전/다음 버튼을 추가할 수 있다.

        carousel-control-prev
        : 이전 버튼

        carousel-control-next
        : 다음 버튼

        data-bs-target="#carousel02"
        : 어떤 Carousel을 조작할지 지정

        data-bs-slide="prev"
        : 이전 슬라이드로 이동

        data-bs-slide="next"
        : 다음 슬라이드로 이동

        버튼과 Carousel의 id가 서로 연결되어 있어야 한다.
    -->

    <h2 class="text-center my-5">예제 2. 이전 / 다음 버튼</h2>

    <div id="carousel02" class="carousel slide w-75 mx-auto">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://picsum.photos/1000/400?random=4" class="d-block w-100" alt="첫 번째 이미지">
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400?random=5" class="d-block w-100" alt="두 번째 이미지">
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400?random=6" class="d-block w-100" alt="세 번째 이미지">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carousel02" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">이전</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carousel02" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">다음</span>
        </button>
    </div>

    <!--
        < 3. Indicators >

        Indicator
        : 현재 슬라이드 위치를 표시하고
          특정 슬라이드로 바로 이동할 수 있는 버튼

        carousel-indicators
        : Indicator 전체 영역

        data-bs-slide-to
        : 이동할 슬라이드 번호
        : 0부터 시작

        첫 번째 슬라이드 → 0
        두 번째 슬라이드 → 1
        세 번째 슬라이드 → 2

        첫 번째 Indicator에는 active를 지정한다.
    -->

    <h2 class="text-center my-5">예제 3. Indicator</h2>

    <div id="carousel03" class="carousel slide w-75 mx-auto">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carousel03" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carousel03" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carousel03" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://picsum.photos/1000/400?random=7" class="d-block w-100" alt="첫 번째 이미지">
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400?random=8" class="d-block w-100" alt="두 번째 이미지">
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400?random=9" class="d-block w-100" alt="세 번째 이미지">
            </div>
        </div>
    </div>

    <!--
        < 4. Caption >

        Carousel 내부에 텍스트를 표시할 수도 있다.

        carousel-caption
        : 이미지 위에 제목과 설명을 표시하는 영역

        일반적으로 다음과 같이 사용한다.

        <div class="carousel-caption">
            <h5>제목</h5>
            <p>설명</p>
        </div>

        이미지 위에 표시되기 때문에
        배너 제목이나 이벤트 설명 등에 활용하기 좋다.
    -->

    <h2 class="text-center my-5">예제 4. Caption</h2>

    <div id="carousel04" class="carousel slide w-75 mx-auto">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://picsum.photos/1000/400?random=10" class="d-block w-100" alt="바다 여행">
                <div class="carousel-caption">
                    <h5>바다 여행</h5>
                    <p>시원한 바다와 함께하는 여행</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400?random=11" class="d-block w-100" alt="도시 여행">
                <div class="carousel-caption">
                    <h5>도시 여행</h5>
                    <p>새로운 도시를 만나보는 특별한 여행</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400?random=12" class="d-block w-100" alt="자연 여행">
                <div class="carousel-caption">
                    <h5>자연 여행</h5>
                    <p>자연 속에서 여유로운 시간을 보내세요.</p>
                </div>
            </div>
        </div>
    </div>

    <!--
        < 5. 자동 슬라이드 >

        Carousel을 자동으로 이동시킬 수도 있다.

        data-bs-ride="carousel"
        : Carousel을 자동으로 시작

        data-bs-interval="3000"
        : 3초마다 다음 슬라이드로 이동
        : 단위는 밀리초

        1000 = 1초
        2000 = 2초
        3000 = 3초

        자동재생 + Indicator + 이전/다음 버튼 + Caption을
        함께 사용하면 실제 웹사이트의 메인 배너와 비슷한 형태를 만들 수 있다.
    -->

    <h2 class="text-center my-5">예제 5. 자동재생 + 종합</h2>

    <div id="carousel05" class="carousel slide w-75 mx-auto" data-bs-ride="carousel" data-bs-interval="3000">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carousel05" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carousel05" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carousel05" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://picsum.photos/1000/400?random=13" class="d-block w-100" alt="신상품">
                <div class="carousel-caption">
                    <h5>신상품 출시</h5>
                    <p>새롭게 출시된 상품을 만나보세요.</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400?random=14" class="d-block w-100" alt="할인 이벤트">
                <div class="carousel-caption">
                    <h5>할인 이벤트</h5>
                    <p>이번 주말 특별 할인 행사를 진행합니다.</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400?random=15" class="d-block w-100" alt="회원 혜택">
                <div class="carousel-caption">
                    <h5>회원 전용 혜택</h5>
                    <p>회원 가입 후 다양한 혜택을 받아보세요.</p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carousel05" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">이전</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carousel05" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">다음</span>
        </button>
    </div>
</body>
</html>
```
