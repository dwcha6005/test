```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Icons 실습 - 강사</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <!--
        < 문제 1. 쇼핑몰 헤더 >

        쇼핑몰 상단의 기능 메뉴를 아이콘을 이용해 완성한다.

        ① 검색 기능을 나타내는 돋보기 모양 아이콘을 적용한다.
           (정답: bi bi-search)

        ② 장바구니 기능을 나타내는 장바구니 모양 아이콘을 적용한다.
           (정답: bi bi-cart)

        ③ 알림 기능을 나타내는 종 모양 아이콘을 적용한다.
           (정답: bi bi-bell)

        ④ 마이페이지를 나타내는 사람 모양 아이콘을 적용한다.
           (정답: bi bi-person)

        ⑤ 아이콘 크기는 fs-4를 적용한다.
           (정답: fs-4)

        ⑥ 아이콘과 텍스트 사이에 오른쪽 여백을 적용한다.
           (정답: me-1)

        ※ 기존 버튼의 Bootstrap 클래스는 수정하지 않는다.
    -->
    <header class="border-bottom py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h2 class="mb-0">WEB SHOP</h2>
            <div>
                <button class="btn btn-outline-secondary">
                    <i class="bi bi-search fs-4 me-1"></i>검색
                </button>
                <button class="btn btn-outline-secondary">
                    <i class="bi bi-cart fs-4 me-1"></i>장바구니
                </button>
                <button class="btn btn-outline-secondary">
                    <i class="bi bi-bell fs-4 me-1"></i>알림
                </button>
                <button class="btn btn-primary">
                    <i class="bi bi-person fs-4 me-1"></i>마이페이지
                </button>
            </div>
        </div>
    </header>

    <!--
        < 문제 2. 주문 상태 표시 >

        쇼핑몰 주문내역의 배송 상태를 아이콘으로 표현한다.

        ① 주문 완료는 체크 표시가 들어간 원형 아이콘을 적용한다.
           (정답: bi bi-check-circle-fill)

        ② 배송 중은 트럭 모양 아이콘을 적용한다.
           (정답: bi bi-truck)

        ③ 배송 완료는 집 모양과 체크 표시가 함께 있는 아이콘을 적용한다.
           (정답: bi bi-house-check-fill)

        ④ 세 아이콘의 크기는 모두 fs-2로 동일하게 적용한다.
           (정답: fs-2)

        ⑤ 주문 완료 아이콘은 초록색으로 표시한다.
           (정답: text-success)

        ⑥ 배송 중 아이콘은 파란색으로 표시한다.
           (정답: text-primary)

        ⑦ 배송 완료 아이콘은 회색으로 표시한다.
           (정답: text-secondary)

        ⑧ 아이콘과 상태 텍스트 사이에 오른쪽 여백을 적용한다.
           (정답: me-2)
    -->
    <section class="container my-5">
        <h2 class="mb-4">주문 배송 현황</h2>
        <div class="row text-center g-3">
            <div class="col-md-4">
                <div class="border rounded p-4">
                    <i class="bi bi-check-circle-fill fs-2 text-success me-2"></i>
                    <span>주문 완료</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="border rounded p-4">
                    <i class="bi bi-truck fs-2 text-primary me-2"></i>
                    <span>배송 중</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="border rounded p-4">
                    <i class="bi bi-house-check-fill fs-2 text-secondary me-2"></i>
                    <span>배송 완료</span>
                </div>
            </div>
        </div>
    </section>

    <!--
        < 문제 3. 관리자 기능 메뉴 >

        관리자 페이지의 기능 메뉴를 아이콘을 이용해 완성한다.

        ① 회원 관리는 여러 사람을 나타내는 아이콘을 적용한다.
           (정답: bi bi-people)

        ② 주문 관리는 상자 모양 아이콘을 적용한다.
           (정답: bi bi-box-seam)

        ③ 통계는 막대그래프 모양 아이콘을 적용한다.
           (정답: bi bi-bar-chart)

        ④ 설정은 톱니바퀴 모양 아이콘을 적용한다.
           (정답: bi bi-gear)

        ⑤ 아이콘 크기는 fs-1로 적용한다.
           (정답: fs-1)

        ⑥ 아이콘을 한 줄 전체를 사용하는 블록 요소로 만든다.
           (정답: d-block)

        ⑦ 아이콘과 메뉴 이름 사이에 아래쪽 여백을 적용한다.
           (정답: mb-2)

        ※ 기존 Grid와 카드 관련 클래스는 수정하지 않는다.
    -->
    <section class="container my-5">
        <h2 class="mb-4">관리자 메뉴</h2>
        <div class="row g-3">
            <div class="col-6 col-md-3">
                <div class="border rounded p-4 text-center">
                    <i class="bi bi-people fs-1 d-block mb-2"></i>
                    <span>회원 관리</span>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="border rounded p-4 text-center">
                    <i class="bi bi-box-seam fs-1 d-block mb-2"></i>
                    <span>주문 관리</span>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="border rounded p-4 text-center">
                    <i class="bi bi-bar-chart fs-1 d-block mb-2"></i>
                    <span>통계</span>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="border rounded p-4 text-center">
                    <i class="bi bi-gear fs-1 d-block mb-2"></i>
                    <span>설정</span>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
```
