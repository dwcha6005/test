```html
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form 실습</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container py-5">

        <!--
            문제 1. 로그인 Form
            아이디와 비밀번호 입력창을 보기 좋게 배치하고
            각 입력창 위에 설명을 표시한다.
            로그인 버튼은 주요 버튼으로 표현한다.
        -->
        <h2>문제 1. 로그인 Form</h2>

        <form>
            <div class="">
                <label for="loginId" class="">아이디</label>
                <input type="text" id="loginId" class="" placeholder="아이디를 입력하세요">
            </div>

            <div class="">
                <label for="loginPw" class="">비밀번호</label>
                <input type="password" id="loginPw" class="" placeholder="비밀번호를 입력하세요">
            </div>

            <button type="submit" class="">로그인</button>
        </form>

        <!--
            문제 2. 문의 Form
            여러 줄의 내용을 입력할 수 있는 영역을 만들고
            입력 영역 아래에 안내 문구를 표시한다.
        -->
        <h2 class="">문제 2. 문의 Form</h2>

        <div class="">
            <label for="question" class="">문의 내용</label>
            <textarea id="question" class="" rows="5" placeholder="문의 내용을 입력하세요"></textarea>
            <div class="">문의 내용을 자세하게 작성해주세요.</div>
        </div>

        <!--
            문제 3. 과정 선택
            사용자가 하나의 과정을 선택할 수 있도록 선택 목록을 만든다.
            선택 목록 위에 설명을 표시한다.
        -->
        <h2 class="">문제 3. 과정 선택</h2>

        <div class="">
            <label for="selectCourse" class="">수강 과정</label>
            <select id="selectCourse" class="">
                <option selected>과정을 선택하세요</option>
                <option>Java 웹 개발</option>
                <option>프론트엔드 개발</option>
                <option>Python 데이터 분석</option>
            </select>
        </div>

        <!--
            문제 4. 수강 유형
            여러 선택지 중 하나를 선택할 수 있도록 만든다.
            두 선택지는 같은 그룹으로 동작해야 한다.
        -->
        <h2 class="">문제 4. 수강 유형</h2>

        <!-- name: type -->
        <div class="">
            <input type="radio" name="" id="fullTime" class="">
            <label for="fullTime" class="">취업 준비생</label>
        </div>

        <div class="">
            <input type="radio" name="" id="" class="">
            <label for="workerType" class="">재직자</label>
        </div>

        <!--
            문제 5. 검색창
            검색어 입력창과 검색 버튼을 하나의 영역처럼 연결한다.
        -->
        <h2 class="">문제 5. 검색창</h2>

        <div class="">
            <input type="text" class="" placeholder="검색어를 입력하세요">
            <button type="button" class="">검색</button>
        </div>

        <!--
            문제 6. 상담 신청 Form
            이름과 연락처는 작은 화면에서 한 줄씩,
            중간 크기 이상의 화면에서는 두 항목이 한 줄에 배치되도록 만든다.
            이메일과 과정 선택은 한 줄 전체를 사용한다.
            마지막에 개인정보 동의와 신청 버튼을 배치한다.
        -->
        <h2 class="">문제 6. 상담 신청 Form</h2>

        <form>
            <div class="">
                <div class="">
                    <label for="name" class="">이름</label>
                    <input type="text" id="name" class="" placeholder="이름">
                </div>

                <div class="">
                    <label for="phone" class="">연락처</label>
                    <input type="tel" id="phone" class="" placeholder="010-0000-0000">
                </div>

                <div class="">
                    <label for="emailAddress" class="">이메일</label>
                    <input type="email" id="emailAddress" class="" placeholder="example@email.com">
                </div>

                <div class="">
                    <label for="courseName" class="">관심 과정</label>
                    <select id="courseName" class="">
                        <option selected>과정을 선택하세요</option>
                        <option>Java 웹 개발</option>
                        <option>프론트엔드 개발</option>
                        <option>Python 데이터 분석</option>
                    </select>
                </div>

                <div class="">
                    <label for="memo" class="">문의 내용</label>
                    <textarea id="memo" class="" rows="4" placeholder="궁금한 내용을 작성해주세요."></textarea>
                </div>

                <div class="">
                    <div class="">
                        <input type="checkbox" id="privacy" class="">
                        <label for="privacy" class="">개인정보 수집 및 이용에 동의합니다.</label>
                    </div>
                </div>

                <div class="">
                    <button type="" class="">상담 신청</button>
                    <button type="" class="">초기화</button>
                </div>
            </div>
        </form>

    </div>

</body>
</html>
```
