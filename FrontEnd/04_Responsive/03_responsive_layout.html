<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04 Responsive Layout</title>

<style>

/* =====================================
01 반응형 레이아웃

PC

┌──────────── Header ────────────┐
├──── Sidebar ────┬── Content ──┤
├──────────── Footer ────────────┤

모바일

Header
Sidebar
Content
Footer

===================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial;
}


/* =====================================
02 전체 레이아웃
===================================== */

.container{
    min-height:100vh;

    display:grid;

    grid-template-areas:
        "header header"
        "sidebar content"
        "footer footer";

    grid-template-columns:250px 1fr;

    grid-template-rows:
        80px
        1fr
        80px;
}


/* =====================================
03 Header
===================================== */

header{
    grid-area:header;

    background:#222;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;
}


/* =====================================
04 Sidebar
===================================== */

aside{
    grid-area:sidebar;

    background:#f4f4f4;

    padding:20px;
}

aside ul{
    list-style:none;
    padding:0;
}

aside li{
    margin-bottom:15px;
}


/* =====================================
05 Content
===================================== */

main{
    grid-area:content;

    padding:30px;
}

.card-list{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(200px,1fr));

    gap:20px;
}

.card{
    height:180px;

    background:#eee;

    display:flex;
    justify-content:center;
    align-items:center;
}


/* =====================================
06 Footer
===================================== */

footer{
    grid-area:footer;

    background:#222;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;
}


/* =====================================
07 태블릿

Sidebar 축소
===================================== */

@media (max-width:900px){

    .container{
        grid-template-columns:
            180px 1fr;
    }

}


/* =====================================
08 모바일

한 줄 배치
===================================== */

@media (max-width:768px){

    .container{

        grid-template-areas:
            "header"
            "sidebar"
            "content"
            "footer";

        grid-template-columns:1fr;

        grid-template-rows:
            80px
            auto
            1fr
            80px;
    }

}

</style>
</head>

<body>

<div class="container">

<header>
    HEADER
</header>

<aside>

    <ul>
        <li>HOME</li>
        <li>ABOUT</li>
        <li>PRODUCT</li>
        <li>CONTACT</li>
    </ul>

</aside>

<main>

    <h2>CONTENT</h2>

    <div class="card-list">

        <div class="card">CARD 1</div>
        <div class="card">CARD 2</div>
        <div class="card">CARD 3</div>
        <div class="card">CARD 4</div>

    </div>

</main>

<footer>
    FOOTER
</footer>

</div>

</body>
</html>
