<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04 Flex Gallery 실습</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        section {
            margin: 40px;
        }


        /* =========================================================
           실습 1. Flex Gallery 만들기
           =========================================================

           조건

           1. Flex Container로 만든다.
           2. Item이 공간이 부족하면 다음 줄로 내려간다.
           3. Item 사이 간격은 20px
           4. Item의 가로 크기는 150px
           5. Item이 줄어들지 않도록 한다.

           브라우저 크기를 줄여서 확인한다.
        */

        .practice1 {
            border: 2px solid royalblue;
            padding: 20px;
        }

        .practice1 .gallery {

            /* 작성 */
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .practice1 .item {

            /* 작성 */
            width: 150px;
            flex-shrink: 0;

            height: 120px;

            background-color: royalblue;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================================================
           실습 2. flex-basis 사용하기
           =========================================================

           조건

           1. Flex Container로 만든다.
           2. Item이 줄바꿈된다.
           3. Item의 기본 크기는 200px이다.
           4. Item 사이 간격은 20px
           5. Item 높이는 150px
        */

        .practice2 {
            border: 2px solid tomato;
            padding: 20px;
        }

        .practice2 .gallery {

            /* 작성 */
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .practice2 .item {

            /* 작성 */
            flex-basis: 200px;

            height: 150px;

            background-color: tomato;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================================================
           실습 3. flex-grow 사용하기
           =========================================================

           조건

           1. Item을 가로로 배치한다.
           2. Item 사이 간격은 20px
           3. 모든 Item의 기본 크기는 150px
           4. 첫 번째 Item의 grow는 1
           5. 두 번째 Item의 grow는 2
           6. 세 번째 Item의 grow는 1

           결과

           남는 공간을

           1 : 2 : 1

           비율로 나누어 가져간다.
        */

        .practice3 {
            border: 2px solid seagreen;
            padding: 20px;
        }

        .practice3 .container {

            /* 작성 */
            display: flex;
            gap: 20px;
        }

        .practice3 .item {

            /* 작성 */
            flex-basis: 150px;

            height: 150px;

            background-color: seagreen;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .practice3 .item:nth-child(1) {

            /* 작성 */
            flex-grow: 1;
        }

        .practice3 .item:nth-child(2) {

            /* 작성 */
            flex-grow: 2;
        }

        .practice3 .item:nth-child(3) {

            /* 작성 */
            flex-grow: 1;
        }


        /* =========================================================
           실습 4. 반응형 상품 카드 만들기
           =========================================================

           조건

           1. 상품 카드를 Flex로 배치한다.
           2. 카드가 공간이 부족하면 다음 줄로 내려간다.
           3. 카드 사이 간격은 20px
           4. 카드의 기본 크기는 220px
           5. 남는 공간은 카드들이 나누어 가진다.
           6. 공간이 부족하면 카드가 줄어들 수 있다.

           핵심

           flex: 1 1 220px;
        */

        .practice4 {
            border: 2px solid #333;
            padding: 20px;
        }

        .practice4 .gallery {

            /* 작성 */
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .practice4 .card {

            /* 작성 */
            flex: 1 1 220px;

            border: 1px solid #ddd;
            border-radius: 10px;

            overflow: hidden;
        }

        .practice4 .image {
            height: 160px;

            background-color: #eee;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .practice4 .info {
            padding: 20px;
        }

        .practice4 h3 {
            margin: 0 0 10px;
        }

        .practice4 p {
            margin: 0;
            font-weight: bold;
        }

    </style>
</head>

<body>


    <h1>04. Flex Gallery 실습</h1>


    <!-- =========================================================
         실습 1
         ========================================================= -->

    <section>

        <h2>실습 1. Flex Gallery 만들기</h2>

        <div class="practice1">

            <div class="gallery">

                <div class="item">1</div>
                <div class="item">2</div>
                <div class="item">3</div>
                <div class="item">4</div>
                <div class="item">5</div>
                <div class="item">6</div>

            </div>

        </div>

    </section>


    <!-- =========================================================
         실습 2
         ========================================================= -->

    <section>

        <h2>실습 2. flex-basis 사용하기</h2>

        <div class="practice2">

            <div class="gallery">

                <div class="item">ITEM 1</div>
                <div class="item">ITEM 2</div>
                <div class="item">ITEM 3</div>
                <div class="item">ITEM 4</div>

            </div>

        </div>

    </section>


    <!-- =========================================================
         실습 3
         ========================================================= -->

    <section>

        <h2>실습 3. flex-grow 사용하기</h2>

        <div class="practice3">

            <div class="container">

                <div class="item">1</div>
                <div class="item">2</div>
                <div class="item">3</div>

            </div>

        </div>

    </section>


    <!-- =========================================================
         실습 4
         ========================================================= -->

    <section>

        <h2>실습 4. 반응형 상품 카드 만들기</h2>

        <div class="practice4">

            <div class="gallery">


                <div class="card">

                    <div class="image">
                        상품 이미지 1
                    </div>

                    <div class="info">
                        <h3>상품 A</h3>
                        <p>29,000원</p>
                    </div>

                </div>


                <div class="card">

                    <div class="image">
                        상품 이미지 2
                    </div>

                    <div class="info">
                        <h3>상품 B</h3>
                        <p>39,000원</p>
                    </div>

                </div>


                <div class="card">

                    <div class="image">
                        상품 이미지 3
                    </div>

                    <div class="info">
                        <h3>상품 C</h3>
                        <p>49,000원</p>
                    </div>

                </div>


                <div class="card">

                    <div class="image">
                        상품 이미지 4
                    </div>

                    <div class="info">
                        <h3>상품 D</h3>
                        <p>59,000원</p>
                    </div>

                </div>


                <div class="card">

                    <div class="image">
                        상품 이미지 5
                    </div>

                    <div class="info">
                        <h3>상품 E</h3>
                        <p>69,000원</p>
                    </div>

                </div>


            </div>

        </div>

    </section>


</body>
</html>
