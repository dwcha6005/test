<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>01_float 실습</title>



   <!--
========================================
실습

<style>
.product{
    width:200px;
    height:200px;
    background:skyblue;
    float:left;
    margin-right:20px;
    text-align:center;
    line-height:200px;
}

.more{
    clear:both;
    width:150px;
    margin-top:20px;
    padding:15px;
    text-align:center;
    background:orange;
}
