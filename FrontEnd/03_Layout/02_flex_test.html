<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex 실습</title>

    <style>

        /* 
           < 실습 1. 가로 정렬 >
           조건)
           1. .box-container를 Flex Container로 만든다.
           2. 박스 3개를 가로로 배치한다.
           3. 박스 사이의 간격은 20px로 한다.
        */
        .box-container1 {
            border: 2px solid black;
            padding: 20px;
            /* 여기에 작성 */
            display: flex;
            gap: 20px;
        }
        .box1 {
            width: 100px;
            height: 100px;
            background-color: royalblue;
            color: white;
            /* display: flex;
            justify-content: center;
            align-items: center; */
            text-align: center;
            line-height: 100px;
        }


        /* 
           < 실습 2. 양쪽 배치 >
           조건)
           1. Flex를 사용한다.
           2. 첫 번째 박스는 왼쪽에 배치한다.
           3. 두 번째 박스는 오른쪽에 배치한다.
           4. 두 박스의 세로 위치는 가운데로 맞춘다.
        */
        .box-container2 {
            border: 2px solid black;
            /* 여기에 작성 */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .box2 {
            width: 100px;
            height: 60px;
            color: white;
            background-color: rosybrown;
            /* display: flex;
            justify-content: center;
            align-items: center; */
            text-align: center;
            line-height: 60px;
        }


        /* 
           < 실습 3. 화면 가운데 정렬 >
           조건)
           1. Flex를 사용한다.
           2. 박스를 가로 가운데 정렬한다.
           3. 박스를 세로 가운데 정렬한다.
        */
        .box-container3 {
            height: 200px;
            border: 2px solid black;
            /* 여기에 작성 */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box3 {
            width: 150px;
            height: 80px;
            background-color: seagreen;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* 
           < 실습 4. 세로 메뉴 >
           조건)
           1. Flex를 사용한다.
           2. 박스 4개를 세로 방향으로 배치한다.
           3. 박스 사이의 간격은 10px이다.
        */
        .box-container4 {
            border: 2px solid black;
            padding: 20px;
            /* 여기에 작성 */
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .box4 {
            width: 200px;
            height: 50px;
            background-color: slateblue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* 
           < 실습 5. 줄바꿈 >
           조건)
           1. Flex를 사용한다.
           2. 박스를 가로 방향으로 배치한다.
           3. 박스가 한 줄에 모두 들어가지 않으면
              다음 줄로 이동하도록 한다.
           4. 박스 사이의 간격은 10px이다.
           5. 박스의 크기는 120px × 80px이다.
        */
        .box-container5 {
            width: 450px;
            border: 2px solid black;
            padding: 10px;
            /* 여기에 작성 */
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .box5 {
            width: 120px;
            height: 80px;
            background-color: darkorange;
            color: white;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* 
           < 실습 6. 주축 방향 변경 >
           조건)
           1. Flex를 사용한다.
           2. 박스를 세로 방향으로 배치한다.
           3. 박스들을 세로 가운데에 배치한다.
           4. 박스 사이의 간격은 15px이다.
        */
        .box-container6 {
            width: 300px;
            height: 300px;
            border: 2px solid black;
            /* 여기에 작성 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .box6 {
            width: 100px;
            height: 50px;
            background-color: crimson;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <h1>Flex 실습</h1>


    <!-- 실습 1 -->
    <h2>실습 1. 가로 정렬</h2>
    <div class="box-container1">
        <div class="box1">BOX 1</div>
        <div class="box1">BOX 2</div>
        <div class="box1">BOX 3</div>
    </div>


    <!-- 실습 2 -->
    <h2>실습 2. 양쪽 배치</h2>
    <div class="box-container2">
        <div class="box2">LEFT</div>
        <div class="box2">RIGHT</div>
    </div>


    <!-- 실습 3 -->
    <h2>실습 3. 화면 가운데 정렬</h2>
    <div class="box-container3">
        <div class="box3">CENTER</div>
    </div>


    <!-- 실습 4 -->
    <h2>실습 4. 세로 방향 배치</h2>
    <div class="box-container4">
        <div class="box4">BOX 1</div>
        <div class="box4">BOX 2</div>
        <div class="box4">BOX 3</div>
        <div class="box4">BOX 4</div>
    </div>


    <!-- 실습 5 -->
    <h2>실습 5. 줄바꿈</h2>
    <div class="box-container5">
        <div class="box5">BOX 1</div>
        <div class="box5">BOX 2</div>
        <div class="box5">BOX 3</div>
        <div class="box5">BOX 4</div>
        <div class="box5">BOX 5</div>
        <div class="box5">BOX 6</div>
    </div>


    <!-- 실습 6 -->
    <h2>실습 6. 주축 방향 변경</h2>
    <div class="box-container6">
        <div class="box6">BOX 1</div>
        <div class="box6">BOX 2</div>
        <div class="box6">BOX 3</div>
    </div>
</body>
</html>
