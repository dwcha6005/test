<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 Flex Menu 실습</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        section {
            margin: 40px;
        }


        /* =========================================================
           실습 1. 기본 Header 만들기
           =========================================================

           조건
           1. Header 높이는 70px
           2. LOGO는 왼쪽에 배치
           3. 메뉴는 오른쪽에 배치
           4. 메뉴는 가로 방향으로 배치
           5. 메뉴 사이 간격은 30px
           6. LOGO와 메뉴는 세로 가운데 정렬
           7. 메뉴에 마우스를 올리면 tomato 색상으로 변경

           결과

           LOGO                    HOME ABOUT PRODUCT CONTACT
        */

        .practice1 {
            border: 1px solid #ddd;
        }

        .practice1 header {
            height: 70px;
            padding: 0 30px;

            /* 작성 */
            display: flex;
            align-items: center;
        }

        .practice1 .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .practice1 nav {
            /* 작성 */
            display: flex;
            gap: 30px;
            margin-left: auto;
        }

        .practice1 nav a {
            color: #333;
            text-decoration: none;
        }

        .practice1 nav a:hover {
            /* 작성 */
            color: tomato;
        }


        /* =========================================================
           실습 2. Header + Login 만들기
           =========================================================

           조건
           1. Header 높이는 80px
           2. LOGO는 왼쪽
           3. 메뉴는 LOGO 오른쪽에 배치
           4. LOGIN은 가장 오른쪽
           5. 메뉴 사이 간격은 25px
           6. 모든 요소는 세로 가운데 정렬
           7. EVENT 메뉴에는 active 클래스를 적용
           8. active 메뉴는 굵게 표시하고 tomato 색상 적용

           결과

           LOGO       HOME PRODUCT EVENT COMMUNITY          LOGIN
        */

        .practice2 {
            border: 1px solid #ddd;
        }

        .practice2 header {
            height: 80px;
            padding: 0 30px;

            /* 작성 */
            display: flex;
            align-items: center;
        }

        .practice2 .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .practice2 nav {
            /* 작성 */
            display: flex;
            gap: 25px;
            margin-left: 50px;
        }

        .practice2 nav a {
            color: #333;
            text-decoration: none;
        }

        .practice2 nav a:hover {
            /* 작성 */
            color: tomato;
        }

        .practice2 nav a.active {
            /* 작성 */
            color: tomato;
            font-weight: bold;
        }

        .practice2 .login {
            /* 작성 */
            margin-left: auto;
        }


        /* =========================================================
           실습 3. 쇼핑몰 Header 만들기
           =========================================================

           조건
           1. Header 높이는 90px
           2. LOGO는 왼쪽
           3. CATEGORY는 LOGO 오른쪽
           4. 메뉴는 CATEGORY 오른쪽
           5. 메뉴 사이 간격은 25px
           6. 검색창은 오른쪽으로 밀어낸다.
           7. LOGIN은 검색창 오른쪽에 배치한다.
           8. Header 내부의 요소들은 세로 가운데 정렬
           9. 메뉴에 마우스를 올리면 tomato 색상으로 변경

           결과

           LOGO CATEGORY NEW BEST SALE EVENT      검색      LOGIN
        */

        .practice3 {
            border: 1px solid #ddd;
        }

        .practice3 header {
            height: 90px;
            padding: 0 30px;

            /* 작성 */
            display: flex;
            align-items: center;
        }

        .practice3 .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .practice3 .category {
            margin-left: 30px;
            padding: 8px 12px;

            border: 1px solid #ccc;
        }

        .practice3 nav {
            margin-left: 30px;

            /* 작성 */
            display: flex;
            gap: 25px;
        }

        .practice3 nav a {
            color: #333;
            text-decoration: none;
        }

        .practice3 nav a:hover {
            /* 작성 */
            color: tomato;
        }

        .practice3 .search {
            width: 180px;
            height: 36px;

            padding: 0 15px;

            border: 1px solid #ccc;
            border-radius: 18px;

            /* 작성 */
            margin-left: auto;

            display: flex;
            align-items: center;

            color: #888;
        }

        .practice3 .login {
            margin-left: 20px;

            padding: 8px 15px;

            border: 1px solid #333;
        }


        /* =========================================================
           실습 4. Header 구조 직접 구성하기
           =========================================================

           조건
           1. Header 높이는 80px
           2. LOGO는 왼쪽
           3. nav는 LOGO와 떨어져 배치
           4. nav의 메뉴는 가로로 배치
           5. 메뉴 사이 간격은 20px
           6. 오른쪽에 SEARCH와 LOGIN을 배치
           7. SEARCH와 LOGIN 사이 간격은 15px
           8. Header의 모든 요소는 세로 가운데 정렬
           9. SEARCH와 LOGIN은 오른쪽에 붙어 있어야 한다.

           결과

           LOGO    HOME ABOUT SERVICE CONTACT       SEARCH LOGIN
        */

        .practice4 {
            border: 1px solid #ddd;
        }

        .practice4 header {
            height: 80px;
            padding: 0 30px;

            /* 작성 */
            display: flex;
            align-items: center;
        }

        .practice4 .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .practice4 nav {
            /* 작성 */
            display: flex;
            gap: 20px;
            margin-left: 40px;
        }

        .practice4 nav a {
            color: #333;
            text-decoration: none;
        }

        .practice4 nav a:hover {
            /* 작성 */
            color: tomato;
        }

        .practice4 .user-area {
            /* 작성 */
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: auto;
        }

        .practice4 .search {
            padding: 8px 15px;

            border: 1px solid #ccc;
            border-radius: 5px;

            color: #888;
        }

        .practice4 .login {
            padding: 8px 15px;

            border: 1px solid #333;
            border-radius: 5px;
        }

    </style>
</head>

<body>


    <h1>03. Flex Menu 실습</h1>


    <!-- =========================================================
         실습 1
         ========================================================= -->

    <section class="practice1">

        <h2>실습 1. 기본 Header 만들기</h2>

        <header>

            <div class="logo">
                MY SHOP
            </div>

            <nav>
                <a href="javascript:void(0)">HOME</a>
                <a href="javascript:void(0)">ABOUT</a>
                <a href="javascript:void(0)">PRODUCT</a>
                <a href="javascript:void(0)">CONTACT</a>
            </nav>

        </header>

    </section>


    <!-- =========================================================
         실습 2
         ========================================================= -->

    <section class="practice2">

        <h2>실습 2. Header + Login</h2>

        <header>

            <div class="logo">
                SHOP
            </div>

            <nav>
                <a href="javascript:void(0)">HOME</a>
                <a href="javascript:void(0)">PRODUCT</a>
                <a href="javascript:void(0)" class="active">EVENT</a>
                <a href="javascript:void(0)">COMMUNITY</a>
            </nav>

            <div class="login">
                LOGIN
            </div>

        </header>

    </section>


    <!-- =========================================================
         실습 3
         ========================================================= -->

    <section class="practice3">

        <h2>실습 3. 쇼핑몰 Header 만들기</h2>

        <header>

            <div class="logo">
                SHOP
            </div>

            <div class="category">
                ☰ CATEGORY
            </div>

            <nav>
                <a href="javascript:void(0)">NEW</a>
                <a href="javascript:void(0)">BEST</a>
                <a href="javascript:void(0)">SALE</a>
                <a href="javascript:void(0)">EVENT</a>
            </nav>

            <div class="search">
                검색
            </div>

            <div class="login">
                LOGIN
            </div>

        </header>

    </section>


    <!-- =========================================================
         실습 4
         ========================================================= -->

    <section class="practice4">

        <h2>실습 4. Header 구조 직접 구성하기</h2>

        <header>

            <div class="logo">
                COMPANY
            </div>

            <nav>
                <a href="javascript:void(0)">HOME</a>
                <a href="javascript:void(0)">ABOUT</a>
                <a href="javascript:void(0)">SERVICE</a>
                <a href="javascript:void(0)">CONTACT</a>
            </nav>

            <div class="user-area">

                <div class="search">
                    검색
                </div>

                <div class="login">
                    LOGIN
                </div>

            </div>

        </header>

    </section>


</body>
</html>
