<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    /*
    < 7. 종합 예제 1 : 상품 가격 처리 >

    요구사항
    1. 상품의 가격 정보를 객체로 만든다.
    2. 가격 목록을 이용해 최저가와 최고가를 구한다.
    3. 평균 가격을 소수점 둘째 자리까지 표시한다.
*/

{
    let product = {
        name: "무선 키보드",
        prices: [39000, 45000, 42000, 36000, 41000]
    };

    let minPrice = Math.min(...product.prices);
    let maxPrice = Math.max(...product.prices);

    let total = 0;

    for (let price of product.prices) {
        total += price;
    }

    let average = total / product.prices.length;

    console.log("상품명:", product.name);
    console.log("최저가:", minPrice);
    console.log("최고가:", maxPrice);
    console.log("평균가:", average.toFixed(2));
}


/*
    < 8. 종합 예제 2 : 회원 정보 정리 >

    요구사항
    1. 회원의 이름과 이메일을 저장한다.
    2. 이름 앞뒤의 공백을 제거한다.
    3. 이메일을 소문자로 변환한다.
    4. Object.entries()를 이용해 회원 정보를 출력한다.
*/

{
    let member = {
        name: "  Kim  ",
        email: "  STUDENT@EXAMPLE.COM "
    };

    member.name = member.name.trim();
    member.email = member.email.trim().toLowerCase();

    for (let [key, value] of Object.entries(member)) {
        console.log(key + ":", value);
    }
}


/*
    < 9. 실습 문제 >

    문제 1. Math
    사용자 점수가 72점일 때, 0~100 범위의 점수에
    무작위로 5점을 더하거나 빼는 프로그램을 작성하시오.
    단, 최종 점수는 0~100 범위를 벗어나면 안 된다.

    문제 2. Date
    현재 날짜를 기준으로 30일 뒤의 날짜를 구하시오.
    연도, 월, 일을 각각 출력하시오.

    문제 3. Number
    다음 문자열을 숫자로 변환하고, 숫자가 아닌 경우
    "숫자로 변환할 수 없습니다."를 출력하시오.

    let input = "123.45";

    문제 4. String
    다음 문자열에서 앞뒤 공백을 제거하고,
    모든 문자를 소문자로 변환한 다음,
    쉼표를 기준으로 나누어 배열로 만드시오.

    let text = "  Java,HTML,CSS,JavaScript  ";

    문제 5. Object
    다음 객체에서 모든 프로퍼티 이름과 값을 출력하시오.

    let student = {
        name: "김학생",
        age: 24,
        score: 95
    };

    문제 6. Object
    다음 객체의 복사본을 만들고, 복사본의 age를 30으로 변경하시오.
    원본 객체의 age는 변경되지 않아야 한다.

    let person = {
        name: "홍길동",
        age: 25
    };
*/


/*
    < 10. 실습 문제 정답 >
*/

// 문제 1. Math
{
    let score = 72;

    // 0 또는 1을 무작위로 생성
    let direction = Math.floor(Math.random() * 2);

    // direction이 0이면 -5, 1이면 +5
    let change = direction === 0 ? -5 : 5;

    let result = score + change;

    // 최종 점수를 0~100 범위로 제한
    result = Math.min(100, Math.max(0, result));

    console.log("기존 점수:", score);
    console.log("변경 점수:", result);
}


// 문제 2. Date
{
    let today = new Date();

    let future = new Date(today);
    future.setDate(future.getDate() + 30);

    console.log("연도:", future.getFullYear());
    console.log("월:", future.getMonth() + 1);
    console.log("일:", future.getDate());
}


// 문제 3. Number
{
    let input = "123.45";
    let number = Number(input);

    if (Number.isNaN(number)) {
        console.log("숫자로 변환할 수 없습니다.");
    } else {
        console.log(number);
    }
}


// 문제 4. String
{
    let text = "  Java,HTML,CSS,JavaScript  ";

    let result = text.trim().toLowerCase().split(",");

    console.log(result);
    // ["java", "html", "css", "javascript"]
}


// 문제 5. Object
{
    let student = {
        name: "김학생",
        age: 24,
        score: 95
    };

    for (let [key, value] of Object.entries(student)) {
        console.log(key, value);
    }
}


// 문제 6. Object
{
    let person = {
        name: "홍길동",
        age: 25
    };

    let copy = Object.assign({}, person);

    copy.age = 30;

    console.log("원본:", person);
    console.log("복사본:", copy);

    // 원본 age: 25
    // 복사본 age: 30
}
</script>
