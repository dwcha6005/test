<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    /*
    < 25. 실습 문제 >

    문제 1. 회원 정보

    다음 조건을 만족하는 person 객체를 작성하시오.

    name : "홍길동"
    age : 20
    address :
        city : "부산"
        district : "해운대구"

    1. 이름을 출력하시오.
    2. 도시를 출력하시오.
    3. district를 "수영구"로 수정하시오.
    4. 수정된 district를 출력하시오.


    문제 2. 학생 목록

    다음 조건을 만족하는 students 배열을 작성하시오.

    홍길동 : 90점
    김철수 : 80점
    이영희 : 95점

    1. 첫 번째 학생의 이름을 출력하시오.
    2. 두 번째 학생의 점수를 출력하시오.
    3. 세 번째 학생의 점수를 100점으로 수정하시오.
    4. for문을 사용하여 모든 학생의 이름과 점수를 출력하시오.


    문제 3. 상품 목록

    다음 상품 정보를 배열에 저장하시오.

    키보드 : 30000원, 재고 10개
    마우스 : 15000원, 재고 20개
    모니터 : 200000원, 재고 5개

    1. 모든 상품의 이름을 출력하시오.
    2. 가격이 30000원 이상인 상품만 출력하시오.
    3. 모든 상품의 가격 합계를 구하시오.


    문제 4. 주문 정보

    다음 구조를 가진 order 객체를 작성하시오.

    주문번호 : "ORD-001"
    주문자 :
        이름 : "홍길동"
        지역 : "부산"

    주문 상품 :
        키보드, 가격 30000원, 수량 1개
        마우스, 가격 15000원, 수량 2개

    1. 주문번호를 출력하시오.
    2. 주문자 이름과 지역을 출력하시오.
    3. 모든 주문 상품의 이름을 출력하시오.
    4. 총 주문 금액을 계산하시오.
*/


/*
    < 26. 실습 문제 정답 >

    문제 1. 회원 정보
*/

{
    let person = {
        name: "홍길동",
        age: 20,
        address: {
            city: "부산",
            district: "해운대구"
        }
    };

    console.log(person.name);
    console.log(person.address.city);

    person.address.district = "수영구";

    console.log(person.address.district);
}


/*
    문제 2. 학생 목록
*/

{
    let students = [
        { name: "홍길동", score: 90 },
        { name: "김철수", score: 80 },
        { name: "이영희", score: 95 }
    ];

    console.log(students[0].name);
    console.log(students[1].score);

    students[2].score = 100;

    for (let i = 0; i < students.length; i++) {
        console.log(students[i].name + " : " + students[i].score);
    }
}


/*
    문제 3. 상품 목록
*/

{
    let products = [
        { name: "키보드", price: 30000, stock: 10 },
        { name: "마우스", price: 15000, stock: 20 },
        { name: "모니터", price: 200000, stock: 5 }
    ];

    // 모든 상품 이름 출력
    for (let product of products) {
        console.log(product.name);
    }

    // 가격이 30000원 이상인 상품 출력
    for (let product of products) {
        if (product.price >= 30000) {
            console.log(product.name + " : " + product.price + "원");
        }
    }

    // 모든 상품 가격 합계
    let totalPrice = 0;

    for (let product of products) {
        totalPrice += product.price;
    }

    console.log("상품 가격 합계 : " + totalPrice + "원");
}


/*
    문제 4. 주문 정보
*/

{
    let order = {
        orderNo: "ORD-001",
        customer: {
            name: "홍길동",
            city: "부산"
        },
        items: [
            { name: "키보드", price: 30000, quantity: 1 },
            { name: "마우스", price: 15000, quantity: 2 }
        ]
    };

    console.log(order.orderNo);
    console.log(order.customer.name);
    console.log(order.customer.city);

    let totalPrice = 0;

    for (let item of order.items) {
        console.log(item.name);

        totalPrice += item.price * item.quantity;
    }

    console.log("총 주문 금액 : " + totalPrice + "원");
}
</script>

<body>
    
</body>
</html>
