<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    
/*
    05_object_nested.js

    < 학습 목표 >
    1. 중첩 객체의 개념을 이해한다.
    2. 객체 안에 객체를 프로퍼티로 저장할 수 있다.
    3. 객체 안에 배열을 저장하고 사용할 수 있다.
    4. 배열 안에 객체를 저장하고 사용할 수 있다.
    5. 중첩된 데이터의 프로퍼티를 조회하고 수정할 수 있다.
    6. 반복문을 사용하여 객체 배열을 처리할 수 있다.
    7. 실제 웹 개발에서 사용하는 데이터 구조를 이해한다.
*/


/*
    < 1. 중첩 객체란? >

    객체의 프로퍼티 값으로 또 다른 객체를 저장할 수 있다.

    객체 안에 객체가 들어 있는 구조를 중첩 객체라고 한다.
*/

{
    let person = {
        name: "홍길동",
        age: 20,
        address: {
            city: "부산",
            district: "해운대구",
            detail: "센텀로 100"
        }
    };

    console.log(person);
    console.log(person.name);
    console.log(person.address);
}

/*
    person 객체의 프로퍼티

    name     -> 문자열
    age      -> 숫자
    address  -> 객체

    address 프로퍼티에는 문자열이 아니라
    또 다른 객체가 저장되어 있다.

    객체의 프로퍼티 값에는 문자열, 숫자, 배열뿐만 아니라
    다른 객체도 저장할 수 있다.
*/


/*
    < 2. 중첩 객체의 프로퍼티에 접근하기 >

    중첩된 객체에 접근하려면 점(.)을 이어서 작성한다.
*/

{
    let person = {
        name: "홍길동",
        age: 20,
        address: {
            city: "부산",
            district: "해운대구",
            detail: "센텀로 100"
        }
    };

    console.log(person.name);                // 홍길동
    console.log(person.address.city);        // 부산
    console.log(person.address.district);    // 해운대구
    console.log(person.address.detail);      // 센텀로 100
}

/*
    person.address.city의 의미

    1. person 객체에 접근한다.
    2. person의 address 프로퍼티에 접근한다.
    3. address 객체의 city 프로퍼티에 접근한다.

    접근 순서

    person
        └── address
                └── city

    중첩 단계가 더 깊어져도 같은 방식으로 접근할 수 있다.
*/


/*
    < 3. 대괄호 표기법으로 중첩 객체에 접근하기 >

    프로퍼티 이름을 변수로 관리하거나
    프로퍼티 이름에 공백 등이 포함되어 있다면
    대괄호 표기법을 사용할 수 있다.
*/

{
    let person = {
        name: "홍길동",
        address: {
            city: "부산",
            "postal code": "48058"
        }
    };

    let key = "city";

    console.log(person.address[key]);             // 부산
    console.log(person.address["postal code"]);   // 48058
}

/*
    person.address[key]

    key 변수에 저장된 "city"라는 문자열을
    프로퍼티 이름으로 사용한다.

    person.address.key라고 작성하면
    key라는 이름의 프로퍼티를 찾기 때문에 결과가 다르다.
*/


/*
    < 4. 중첩 객체의 프로퍼티 수정하기 >

    중첩 객체의 프로퍼티도 기존 객체와 같은 방법으로 수정한다.
*/

{
    let person = {
        name: "홍길동",
        address: {
            city: "부산",
            district: "해운대구"
        }
    };

    // 중첩 객체의 프로퍼티 수정
    person.address.city = "서울";
    person.address.district = "강남구";

    console.log(person.address.city);       // 서울
    console.log(person.address.district);  // 강남구
}

/*
    person.address.city = "서울";

    person 객체 자체를 새로 만드는 것이 아니다.
    person 안에 저장된 address 객체의 city 값을 수정한다.
*/


/*
    < 5. 중첩 객체에 프로퍼티 추가하기 >

    중첩 객체에도 새로운 프로퍼티를 추가할 수 있다.
*/

{
    let person = {
        name: "홍길동",
        address: {
            city: "부산"
        }
    };

    // address 객체에 프로퍼티 추가
    person.address.district = "해운대구";
    person.address.detail = "센텀로 100";

    console.log(person.address);
}

/*
    중첩 객체에 프로퍼티를 추가할 때도
    기존에 배운 객체 프로퍼티 추가 문법을 그대로 사용한다.
*/


/*
    < 6. 중첩 객체의 프로퍼티 삭제하기 >

    delete를 사용하면 중첩 객체의 프로퍼티도 삭제할 수 있다.
*/

{
    let person = {
        name: "홍길동",
        address: {
            city: "부산",
            district: "해운대구",
            detail: "센텀로 100"
        }
    };

    delete person.address.detail;

    console.log(person.address);
    console.log(person.address.detail); // undefined
}

/*
    delete person.address.detail;

    address 객체 자체를 삭제하는 것이 아니라
    address 객체의 detail 프로퍼티만 삭제한다.

    address 객체 자체를 삭제하려면

    delete person.address;

    와 같이 작성할 수 있다.
*/


/*
    < 7. 객체 안에 배열 저장하기 >

    객체의 프로퍼티 값으로 배열을 저장할 수도 있다.

    예를 들어 회원이 여러 개의 취미를 가지고 있다면
    hobbies라는 배열로 관리할 수 있다.
*/

{
    let person = {
        name: "홍길동",
        age: 20,
        hobbies: ["독서", "게임", "영화"]
    };

    console.log(person.name);
    console.log(person.hobbies);
    console.log(person.hobbies[0]); // 독서
    console.log(person.hobbies[1]); // 게임
    console.log(person.hobbies[2]); // 영화
}

/*
    person.hobbies는 배열이다.

    따라서 배열에서 배운 인덱스를 이용하여
    각 요소에 접근할 수 있다.

    person.hobbies[0]
    person.hobbies[1]
    person.hobbies[2]
*/


/*
    < 8. 객체 안의 배열에 요소 추가하기 >

    배열의 push() 메서드를 사용하면
    객체 안에 저장된 배열에도 요소를 추가할 수 있다.
*/

{
    let person = {
        name: "홍길동",
        hobbies: ["독서", "게임"]
    };

    person.hobbies.push("영화");

    console.log(person.hobbies);
    // ["독서", "게임", "영화"]

    person.hobbies[0] = "운동";

    console.log(person.hobbies);
    // ["운동", "게임", "영화"]
}

/*
    person.hobbies.push("영화");

    person 객체의 hobbies 프로퍼티에 저장된 배열에
    "영화"라는 요소를 추가한다.

    객체 안에 배열이 있더라도 배열의 사용 방법은 동일하다.
*/


/*
    < 9. 객체 안에 여러 종류의 데이터를 저장하기 >

    실제 객체는 문자열이나 숫자뿐만 아니라
    배열, 다른 객체 등 다양한 값을 가질 수 있다.
*/

{
    let student = {
        name: "홍길동",
        age: 20,
        active: true,
        subjects: ["JavaScript", "HTML", "CSS"],
        address: {
            city: "부산",
            district: "수영구"
        }
    };

    console.log(student.name);
    console.log(student.active);
    console.log(student.subjects[0]);
    console.log(student.address.city);
}

/*
    student 객체의 구조

    student
        ├── name       : 문자열
        ├── age        : 숫자
        ├── active     : 불리언
        ├── subjects   : 배열
        │       ├── 0  : JavaScript
        │       ├── 1  : HTML
        │       └── 2  : CSS
        └── address    : 객체
                ├── city
                └── district

    하나의 객체 안에 여러 종류의 데이터를
    관련된 정보끼리 묶어서 관리할 수 있다.
*/


/*
    < 10. 배열 안에 객체 저장하기 >

    이번에는 반대로 배열 안에 객체를 저장해 보자.

    여러 학생의 정보를 관리한다고 가정한다.
*/

{
    let students = [
        { name: "홍길동", score: 90 },
        { name: "김철수", score: 80 },
        { name: "이영희", score: 95 }
    ];

    console.log(students);
    console.log(students[0]);
    console.log(students[1]);
    console.log(students[2]);
}

/*
    students는 배열이다.

    각 배열 요소에는 학생 정보가 담긴 객체가 저장되어 있다.

    students[0] -> 첫 번째 학생 객체
    students[1] -> 두 번째 학생 객체
    students[2] -> 세 번째 학생 객체
*/


/*
    < 11. 배열 안의 객체 프로퍼티에 접근하기 >

    배열의 인덱스로 객체를 가져온 다음
    점 표기법으로 객체의 프로퍼티에 접근한다.
*/

{
    let students = [
        { name: "홍길동", score: 90 },
        { name: "김철수", score: 80 },
        { name: "이영희", score: 95 }
    ];

    console.log(students[0].name);  // 홍길동
    console.log(students[0].score); // 90

    console.log(students[1].name);  // 김철수
    console.log(students[1].score); // 80

    console.log(students[2].name);  // 이영희
    console.log(students[2].score); // 95
}

/*
    students[0].name의 접근 순서

    1. students 배열에 접근한다.
    2. 인덱스 0에 해당하는 객체를 가져온다.
    3. 해당 객체의 name 프로퍼티에 접근한다.

    배열 안의 객체를 다룰 때 자주 사용하는 형태이다.
*/


/*
    < 12. 배열 안의 객체 프로퍼티 수정하기 >

    배열에서 특정 객체를 선택한 다음
    해당 객체의 프로퍼티 값을 수정할 수 있다.
*/

{
    let students = [
        { name: "홍길동", score: 90 },
        { name: "김철수", score: 80 },
        { name: "이영희", score: 95 }
    ];

    students[1].score = 85;

    console.log(students[1]);
    // { name: "김철수", score: 85 }
}

/*
    students[1].score = 85;

    두 번째 학생 객체의 score 값을 85로 변경한다.

    배열 전체를 다시 만들 필요 없이
    해당 객체의 프로퍼티만 수정할 수 있다.
*/


/*
    < 13. 배열 안의 객체에 프로퍼티 추가 및 삭제하기 >
*/

{
    let students = [
        { name: "홍길동", score: 90 },
        { name: "김철수", score: 80 }
    ];

    // 프로퍼티 추가
    students[0].grade = "A";

    console.log(students[0]);

    // 프로퍼티 삭제
    delete students[1].score;

    console.log(students[1]);
}

/*
    배열 안에 저장된 객체도 일반 객체이다.

    따라서 프로퍼티 추가, 수정, 삭제 방법이 동일하다.
*/


/*
    < 14. for문으로 객체 배열 순회하기 >

    학생이 100명이라면 학생마다 직접 출력 코드를 작성하기 어렵다.

    반복문을 사용하면 배열의 모든 객체를 차례대로 처리할 수 있다.
*/

{
    let students = [
        { name: "홍길동", score: 90 },
        { name: "김철수", score: 80 },
        { name: "이영희", score: 95 }
    ];

    for (let i = 0; i < students.length; i++) {
        console.log(students[i].name);
        console.log(students[i].score);
    }
}

/*
    students.length는 배열의 요소 개수를 반환한다.

    반복문에서 i는 0부터 시작한다.

    students[i].name
    students[i].score

    i가 0이면 첫 번째 학생,
    i가 1이면 두 번째 학생,
    i가 2이면 세 번째 학생의 정보에 접근한다.

    배열의 길이가 변경되어도 반복문이 자동으로 처리한다.
*/


/*
    < 15. for문으로 조건에 맞는 객체 찾기 >

    배열 안의 객체를 반복해서 확인하면서
    특정 조건을 만족하는 데이터를 찾을 수 있다.
*/

{
    let students = [
        { name: "홍길동", score: 90 },
        { name: "김철수", score: 80 },
        { name: "이영희", score: 95 },
        { name: "박민수", score: 65 }
    ];

    for (let i = 0; i < students.length; i++) {
        if (students[i].score >= 90) {
            console.log(students[i].name);
        }
    }
}

/*
    실행 결과

    홍길동
    이영희

    students[i].score가 90 이상인 객체만 출력한다.

    객체 배열과 반복문을 결합하면
    실제 데이터 목록을 조건에 따라 처리할 수 있다.
*/


/*
    < 16. for...of로 객체 배열 순회하기 >

    for...of는 배열의 요소를 하나씩 꺼내는 반복문이다.

    배열의 인덱스가 필요하지 않을 때 유용하다.
*/

{
    let students = [
        { name: "홍길동", score: 90 },
        { name: "김철수", score: 80 },
        { name: "이영희", score: 95 }
    ];

    for (let student of students) {
        console.log(student.name);
        console.log(student.score);
    }
}

/*
    for...of의 student 변수에는
    배열의 각 요소인 학생 객체가 차례대로 저장된다.

    for문:
    students[i].name

    for...of:
    student.name

    인덱스를 직접 관리할 필요가 없다는 차이가 있다.
*/


/*
    < 17. 객체 안의 배열을 반복문으로 처리하기 >

    한 학생이 여러 과목을 수강한다고 가정한다.
*/

{
    let student = {
        name: "홍길동",
        subjects: ["JavaScript", "HTML", "CSS"]
    };

    console.log("학생 : " + student.name);

    for (let i = 0; i < student.subjects.length; i++) {
        console.log(student.subjects[i]);
    }
}

/*
    student.subjects는 배열이므로
    일반적인 배열 반복문을 사용할 수 있다.

    객체 안에 배열이 있더라도 배열 처리 방법은 달라지지 않는다.
*/


/*
    < 18. 중첩 객체와 배열이 함께 있는 구조 >

    실제 데이터는 객체, 배열, 중첩 객체가
    여러 단계로 섞여 있는 경우가 많다.
*/

{
    let school = {
        name: "개발자 교육센터",
        location: {
            city: "부산",
            district: "부산진구"
        },
        students: [
            { name: "홍길동", score: 90 },
            { name: "김철수", score: 80 },
            { name: "이영희", score: 95 }
        ]
    };

    console.log(school.name);
    console.log(school.location.city);

    console.log(school.students[0].name);
    console.log(school.students[0].score);

    console.log(school.students[1].name);
    console.log(school.students[1].score);
}

/*
    school
        ├── name
        ├── location
        │       ├── city
        │       └── district
        └── students
                ├── 0 -> 학생 객체
                ├── 1 -> 학생 객체
                └── 2 -> 학생 객체

    school.students[0].name

    객체 -> 배열 -> 객체 -> 프로퍼티

    여러 단계로 접근하더라도
    각 단계의 자료형을 이해하면 어렵지 않다.
*/


/*
    < 19. 중첩 데이터 반복 처리하기 >

    위 학교 데이터에서 모든 학생의 이름과 점수를 출력해 보자.
*/

{
    let school = {
        name: "개발자 교육센터",
        location: {
            city: "부산",
            district: "부산진구"
        },
        students: [
            { name: "홍길동", score: 90 },
            { name: "김철수", score: 80 },
            { name: "이영희", score: 95 }
        ]
    };

    console.log("학교명 : " + school.name);
    console.log("지역 : " + school.location.city);

    for (let student of school.students) {
        console.log(student.name + " : " + student.score + "점");
    }
}

/*
    school.students는 학생 객체가 들어 있는 배열이다.

    for...of를 사용하면 학생 객체를 하나씩 꺼낼 수 있다.

    꺼낸 student는 객체이므로
    student.name과 student.score로 접근한다.
*/


/*
    < 20. 실생활 예제 : 쇼핑몰 상품 목록 >

    쇼핑몰에서는 여러 상품의 정보를 배열로 관리할 수 있다.

    각 상품은 이름, 가격, 재고, 카테고리 정보를 가진다.
*/

{
    let products = [

            category: "주변기기"
        },
        {
            name: "마우스",

        },
        {

        }
    ];

        );

/*
    products는 배열이다.
    배열의 각 요소는 상품 객체이다.

    상품이 추가되면 배열에 객체를 추가하면 되고,
    반복문을 사용하면 모든 상품을 처리할 수 있다.
*/


/*
    < 21. 실생활 예제 : 상품 검색 >

    상품 목록에서 특정 상품을 검색해 보자.
*/

{
    let products = [
        { name: "키보드", price: 30000, stock: 10 },
        { name: "마우스", price: 15000, stock: 20 },
        { name: "모니터", price: 200000, stock: 5 }
    ];

    let searchName = "마우스";

    for (let product of products) {
        if (product.name === searchName) {
            console.log("검색한 상품 : " + product.name);
            console.log("가격 : " + product.price + "원");
            console.log("재고 : " + product.stock + "개");
        }
    }
}

/*
    배열 안의 객체를 반복해서 확인하고,
    객체의 프로퍼티 값을 조건문으로 비교한다.

    이러한 구조는 실제 상품 목록 검색과 같은 기능의
    기본 원리가 된다.
*/


/*
    < 22. 실생활 예제 : 주문 데이터 >

    주문에는 주문자 정보와 여러 상품 정보가 포함될 수 있다.
*/

{
    let order = {
        orderNo: "ORD-001",
        customer: {
            name: "홍길동",
            phone: "010-1234-5678"
        },
        items: [
            { name: "키보드", price: 30000, quantity: 1 },
            { name: "마우스", price: 15000, quantity: 2 }
        ]
    };

    console.log("주문번호 : " + order.orderNo);
    console.log("주문자 : " + order.customer.name);
    console.log("연락처 : " + order.customer.phone);

    for (let item of order.items) {
        console.log(
            item.name + " / " +
            item.price + "원 / " +
            item.quantity + "개"
        );
    }
}

/*
    주문 데이터의 구조

    order
        ├── orderNo
        ├── customer
        │       ├── name
        │       └── phone
        └── items
                ├── 0 -> 상품 객체
                └── 1 -> 상품 객체

    주문자 정보는 customer 객체에,
    주문 상품 목록은 items 배열에 저장한다.

    데이터의 성격에 따라 객체와 배열을 조합하면
    복잡한 정보도 구조적으로 관리할 수 있다.
*/


/*
    < 23. 중첩 데이터에서 자주 하는 실수 >

    1. 배열 인덱스와 객체 프로퍼티 접근을 혼동한다.

    students[0].name

    students[0] : 배열에서 첫 번째 객체를 가져온다.
    .name       : 해당 객체의 name 프로퍼티에 접근한다.


    2. 존재하지 않는 프로퍼티에 접근한다.

    person.address.city

    address가 존재하지 않는다면
    person.address는 undefined가 된다.

    그 상태에서 .city에 접근하면 오류가 발생한다.


    3. 배열의 인덱스 범위를 벗어난다.

    students[100]

    해당 위치에 요소가 없다면 undefined가 반환된다.


    4. 중첩 객체와 배열의 위치를 혼동한다.

    student.address.city
    student.subjects[0]
    school.students[0].name

    각 단계에 어떤 자료형이 들어 있는지 확인하면서
    접근 경로를 따라가야 한다.
*/

*/
