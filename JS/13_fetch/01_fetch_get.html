<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01. HTTP와 fetch (GET)</title>
    <script src="01_fetch_get.js" defer></script>
    <style>
        section { border: 1px solid #ccc; padding: 10px 14px; margin-bottom: 10px; }
        h2 { font-size: 16px; margin: 0 0 8px; }
        .loading { color: gray; }
        .error { color: crimson; font-weight: bold; }
        .result { color: royalblue; }
        pre { background-color: #f5f5f5; padding: 8px; max-height: 200px; overflow: auto; }
        .product { display: inline-block; width: 150px; margin: 4px; padding: 6px; border: 1px solid #ddd; vertical-align: top; font-size: 13px; }
        .product img { width: 100%; height: 90px; object-fit: cover; }
    </style>
</head>
<body>
    <h1>01. HTTP와 fetch (GET)</h1>
    <p>인터넷 연결이 필요합니다. F12 → Network 탭과 Console 탭을 함께 확인하세요.</p>

    <section>
        <h2>4. fetch 기본 - 게시글 1개</h2>
        <button type="button" id="basicBtn">1번 게시글 가져오기</button>
        <pre id="basicResult">버튼을 클릭하세요.</pre>
    </section>

    <section>
        <h2>5. 목록 + 로딩 / 에러 상태</h2>
        <button type="button" id="listBtn">게시글 10개 가져오기</button>
        <div id="listBox"></div>
    </section>

    <section>
        <h2>6 ~ 7. 실패 상황</h2>
        <button type="button" id="notFoundBtn">999번 게시글 (404)</button>
        <button type="button" id="networkBtn">잘못된 주소 (네트워크 오류)</button>
        <p id="failResult"></p>
    </section>

    <section>
        <h2>9. 쿼리 스트링 - 회원별 게시글</h2>
        <select id="userSelect">
            <option value="">회원 목록 불러오는 중...</option>
        </select>
        <ul id="userPosts"></ul>
    </section>

    <section>
        <h2>10. 검색 + 페이지 - 상품 (DummyJSON)</h2>
        <form id="searchForm">
            <input type="text" id="keyword" placeholder="예: phone, laptop" value="phone">
            <button type="submit">검색</button>
        </form>
        <p id="searchInfo"></p>
        <div id="productList"></div>
        <button type="button" id="prevBtn" disabled>◀ 이전</button>
        <button type="button" id="nextBtn" disabled>다음 ▶</button>
    </section>
</body>
</html>
