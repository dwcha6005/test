<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02. 할 일 관리 (fetch CRUD 미션)</title>
    <script src="02_fetch_crud_test.js" defer></script>
    <style>
        body { max-width: 640px; }
        .loading { color: gray; }
        .error { color: crimson; font-weight: bold; }
        #todoList { list-style: none; padding: 0; }
        #todoList li { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid #eee; }
        #todoList li span { flex: 1; }
        #todoList li.done span { color: #999; text-decoration: line-through; }
        #todoList li.saving { opacity: 0.5; }
    </style>
</head>
<body>
    <h1>할 일 관리</h1>
    <p>
        회원 :
        <select id="userSelect">
            <option value="1">1번 회원</option>
            <option value="2">2번 회원</option>
            <option value="3">3번 회원</option>
        </select>
        <span id="summary"></span>
    </p>

    <form id="todoForm">
        <input type="text" id="todoInput" placeholder="할 일 입력" size="40">
        <button type="submit" id="addBtn">추가</button>
        <span id="formMsg" class="error"></span>
    </form>

    <p id="status"></p>
    <ul id="todoList"></ul>
    <p><button type="button" id="clearDoneBtn">완료한 일 모두 삭제</button></p>
</body>
</html>
