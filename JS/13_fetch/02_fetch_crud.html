<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02. fetch로 등록 · 수정 · 삭제</title>
    <script src="02_fetch_crud.js" defer></script>
    <style>
        section { border: 1px solid #ccc; padding: 10px 14px; margin-bottom: 10px; }
        h2 { font-size: 16px; margin: 0 0 8px; }
        .loading { color: gray; }
        .error { color: crimson; font-weight: bold; }
        .result { color: royalblue; }
        pre { background-color: #f5f5f5; padding: 8px; max-height: 180px; overflow: auto; }
        #boardForm input, #boardForm textarea { width: 100%; box-sizing: border-box; margin-bottom: 4px; }
        .post { border: 1px solid #ddd; padding: 8px; margin-bottom: 6px; }
        .post h3 { margin: 0 0 4px; font-size: 15px; }
        .post p { margin: 0 0 6px; color: #555; font-size: 14px; }
    </style>
</head>
<body>
    <h1>02. fetch로 등록 · 수정 · 삭제 (POST / PUT / PATCH / DELETE)</h1>
    <p>인터넷 연결이 필요합니다. F12 → Network 탭에서 요청의 Payload와 Response를 확인하세요.</p>

    <section>
        <h2>2. POST - 등록</h2>
        <button type="button" id="postBtn">새 게시글 등록</button>
        <pre id="postResult">버튼을 클릭하세요.</pre>
    </section>

    <section>
        <h2>3. PUT과 PATCH - 수정</h2>
        <button type="button" id="putBtn">PUT (전체 수정)</button>
        <button type="button" id="patchBtn">PATCH (제목만 수정)</button>
        <pre id="updateResult">버튼을 클릭하세요.</pre>
    </section>

    <section>
        <h2>4. DELETE - 삭제</h2>
        <button type="button" id="deleteBtn">1번 게시글 삭제</button>
        <pre id="deleteResult">버튼을 클릭하세요.</pre>
    </section>

    <section>
        <h2>6. 실전 - 게시판 (1번 회원의 글)</h2>
        <form id="boardForm">
            <input type="text" name="title" id="title" placeholder="제목">
            <textarea name="body" id="body" rows="3" placeholder="내용"></textarea>
            <button type="submit" id="submitBtn">등록</button>
            <button type="button" id="cancelBtn" hidden>수정 취소</button>
            <span id="formMsg"></span>
        </form>
        <p id="boardStatus"></p>
        <div id="boardList"></div>
    </section>
</body>
</html>
