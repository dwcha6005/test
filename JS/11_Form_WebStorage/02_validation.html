<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02. 입력값 검증</title>
    <script src="02_validation.js" defer></script>
    <style>
        form p { margin: 8px 0; }
        label.title { display: inline-block; width: 110px; }
        .msg { font-size: 13px; margin-left: 6px; }
        .msg.error { color: red; }
        .msg.ok { color: green; }
        input.error { border: 2px solid red; }
        input.ok { border: 2px solid green; }
    </style>
</head>
<body>
    <h1>02. 입력값 검증 - 회원가입</h1>

    <h2>2. HTML 기본 검증 (JavaScript 없이)</h2>
    <form id="htmlForm">
        <p><input type="text" placeholder="이름 (필수)" required></p>
        <p><input type="text" placeholder="아이디 4~8자" minlength="4" maxlength="8" required></p>
        <p><input type="email" placeholder="이메일 형식" required></p>
        <p><input type="number" placeholder="나이 14~100" min="14" max="100"></p>
        <p><input type="text" placeholder="우편번호 숫자 5자리" pattern="[0-9]{5}"></p>
        <button type="submit">HTML 검증 테스트</button>
    </form>

    <h2>4~7. JavaScript 검증</h2>
    <form id="joinForm" novalidate>
        <p>
            <label class="title" for="userId">아이디</label>
            <input type="text" id="userId" name="userId" placeholder="영문 소문자/숫자 4~12자">
            <span class="msg" id="userIdMsg"></span>
        </p>
        <p>
            <label class="title" for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="영문+숫자 8자 이상">
            <span class="msg" id="passwordMsg"></span>
        </p>
        <p>
            <label class="title" for="password2">비밀번호 확인</label>
            <input type="password" id="password2" name="password2">
            <span class="msg" id="password2Msg"></span>
        </p>
        <p>
            <label class="title" for="email">이메일</label>
            <input type="text" id="email" name="email" placeholder="example@email.com">
            <span class="msg" id="emailMsg"></span>
        </p>
        <p>
            <label class="title" for="phone">휴대폰</label>
            <input type="text" id="phone" name="phone" placeholder="010-1234-5678">
            <span class="msg" id="phoneMsg"></span>
        </p>
        <p>
            <label><input type="checkbox" id="agree" name="agree"> 이용약관에 동의합니다.</label>
            <span class="msg" id="agreeMsg"></span>
        </p>
        <button type="submit">가입하기</button>
    </form>
    <p id="joinResult"></p>
</body>
</html>
