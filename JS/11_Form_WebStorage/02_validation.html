
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1 class="mb-3">회원가입 입력값 검증</h1>
    <p>입력 조건을 확인하고, 조건을 만족한 경우에만 가입 정보를 출력합니다.</p>

    <form id="signupForm" class="border rounded p-3 mb-4">
        <!-- < 1. 필수 입력과 글자 수 제한 > -->
        <div class="mb-3">
            <label for="userName" class="form-label">이름</label>
            <input type="text" id="userName" name="userName" class="form-control"
                   required minlength="2" maxlength="10"
                   placeholder="2~10자 입력">
        </div>

        <!-- < 2. 이메일 형식 검사 > -->
        <div class="mb-3">
            <label for="userEmail" class="form-label">이메일</label>
            <input type="email" id="userEmail" name="userEmail" class="form-control"
                   required placeholder="example@email.com">
        </div>

        <!-- < 3. 숫자 범위 검사 > -->
        <div class="mb-3">
            <label for="userAge" class="form-label">나이</label>
            <input type="number" id="userAge" name="userAge" class="form-control"
                   required min="14" max="100" step="1"
                   placeholder="14~100">
        </div>

        <!-- < 4. 정규식 패턴 검사 > -->
        <div class="mb-3">
            <label for="userId" class="form-label">아이디</label>
            <input type="text" id="userId" name="userId" class="form-control"
                   required minlength="5" maxlength="12"
                   pattern="[a-zA-Z0-9]+"
                   title="영문자와 숫자만 사용해 5~12자로 입력하세요."
                   placeholder="영문자와 숫자 5~12자">
        </div>

        <!-- < 5. 비밀번호 직접 검증 > -->
        <div class="mb-3">
            <label for="userPassword" class="form-label">비밀번호</label>
            <input type="password" id="userPassword" name="userPassword" class="form-control"
                   required minlength="8"
                   placeholder="8자 이상 입력">
            <div class="form-text">8자 이상 입력하세요.</div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">비밀번호 확인</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                   required placeholder="비밀번호를 다시 입력하세요.">
            <div id="passwordMessage" class="form-text">비밀번호와 일치해야 합니다.</div>
        </div>

        <!-- < 6. 약관 동의 > -->
        <div class="mb-3">
            <div class="form-check">
                <input type="checkbox" id="agree" name="agree" class="form-check-input" required>
                <label for="agree" class="form-check-label">이용약관에 동의합니다.</label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">가입하기</button>
        <button type="reset" class="btn btn-secondary">초기화</button>
    </form>

    <!-- < 7. 검증 결과 확인 > -->
    <div class="border rounded p-3 mb-3">
        <h2 class="h5">검증 결과</h2>
        <pre id="validationResult" class="mb-0">폼을 제출하거나 입력값을 변경해 보세요.</pre>
    </div>

    <div class="border rounded p-3">
        <h2 class="h5">가입 결과</h2>
        <pre id="signupResult" class="mb-0">아직 가입 정보가 없습니다.</pre>
    </div>

    <script>
        // < 8. 요소 선택 >
        const signupForm = document.querySelector("#signupForm");
        const userName = document.querySelector("#userName");
        const userEmail = document.querySelector("#userEmail");
        const userAge = document.querySelector("#userAge");
        const userId = document.querySelector("#userId");
        const userPassword = document.querySelector("#userPassword");
        const confirmPassword = document.querySelector("#confirmPassword");
        const passwordMessage = document.querySelector("#passwordMessage");
        const validationResult = document.querySelector("#validationResult");
        const signupResult = document.querySelector("#signupResult");

        // < 9. 비밀번호 일치 여부 검사 >
        function checkPassword() {
            if (confirmPassword.value === "") {
                confirmPassword.setCustomValidity("");
                passwordMessage.textContent = "비밀번호와 일치해야 합니다.";
                passwordMessage.className = "form-text";
            } else if (userPassword.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity("비밀번호가 일치하지 않습니다.");
                passwordMessage.textContent = "비밀번호가 일치하지 않습니다.";
                passwordMessage.className = "form-text text-danger";
            } else {
                confirmPassword.setCustomValidity("");
                passwordMessage.textContent = "비밀번호가 일치합니다.";
                passwordMessage.className = "form-text text-success";
            }
        }

        userPassword.addEventListener("input", checkPassword);
        confirmPassword.addEventListener("input", checkPassword);

        // < 10. 입력 중 검증 상태 확인 >
        signupForm.addEventListener("input", function () {
            checkPassword();

            const invalidInput = signupForm.querySelector(":invalid");

            if (invalidInput) {
                validationResult.textContent =
                    `검증 실패\n` +
                    `문제 요소: ${invalidInput.name}\n` +
                    `검증 메시지: ${invalidInput.validationMessage}`;
            } else {
                validationResult.textContent = "모든 입력 항목이 현재 검증 조건을 만족합니다.";
            }
        });

        // < 11. 폼 제출 전 최종 검증 >
        signupForm.addEventListener("submit", function (event) {
            event.preventDefault();
            checkPassword();    // 자바스크립트로 강제 데이터 변경했을때를 대비

            if (!signupForm.checkValidity()) {
                signupForm.reportValidity();

                const invalidInput = signupForm.querySelector(":invalid");

                validationResult.textContent =
                    `검증 실패\n` +
                    `문제 요소: ${invalidInput ? invalidInput.name : "확인 필요"}\n` +
                    `검증 메시지: ${invalidInput ? invalidInput.validationMessage : "입력값을 확인하세요."}`;

                signupResult.textContent = "입력값을 수정한 후 다시 제출하세요.";
                return;
            }

            validationResult.textContent = "검증 성공! 모든 입력 조건을 만족합니다.";

            // 비밀번호는 결과 화면에 출력하지 않음
            signupResult.textContent =
                `이름: ${userName.value}\n` +
                `이메일: ${userEmail.value}\n` +
                `나이: ${userAge.value}\n` +
                `아이디: ${userId.value}\n` +
                `이용약관 동의: ${document.querySelector("#agree").checked ? "동의" : "미동의"}`;
        });

        // < 12. 초기화 후 안내 문구 복원 >
        signupForm.addEventListener("reset", function () {
            setTimeout(function () {
                confirmPassword.setCustomValidity("");
                passwordMessage.textContent = "비밀번호와 일치해야 합니다.";
                passwordMessage.className = "form-text";
                validationResult.textContent = "폼을 제출하거나 입력값을 변경해 보세요.";
                signupResult.textContent = "아직 가입 정보가 없습니다.";
            }, 0);
        });
    </script>
</body>
</html>
