
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Basic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1 class="mb-3">고객 문의 등록</h1>
    <p>폼에 정보를 입력하고 제출하면 입력한 내용을 아래에 출력합니다.</p>

    <form id="inquiryForm" class="border rounded p-3 mb-4">
        <!-- < 1. 텍스트 입력 > -->
        <div class="mb-3">
            <label for="customerName" class="form-label">고객명</label>
            <input type="text" id="customerName" name="customerName" class="form-control" placeholder="이름을 입력하세요">
        </div>

        <!-- < 2. 이메일 입력 > -->
        <div class="mb-3">
            <label for="customerEmail" class="form-label">이메일</label>
            <input type="email" id="customerEmail" name="customerEmail" class="form-control" placeholder="example@email.com">
        </div>

        <!-- < 3. 선택 목록 > -->
        <div class="mb-3">
            <label for="inquiryType" class="form-label">문의 유형</label>
            <select id="inquiryType" name="inquiryType" class="form-select">
                <option value="">문의 유형을 선택하세요</option>
                <option value="배송">배송</option>
                <option value="교환/환불">교환/환불</option>
                <option value="상품">상품</option>
                <option value="기타">기타</option>
            </select>
        </div>

        <!-- < 4. 라디오 버튼 > -->
        <div class="mb-3">
            <p class="form-label mb-2">답변 방법</p>
            <div class="form-check">
                <input type="radio" id="replyEmail" name="replyMethod" value="이메일" class="form-check-input" checked>
                <label for="replyEmail" class="form-check-label">이메일</label>
            </div>
            <div class="form-check">
                <input type="radio" id="replyPhone" name="replyMethod" value="전화" class="form-check-input">
                <label for="replyPhone" class="form-check-label">전화</label>
            </div>
        </div>

        <!-- < 5. 체크박스 > -->
        <div class="mb-3">
            <p class="form-label mb-2">관심 서비스</p>
            <div class="form-check">
                <input type="checkbox" id="serviceDelivery" name="services" value="빠른 배송" class="form-check-input">
                <label for="serviceDelivery" class="form-check-label">빠른 배송</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="serviceCoupon" name="services" value="할인 쿠폰" class="form-check-input">
                <label for="serviceCoupon" class="form-check-label">할인 쿠폰</label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="serviceEvent" name="services" value="이벤트 안내" class="form-check-input">
                <label for="serviceEvent" class="form-check-label">이벤트 안내</label>
            </div>
        </div>

        <!-- < 6. 여러 줄 입력 > -->
        <div class="mb-3">
            <label for="inquiryContent" class="form-label">문의 내용</label>
            <textarea id="inquiryContent" name="inquiryContent" class="form-control" rows="4" placeholder="문의 내용을 입력하세요"></textarea>
        </div>

        <!-- < 7. 제출 및 초기화 > -->
        <button type="submit" class="btn btn-primary">문의 등록</button>
        <button type="reset" class="btn btn-secondary">초기화</button>
    </form>

    <!-- < 8. 제출 결과 > -->
    <div class="border rounded p-3">
        <h2 class="h5">등록 결과</h2>
        <pre id="result" class="mb-0">아직 등록된 문의가 없습니다.</pre>
    </div>

    <script>
        // < 9. 폼 요소 선택 >
        const inquiryForm = document.querySelector("#inquiryForm");
        const result = document.querySelector("#result");

        // < 10. submit 이벤트 처리 >
        inquiryForm.addEventListener("submit", function (event) {
            // 폼의 기본 제출 동작 방지
            event.preventDefault();

            // < 10-1. 일반 입력값 읽기 >
            const customerName = document.querySelector("#customerName").value;
            const customerEmail = document.querySelector("#customerEmail").value;
            const inquiryType = document.querySelector("#inquiryType").value;
            const inquiryContent = document.querySelector("#inquiryContent").value;

            // < 10-2. 선택된 라디오 버튼 읽기 >
            const replyMethod = document.querySelector('input[name="replyMethod"]:checked').value;

            // < 10-3. 체크된 체크박스 읽기 >
            const checkedServices = document.querySelectorAll('input[name="services"]:checked');
            const services = [];

            checkedServices.forEach(function (checkbox) {
                services.push(checkbox.value);
            });

            // < 10-4. 결과 출력 >
            result.textContent =
                `고객명: ${customerName}\n` +
                `이메일: ${customerEmail}\n` +
                `문의 유형: ${inquiryType || "선택하지 않음"}\n` +
                `답변 방법: ${replyMethod}\n` +
                `관심 서비스: ${services.length > 0 ? services.join(", ") : "선택하지 않음"}\n` +
                `문의 내용: ${inquiryContent}`;
        });
    </script>
</body>
</html>
