<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01. 폼 값 다루기 실습</title>
    <script src="01_basic_test.js" defer></script>
    <style>
        form p { margin: 8px 0; }
        .title { display: inline-block; width: 90px; }
        .answer { color: royalblue; font-weight: bold; margin-left: 6px; }
        #summary, #result { background-color: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>호텔 예약</h1>

    <form id="bookForm" name="bookForm">
        <p>
            <span class="title">예약자</span>
            <input type="text" name="guestName" id="guestName">
            <button type="button" id="nameBtn">이름 확인</button>
            <span class="answer" id="nameResult"></span>
        </p>
        <p>
            <span class="title">객실</span>
            <select name="roomType" id="roomType">
                <option value="standard">스탠다드 (80,000원)</option>
                <option value="deluxe">디럭스 (120,000원)</option>
                <option value="suite">스위트 (200,000원)</option>
            </select>
            <span class="answer" id="roomResult"></span>
        </p>
        <p>
            <span class="title">인원</span>
            <label><input type="radio" name="people" value="1"> 1명</label>
            <label><input type="radio" name="people" value="2" checked> 2명</label>
            <label><input type="radio" name="people" value="3"> 3명</label>
            <label><input type="radio" name="people" value="4"> 4명</label>
        </p>
        <p>
            <span class="title">조식</span>
            <label><input type="radio" name="breakfast" value="포함"> 포함</label>
            <label><input type="radio" name="breakfast" value="미포함" checked> 미포함</label>
            <button type="button" id="radioBtn">선택 확인</button>
        </p>
        <p>
            <span class="title">추가 옵션</span>
            <label><input type="checkbox" name="options" value="parking" data-label="주차" data-price="10000"> 주차 (+10,000)</label>
            <label><input type="checkbox" name="options" value="late" data-label="레이트 체크아웃" data-price="20000"> 레이트 체크아웃 (+20,000)</label>
            <label><input type="checkbox" name="options" value="spa" data-label="스파" data-price="30000"> 스파 (+30,000)</label>
            <br><span class="answer" id="optionResult"></span>
        </p>
        <p>
            <span class="title">체크인</span> <input type="date" name="checkIn" id="checkIn">
            <span class="title" style="width:auto">체크아웃</span> <input type="date" name="checkOut" id="checkOut">
            <span class="answer" id="nightResult"></span>
        </p>
        <p>
            <span class="title">요청사항</span><br>
            <textarea name="request" id="request" rows="3" cols="50"></textarea>
        </p>
        <p>
            <label><input type="checkbox" name="agree" id="agree"> 예약 규정에 동의합니다.</label>
        </p>

        <button type="submit" id="submitBtn" disabled>예약하기</button>
        <button type="reset">초기화</button>
        <button type="button" id="loadBtn">지난 예약 불러오기</button>
    </form>

    <h2>예약 요약 (실시간)</h2>
    <pre id="summary"></pre>

    <h2>예약 결과</h2>
    <pre id="result">아직 예약하지 않았습니다.</pre>
</body>
</html>
