<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학원 홈페이지</title>
    <script src="01_basic_test.js" defer></script>
    <style>
        section {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        h2 {
            font-size: 16px;
            margin-top: 0;
        }
        .result {
            color: royalblue;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>DOM 기초 실습 - 학원 홈페이지</h1>
    <p>결과는 개발자 도구(F12)의 Console 탭과 화면에서 확인합니다.</p>

    <!-- 문제 1 ~ 3 : 콘솔에서 확인 -->

    <!-- 문제 4 -->
    <section>
        <h2>문제 4</h2>
        <h3 id="academyName">코딩 아카데미</h3>
    </section>

    <!-- 문제 5 -->
    <section>
        <h2>문제 5</h2>
        <p id="notice">오늘은 정상 수업입니다.</p>
    </section>

    <!-- 문제 6 : 콘솔에서 확인 -->

    <!-- 문제 7 -->
    <section>
        <h2>문제 7</h2>
        <button type="button" onclick="changePageTitle()">브라우저 탭 제목 변경</button>
        <p id="titleResult" class="result">버튼을 클릭하세요.</p>
    </section>

    <!-- 문제 8 -->
    <section>
        <h2>문제 8</h2>
        <button type="button" onclick="applyCourse()">수강 신청</button>
        <p id="applyResult" class="result">수강 신청 버튼을 클릭하세요.</p>
    </section>

    <!-- 문제 9 -->
    <section>
        <h2>문제 9</h2>
        <button type="button" onclick="startTimer()">3초 타이머 시작</button>
        <p id="timerResult" class="result">버튼을 클릭하세요.</p>
    </section>

    <!-- 문제 10 -->
    <section>
        <h2>문제 10</h2>
        <div id="courseBox">
            <h3>개설 과정</h3>
            <ul>
                <li>JavaScript</li>
                <li>React</li>
            </ul>
            <p>수강료 문의</p>
        </div>
    </section>
</body>
</html>
