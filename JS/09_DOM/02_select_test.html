<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 요소 선택 실습</title>
    <script src="02_select_test.js" defer></script>
    <style>
        section {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .soldout {
            color: #999;
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <header id="header">
        <h1 id="shopName">DOM 마켓</h1>
        <p>결과는 개발자 도구(F12)의 Console 탭에서 확인합니다.</p>
    </header>

    <section id="best">
        <h2>베스트 상품</h2>
        <ul id="bestList">
            <li class="product">무선 이어폰</li>
            <li class="product soldout">기계식 키보드</li>
            <li class="product">게이밍 마우스</li>
            <li class="product">모니터 받침대</li>
        </ul>
    </section>

    <section id="new">
        <h2>신상품</h2>
        <ul id="newList">
            <li class="product">USB 허브</li>
            <li class="product soldout">노트북 파우치</li>
            <li class="product">웹캠</li>
        </ul>
    </section>

    <section id="noticeArea">
        <h2>공지사항</h2>
        <p class="notice">배송 안내: 오후 3시 이전 주문은 당일 출고됩니다.</p>
        <p class="notice">교환 안내: 수령 후 7일 이내에 신청하세요.</p>
        <p class="notice">이벤트 안내: 신규 회원 10% 할인 쿠폰 지급</p>
    </section>
</body>
</html>
