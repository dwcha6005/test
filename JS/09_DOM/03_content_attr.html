<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="03_content_attr.js" defer></script>
    <title>Document</title>
</head>
<body>

    <h1 id="title">DOM 내용과 속성 변경</h1>

    <section id="profile">
        <h2>회원 정보</h2>
        <p id="name">이름: 홍길동</p>
        <p id="intro">웹 개발을 공부하고 있습니다.</p>
    </section>

    <section id="inputArea">
        <label for="username">이름</label>
        <input type="text" id="username" value="홍길동">

        <label for="message">자기소개</label>
        <textarea id="message">안녕하세요.</textarea>

        <select id="job">
            <option value="student">학생</option>
            <option value="developer">개발자</option>
            <option value="designer">디자이너</option>
        </select>
    </section>

    <section id="product">
        <h2>상품 정보</h2>
        <img id="productImage"
             src="https://picsum.photos/200/120"
             alt="상품 이미지">
        <a id="productLink"
           href="https://example.com"
           target="_blank">상품 상세 보기</a>
    </section>

</body>
</html>
