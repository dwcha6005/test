<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 탐색</title>
    <script src="06_traversal.js" defer></script>
    <style>
        section {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .sale {
            color: crimson;
        }
        .selected {
            background-color: #dbeafe;
        }
        .faq-answer {
            display: none;
            padding: 8px;
            background-color: #f5f5f5;
        }
        .faq-answer.open {
            display: block;
        }
        #rowResult {
            color: royalblue;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1 id="title">DOM 탐색 (Traversal)</h1>

    <!-- < 1~12. 노드 관계 확인용 구조 > -->
    <section id="shop">
        <h2 id="shopTitle">상품 목록</h2>
        <!-- 상품 목록 주석입니다. -->
        <ul id="productList">
            <li class="product" id="item1">
                <span class="name">노트북</span>
                <span class="price">1200000</span>
            </li>
            <li class="product sale" id="item2">
                <span class="name">마우스</span>
                <span class="price">25000</span>
            </li>
            <li class="product" id="item3">
                <span class="name">키보드</span>
                <span class="price">89000</span>
            </li>
        </ul>
        <p id="shopFooter">총 3개 상품</p>
    </section>

    <!-- < 13. 버튼에서 같은 행의 정보 읽기 > -->
    <section id="orderArea">
        <h2>주문 목록</h2>
        <table border="1" cellpadding="6">
            <thead>
                <tr>
                    <th>주문번호</th>
                    <th>고객명</th>
                    <th>금액</th>
                    <th>확인</th>
                </tr>
            </thead>
            <tbody id="orderTable">
                <tr>
                    <td>A001</td>
                    <td>홍길동</td>
                    <td>35000</td>
                    <td><button type="button" class="check-btn">확인</button></td>
                </tr>
                <tr>
                    <td>A002</td>
                    <td>김철수</td>
                    <td>12000</td>
                    <td><button type="button" class="check-btn">확인</button></td>
                </tr>
                <tr>
                    <td>A003</td>
                    <td>이영희</td>
                    <td>58000</td>
                    <td><button type="button" class="check-btn">확인</button></td>
                </tr>
            </tbody>
        </table>
        <p id="rowResult">확인 버튼을 클릭하세요.</p>
    </section>

    <!-- < 14. 형제 요소로 FAQ 열고 닫기 > -->
    <section id="faq">
        <h2>자주 묻는 질문</h2>
        <div class="faq-item">
            <button type="button" class="faq-question">배송은 얼마나 걸리나요?</button>
            <p class="faq-answer">주문 후 2~3일 이내에 도착합니다.</p>
        </div>
        <div class="faq-item">
            <button type="button" class="faq-question">교환은 가능한가요?</button>
            <p class="faq-answer">수령 후 7일 이내에 교환 신청이 가능합니다.</p>
        </div>
        <div class="faq-item">
            <button type="button" class="faq-question">회원가입 없이 주문할 수 있나요?</button>
            <p class="faq-answer">비회원 주문도 가능합니다.</p>
        </div>
    </section>

</body>
</html>
