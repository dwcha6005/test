<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01. 폼 값 다루기</title>
    <script src="01_basic.js" defer></script>
    <style>
        form p { margin: 8px 0; }
        label.title { display: inline-block; width: 90px; }
        #result { background-color: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>01. 폼 값 다루기 - 고객 문의</h1>

    <form id="inquiryForm" name="inquiryForm">
        <!-- 2. 텍스트 입력 -->
        <p>
            <label class="title" for="customerName">이름</label>
            <input type="text" id="customerName" name="customerName" value="홍길동">
        </p>
        <p>
            <label class="title" for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="example@email.com">
        </p>

        <!-- 3. select -->
        <p>
            <label class="title" for="inquiryType">문의 유형</label>
            <select id="inquiryType" name="inquiryType">
                <option value="">선택하세요</option>
                <option value="delivery">배송</option>
                <option value="refund">교환/환불</option>
                <option value="etc">기타</option>
            </select>
        </p>

        <!-- 4. radio -->
        <p>
            <span class="title" style="display:inline-block;width:90px">답변 방법</span>
            <label><input type="radio" name="replyMethod" value="email" checked> 이메일</label>
            <label><input type="radio" name="replyMethod" value="sms"> 문자</label>
            <label><input type="radio" name="replyMethod" value="phone"> 전화</label>
        </p>

        <!-- 5. checkbox (여러 개) -->
        <p>
            <span class="title" style="display:inline-block;width:90px">관심 서비스</span>
            <label><input type="checkbox" name="services" value="coupon"> 할인 쿠폰</label>
            <label><input type="checkbox" name="services" value="event"> 이벤트</label>
            <label><input type="checkbox" name="services" value="news"> 신상품 소식</label>
        </p>

        <!-- 5. checkbox (하나) -->
        <p>
            <label><input type="checkbox" id="agree" name="agree"> 개인정보 수집에 동의합니다.</label>
        </p>

        <!-- 2. textarea -->
        <p>
            <label class="title" for="content">문의 내용</label><br>
            <textarea id="content" name="content" rows="4" cols="50"></textarea>
        </p>

        <button type="submit">문의 등록</button>
        <button type="reset">초기화</button>
        <button type="button" id="fillBtn">예시 값 채우기</button>
    </form>

    <h2>등록 결과</h2>
    <pre id="result">아직 등록된 문의가 없습니다.</pre>
</body>
</html>
