<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    /*
    < 콜백 기반 배열 메서드 응용 문제 >

    < 1. 짝수만 추출하기 >
    숫자 배열에서 짝수만 추출하여 새로운 배열을 만드시오.
    추출한 배열과 짝수의 개수를 출력하시오.

    실행 결과
    짝수 : [12, 8, 20, 6]
    개수 : 4개

    조건 : filter() 사용
    */
    let numbers = [12, 7, 8, 15, 20, 3, 6, 11];


    /*
    < 2. 모든 점수에 보너스 점수 추가하기 >
    점수 배열의 모든 점수에 5점을 더한 새로운 배열을 만드시오.
    단, 원본 배열은 변경하지 마시오.

    실행 결과
    원본 : [70, 85, 60, 95, 75]
    결과 : [75, 90, 65, 100, 80]

    조건 : map() 사용
    */

    let scores = [70, 85, 60, 95, 75];


    /*
    < 3. 합격자 점수 출력하기 >
    점수 배열에서 80점 이상인 점수만 추출하시오.
    추출한 점수를 하나씩 출력하고, 합격자 수를 출력하시오.

    실행 결과
    합격 점수 : 85
    합격 점수 : 92
    합격 점수 : 80
    합격자 수 : 3명

    조건 : filter(), forEach() 사용
    */

    let examScores = [65, 85, 72, 92, 58, 80, 77];


    /*
    < 4. 문자열 길이 변환하기 >
    문자열 배열의 각 단어를 글자 수로 변환한 새로운 배열을 만드시오.

    실행 결과
    ["apple", "banana", "kiwi", "watermelon"]
    → [5, 6, 4, 10]

    조건 : map(), length 사용
    */

    let words = ["apple", "banana", "kiwi", "watermelon"];


    /*
    < 5. 특정 숫자 찾기 >
    숫자 배열에서 50보다 큰 첫 번째 숫자를 찾으시오.
    숫자가 존재하면 해당 숫자를 출력하고,
    없으면 "조건에 맞는 숫자가 없습니다."를 출력하시오.

    실행 결과
    찾은 숫자 : 72

    조건 : find() 사용
    */

    let values = [12, 35, 48, 72, 91, 20];


    /*
    < 6. 가격 할인 프로그램 >
    상품 가격 배열의 모든 가격에 20% 할인을 적용한 새로운 배열을 만드시오.
    할인된 가격 중 10000원 이하인 가격만 추출하시오.

    실행 결과
    할인 가격 : [8000, 4000, 9600]

    조건 : map(), filter() 사용
    힌트 : 먼저 모든 가격을 할인한 뒤 조건에 맞는 가격을 추출한다.
    */

    let prices = [10000, 5000, 12000, 20000, 15000];


    /*
    < 7. 특정 단어 검색 >
    문자열 배열에서 글자 수가 5글자 이상인 단어만 추출하시오.
    추출한 단어를 하나씩 출력하시오.

    실행 결과
    banana
    orange
    grape
    watermelon

    조건 : filter(), forEach() 사용
    */

    let fruits = ["kiwi", "banana", "orange", "grape", "fig", "watermelon"];


    /*
    < 8. 배열 데이터 정규화 >
    이름이 저장된 배열의 각 문자열 앞뒤 공백을 제거한 새로운 배열을 만드시오.
    정리된 배열에서 "민수"를 찾아 결과를 출력하시오.

    실행 결과
    정리된 이름 : ["민수", "영희", "철수", "지영"]
    검색 결과 : 민수

    조건 : map(), find() 사용
    힌트 : 문자열의 trim() 메서드를 활용한다.
    */

    let names = [" 민수 ", "영희  ", " 철수", "지영 "];


    /*
    < 9. 재시험 대상 찾기 >
    점수 배열에서 60점 미만인 점수만 추출하시오.
    재시험 대상 점수를 출력하고, 대상이 몇 명인지 출력하시오.
    재시험 대상이 없다면 "재시험 대상이 없습니다."를 출력하시오.

    실행 결과
    재시험 점수 : 45
    재시험 점수 : 55
    재시험 대상 : 2명

    조건 : filter(), forEach() 사용
    */

    let testResults = [80, 45, 90, 55, 70, 65];


    /*
    < 10. 종합 데이터 처리 >
    숫자 배열의 모든 숫자를 2배로 변환하시오.
    변환된 숫자 중 50 이상인 숫자만 추출하시오.
    추출된 숫자를 하나씩 출력하고, 총합을 구하시오.

    실행 결과
    처리 결과 : [60, 100, 80, 120]
    60
    100
    80
    120
    총합 : 360

    조건 : map(), filter(), forEach() 사용
    - map() : 각 숫자를 2배로 변환
    - filter() : 50 이상인 숫자 추출
    - forEach() : 추출된 숫자 출력 및 총합 계산
    - 원본 배열은 변경하지 않을 것
    */

    let data = [30, 15, 50, 40, 60, 20];

</script>
