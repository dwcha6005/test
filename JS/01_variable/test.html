<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<!-- 자바스크립트 사용을 위해서는 <script></script> 태그를 사용하여 자바스크립트 영역 표시 필수! -->
<!-- <script> 태그의 type="te xt/javascript" 속성은 생략 가능 -->
<script type="text/javascript">
	// 자바스크립트에서 한 줄 주석(단일 라인 주석)은 자바와 동일하게 // 기호로 표현
	// => 단축키도 동일함
	
	/*
	이 주석은 자바스크립트에서
	여러 줄(범위 = 다중 라인) 주석 처리(= 자바와 동일)
	*/

	alert("Hello, World!");
	// 자바스크립트에서 문장 끝에 세미콜론은 필수 요소가 아님! (= 자바와 다름)
	// 단, 한 줄에 여러 문장을 이어서 작성할 때는 반드시 문장끼리 구별하는 용도로 사용해야함
	// => 다만, 자바 계열의 언어를 학습하는 경우 세미콜론을 반드시 명시하는 것이 좋다!
// 	alert("Hello, World2!")alert("Hello, World3!"); // 문장 붙여서 작성 시 세미콜론 필수!
// 	alert("Hello, World2!");
// 	alert("Hello, World3!");
</script>
</head>
<body>
	<h1>자바스크립트 기초</h1>
	<!-- <script> 태그는 HTML 문서 내의 대부분의 위치에 여러 번 올 수 있다! -->
	<!-- 단, 실행 순서는 위에서 아래 방향으로 차례대로 수행된다! -->
	<script>
		alert("확인");
	</script>
</body>
</html>
