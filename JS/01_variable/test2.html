<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script type="text/javascript">
	/*
	[ 함수(function) ]
	- 어떤 작업을 수행하는데 사용되는 명령어들의 집합
	- 반드시 호출을 통해서 내부의 명령어가 실행될 수 있다
	
	[ 내장 함수 ]
	- 자바스크립트에서 미리 작성하여 제공하는(= 내장된) 함수로
	  이미 자바스크립트 언어 자체에서 구현하여 제공하므로
	  개발자는 내장 함수 호출을 통해 구현되어 있는 기능을 사용 가능
	  (함수는 자바에서의 메서드(Method) 와 거의 동일)
	- 함수 호출 기본 문법 : 함수명(필요에 따라 전달할 데이터);
	- 대표적인 내장 함수 : alert(), confirm(), prompt() 등
	*/
	// ----------------------------------------------------------------------------------------
	// 1. alert() 함수 : 함수 호출 시 전달되는 데이터를 웹브라우저 팝업창(= 다이얼로그, 모달창)을 통해
	//                   출력하는 용도의 함수(사용자에게 메세지를 보여주는 용도)
	// => 소괄호 사이에 브라우저에서 출력할 데이터 또는 변수 등을 전달
// 	alert("Hello, World!"); // "Hello, World!" 문자열 출력
	// 자바스크립트는 자바와 달리 문자('')와 문자열("")을 구별하지 않으므로 둘 다 사용 가능
// 	alert('이연태'); // 작은 따옴표로 문자열 표기 가능
// 	alert(1234);
	// ----------------------------------------------------------------------------------------
	// 2. confirm() 함수 : 사용자로부터 확인/취소 버튼을 통해 확인 작업을 수행하는 함수
	// => 소괄호 사이에 문자열 전달 시 팝업창에 해당 문자열 표시(= alert() 함수와 동일)
// 	confirm("종료하시겠습니까?");
	
	// 확인/취소 버튼 중 하나를 눌렀을 때 누른 버튼에 값을 리턴해주는데
	// 해당 값을 함수 좌변의 변수 선언을 통해 전달받을 수 있다!
	// => 확인 버튼 클릭 시 true, 취소 버튼 클릭 시 false 값 리턴됨
// 	let result = confirm("종료하시겠습니까?"); // 누른 버튼에 따라 true 또는 false 값이 변수에 저장됨
// 	alert(result); // alert() 함수를 통해 result 변수에 저장된 true/false 값 출력됨
	// ----------------------------------------------------------------------------------------
	// 3. prompt() 함수 : 팝업창을 통해 사용자로부터 데이터를 직접 입력받는 함수
// 	prompt("이름을 입력하세요");
// 	prompt("이름을 입력하세요", "홍길동"); // 입력창에 기본값 표시(설정) 가능(미리 입력되어 있음)
	// 입력창에 어떤 내용을 입력 후 [확인] 버튼 클릭 시 해당 입력값이 리턴됨(confirm() 과 유사함)
	// => 만약, 아무 값도 입력하지 않고 [확인] 버튼 클릭 시 빈 문자열("" = 널스트링)이 리턴되고
	//    데이터 입력과 상관없이 [취소] 버튼 클릭 시 null 이라는 특수한 값이 리턴됨
// 	let result = prompt("이름을 입력하세요");
// 	alert(result);
	// ----------------------------------------------------------------------------------------
	// 4. console.log() : 웹브라우저 개발자도구(F12)의 콘솔(Console) 탭에 메세지를 출력하는 함수
	// => 소괄호 내에 출력할 메세지 또는 데이터 전달
	// => 웹브라우저 화면에서는 표시되지 않고, 무조건 개발자 도구에서만 확인 가능
	// => 주로, 자바스크립트에서의 변수 값 등 상태 확인 용도로 개발자가 사용
	console.log(">>>>>>>>>> 콘솔 메세지 확인");
	console.log(">>>>>>>>>> 이연태");
	// ----------------------------------------------------------------------------------------
	// 5. document.write() : 웹브라우저 화면(본문 표시하는 body)에 메세지를 출력하는 함수
	// => 소괄호 내에 출력할 메세지 또는 데이터 전달
// 	document.write("메세지 확인");
	
	// 출력할 데이터 부분에 문자열로 HTML 태그 전달 시 실제 태그로 동작함
	document.write("<h1>메세지 확인</h1>");
</script>
</head>
<body>
	<h1>test2.jsp</h1>
	<script>
		document.write("메세지 확인2222");
	</script>
</body>
</html>
