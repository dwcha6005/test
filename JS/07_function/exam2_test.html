<script>
    /*
    문제 1. 
    전달받은 모든 숫자의 합계를 반환하는 sum() 함수를 작성하시오.
    예시 : sum(10, 20, 30) -> 60
    */
function sum(...nums){
    let sum = 0;
    for (let n of nums) {
        sum += n;
    }
    return sum
}
console.log(sum(10, 20, 30))

    /*
    문제 2. 
    전달받은 숫자의 평균을 반환하는 average() 함수를 작성하시오.
    인자가 없으면 0을 반환하시오.
    */
function average(...nums) {
    if (nums.length == 0) {
        return 0;
    }

    let sum = 0;
    for (let n of nums) {
        sum += n;
    }
    return sum / nums.length;
}
console.log(average(10, 20, 30))
    /*
    문제 5. 
    전달받은 모든 숫자 중 최댓값을 반환하는 getMax() 함수를 작성하시오.
    */
function getMax(...nums) {
    let max = 0;
    for (let n of nums) {
        if (max < n) {
            max = n;
        }
    }
    return max;
}
console.log(getMax(10, 20, 30, 40, 50, 60))

    function printPost(subject, ...tags) {

            console.log("등록된 태그가 없습니다.")
            return;
        } 

        // debugger;

        msg = tags.map(t => "#" + t).join(" ")
        console.log("태그: " + msg)
    }

   printPost("JavaScript 공부하기", "JavaScript", "프로그래밍", "웹개발");
