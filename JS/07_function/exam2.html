<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    
/*
< 1. 매개변수와 인자 >
매개변수(Parameter) : 함수 선언 시 전달받은 값을 저장하는 변수
인자(Argument) : 함수를 호출할 때 전달하는 실제 값
*/
function printInfo(name, age) {
    console.log(name);
    console.log(age);
}

printInfo("홍길동", 20);


/*
< 2. 매개변수 개수와 인자 개수 >
인자의 개수와 매개변수의 개수는 반드시 일치할 필요가 없다.
인자가 부족하면 전달받지 못한 매개변수는 undefined가 된다.
인자가 더 많으면 일반 매개변수에 대응하지 않는 인자는 별도로 저장되지 않는다.
*/
function printInfo2(name, age) {
    console.log(name);
    console.log(age);
}

printInfo2("홍길동", 20);
printInfo2("홍길동");
printInfo2("홍길동", 20, "부산");


/*
< 3. 나머지 매개변수(Rest Parameters) >
나머지 매개변수 : 전달받은 여러 인자를 하나의 배열로 모으는 문법
...매개변수이름 형식으로 작성한다.
인자의 개수가 정해져 있지 않을 때 유용하다.
*/
function printNumbers(...numbers) {
    console.log(numbers);
}

printNumbers(10, 20, 30);
printNumbers(10, 20, 30, 40, 50);
printNumbers(100);
printNumbers();


/*
< 4. 나머지 매개변수 활용 : 합계 >
나머지 매개변수는 배열이므로 length, 인덱스, 반복문을 사용할 수 있다.
*/
function sum(...numbers) {
    let total = 0;

    for (let i = 0; i < numbers.length; i++) {
        total += numbers[i];
    }

    return total;
}

console.log(sum(10, 20)); // 30
console.log(sum(10, 20, 30)); // 60
console.log(sum(1, 2, 3, 4, 5)); // 15
console.log(sum()); // 0


/*
< 5. 나머지 매개변수 활용 : 평균 >
전달받은 숫자의 평균을 반환한다.
인자가 없으면 0을 반환하도록 처리한다.
*/
function average(...numbers) {
    if (numbers.length === 0) {
        return 0;
    }

    let total = 0;

    for (let i = 0; i < numbers.length; i++) {
        total += numbers[i];
    }

    return total / numbers.length;
}

console.log(average(10, 20)); // 15
console.log(average(10, 20, 30)); // 20
console.log(average(80, 90, 100, 70)); // 85
console.log(average()); // 0


/*
< 6. 일반 매개변수와 나머지 매개변수 >
일반 매개변수와 나머지 매개변수를 함께 사용할 수 있다.
나머지 매개변수는 반드시 마지막에 작성해야 한다.
*/
function printScores(name, ...scores) {
    console.log("이름 : " + name);
    console.log("점수 : ", scores);
}

printScores("홍길동", 80, 90, 100);
printScores("김철수", 70, 85);


/*
< 7. 나머지 매개변수 작성 규칙 >
나머지 매개변수는 하나만 사용할 수 있다.
나머지 매개변수 뒤에는 다른 매개변수를 작성할 수 없다.
*/
// function test(...numbers, last) {} // 오류
// function test(...numbers, ...others) {} // 오류


/*
< 8. arguments 객체 >
arguments : 일반 함수에서 전달받은 인자를 확인할 수 있는 유사 배열 객체
arguments.length : 전달받은 인자의 개수
arguments[0] : 첫 번째 인자
화살표 함수에는 자체 arguments 객체가 없다.
*/
function printArgs() {
    console.log(arguments);
    console.log(arguments.length);
    console.log(arguments[0]);
    console.log(arguments[1]);
}

printArgs(10, 20, 30);


/*
< 9. arguments와 나머지 매개변수 비교 >
arguments : 유사 배열 객체
나머지 매개변수 : 실제 배열
*/
function test1() {
    console.log(arguments);
}

function test2(...numbers) {
    console.log(numbers);
}

test1(10, 20, 30);
test2(10, 20, 30);


/*
< 10. 전개 구문(Spread Syntax) >
전개 구문 : 배열 등의 요소를 개별 값으로 펼치는 문법
함수 호출, 배열 생성 등에서 사용할 수 있다.
나머지 매개변수와 같은 ...을 사용하지만 목적이 다르다.
*/
function add(a, b, c) {
    return a + b + c;
}

let numbers = [10, 20, 30];

console.log(add(...numbers)); // 60


/*
< 11. 전개 구문으로 배열 결합하기 >
*/
let arr1 = [10, 20, 30];
let arr2 = [40, 50, 60];

let result = [...arr1, ...arr2];

console.log(result); // [10, 20, 30, 40, 50, 60]


/*
< 12. 전개 구문으로 최댓값 구하기 >
Math.max()는 여러 숫자를 인자로 전달받는다.
전개 구문을 사용하면 배열의 요소를 각각 전달할 수 있다.
*/
let scores = [10, 50, 30, 90, 20];

console.log(Math.max(10, 50, 30, 90, 20)); // 90
console.log(Math.max(...scores)); // 90


/*
< 13. 나머지 매개변수와 전개 구문 비교 >
나머지 매개변수 : 여러 인자를 배열로 모은다.
전개 구문 : 배열의 요소를 개별 값으로 펼친다.
*/
function test3(...args) {
    console.log(args);
}

let values = [10, 20, 30];

test3(...values);



</script>

</body>
</html>
