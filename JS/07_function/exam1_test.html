<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
// < 문제 1. 인사 함수 >
// hello() 함수를 선언하고 호출했을 때 다음 문장이 출력되도록 작성하시오.
// 안녕하세요!

// < 문제 2. 이름 전달하기 >
// greeting(name) 함수를 작성하시오. 이름을 전달하면 다음 형식으로 출력되도록 작성하시오.
// 홍길동님, 반갑습니다.

// < 문제 3. 두 수의 합 >
// 두 개의 숫자를 매개변수로 전달받아 합계를 반환하는 add(a, b) 함수를 작성하시오.
// - add(10, 20)의 반환값은 30이어야 한다.
// - 반환값을 변수에 저장한 뒤 출력하시오.

// < 문제 4. 짝수 판별 >
// 숫자를 매개변수로 전달받아 짝수이면 true, 홀수이면 false를 반환하는 isEven(num) 함수를 작성하시오.
// - 힌트 : 나머지 연산자 %를 사용한다.

// < 문제 5. 절댓값 구하기 >
// 숫자를 전달받아 절댓값을 반환하는 getAbs(num) 함수를 작성하시오.
// - getAbs(10) → 10
// - getAbs(-10) → 10
// - getAbs(0) → 0

// < 문제 6. 최댓값 구하기 > 
// 두 개의 숫자를 전달받아 더 큰 숫자를 반환하는 getMax(a, b) 함수를 작성하시오.
// - getMax(10, 20) → 20
// - getMax(50, 30) → 50
// - 두 숫자가 같을 때도 올바르게 처리하시오.

// < 문제 7. 점수 판별 > 
// 점수를 매개변수로 전달받아 다음 조건에 따라 결과를 반환하는 getGrade(score) 함수를 작성하시오.
// - 90점 이상 : "A"
// - 80점 이상 90점 미만 : "B"
// - 70점 이상 80점 미만 : "C"
// - 70점 미만 : "F"

// < 문제 8. 계산기 함수 > 
// 숫자 두 개와 연산자를 전달받아 계산 결과를 반환하는 calculator(a, b, operator) 함수를 작성하시오.
// - "+" : 덧셈
// - "-" : 뺄셈
// - "*" : 곱셈
// - "/" : 나눗셈
// - 지원하지 않는 연산자는 "잘못된 연산자"를 반환하시오.
// - 0으로 나누는 경우 "0으로 나눌 수 없습니다."를 반환하시오.
</script>

<body>
    
</body>
</html>
