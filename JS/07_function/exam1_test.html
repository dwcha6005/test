/*
    도로 교통상황이 숫자로 주어진다.
    출발 70 80 60 20 30 50 10 80 77 89
              ||    ||    ||
        70 60 40 50 55 65 23 44 37 88 도착
    
    북쪽도로에서 남쪽도로로 건널수 있는 다리는 index번호로 주어진다.
    이때, 가장 최소 시간이 소요되는 다리는 몇번 다리인지 출력하고 최소시간을 함께 출력해보자!

                최소시간: 512
    
    주의사항.
    1. 무조건 다리를 1번 건너야함 (도착지점이 남쪽이기 때문에)
    2. 다리를 여러번 건널수 없고 딱, 한번만 가능
    3. 다리를 건널때에는 남쪽, 분쪽 소요시간이 같이 소요됨. (즉, 같이 합산해야함)
    4. 소요시간이 같은 경우가 발생하면 낮은 다리번호를 출력

    let north = [70, 80, 60, 20, 30, 50, 10, 80, 77, 89]
    let south = [70, 60, 40, 50, 55, 65, 23, 44, 37, 88]
    let bridges = [2, 4, 6]
*/

let south = [70, 60, 40, 50, 55, 65, 23, 44, 37, 88]
let bridges = [2, 4, 6]

let total = []

for (let index of bridges) {
    total.push(getSum(index));
}

let min = total[0];
let minIndex = 0;
for (let i = 0; i < total.length; i++) {  // index가 필요하므로 일반 for문
    if (min > total[i]) {
        min = total[i];
        minIndex = i;
    }
}

console.log("다리번호: " + bridges[minIndex])
console.log("최소시간: " + total[minIndex])

function getSum(index) {
    let sum = 0;
    // 북쪽(north)는 전달받은 index까지 누적
    for (let i = 0; i <= index; i++) {
        sum += north[i];
    }
    // 남쪽(south)는 전달받은 index부터 배열 끝까지 누적
    for (let i = index; i < south.length; i++) {
        sum += south[i];
    }
    return sum;
}
