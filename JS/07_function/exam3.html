<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    /*
        < 8. 함수 선언식과 함수 표현식 >

        함수는 코드를 하나의 기능으로 묶어 재사용할 수 있게 해준다.
        함수를 만드는 방법에는 함수 선언식과 함수 표현식 등이 있다.
    */

    /* < 8-1. 함수 선언식(Function Declaration) > */

    // function 키워드로 함수를 선언하는 기본적인 방법
    function add(a, b) {
        return a + b;
    }

    console.log(add(10, 20)); // 30
    console.log(add(5, 7));   // 12

    // 함수 선언식은 함수 이름으로 호출한다.
    // 함수가 선언된 위치보다 앞에서도 호출할 수 있다.
    // 이러한 특징은 함수 선언식의 호이스팅과 관련이 있다.

    /*
    console.log(subtract(20, 5)); // 15

    function subtract(a, b) {
        return a - b;
    }
    */

    // 함수 선언식은 선언문 전체가 호이스팅되어
    // 함수가 정의되기 전 위치에서도 호출할 수 있다.
    // 단, 함수가 실제로 선언되어 있어야 한다.


    /* < 8-2. 함수 표현식(Function Expression) > */

    // 함수를 값처럼 취급하여 변수에 저장하는 방법
    const addNumber = function(a, b) {
        return a + b;
    };

    console.log(addNumber(10, 20)); // 30
    console.log(addNumber(5, 7));   // 12

    // function(a, b) { ... } : 이름이 없는 함수(익명 함수)
    // addNumber : 함수를 저장한 변수
    // addNumber(10, 20) : 변수에 저장된 함수를 호출

    // 함수 표현식은 변수에 함수를 할당하는 방식이다.
    // const로 선언한 변수는 초기화되기 전까지 사용할 수 없으므로
    // 함수가 할당되기 전에 호출하면 오류가 발생한다.

    /*
    console.log(multiply(3, 4)); // 오류 발생

    const multiply = function(a, b) {
        return a * b;
    };
    */

    // 함수 선언식과 함수 표현식의 차이
    // 함수 선언식 : 함수 선언문 자체가 호이스팅되어 호출 가능
    // 함수 표현식 : 변수에 함수가 할당된 이후에 호출 가능


    /* < 8-3. 함수 표현식을 사용하는 이유 > */

    // JavaScript에서는 숫자나 문자열처럼 함수도 값으로 다룰 수 있다.
    // 따라서 함수를 변수에 저장하거나 다른 함수에 전달할 수 있다.

    const greet = function() {
        console.log("안녕하세요.");
    };

    greet(); // 안녕하세요.

    // greet 변수에는 문자열이나 숫자가 아니라 함수가 저장되어 있다.
    // greet() : 저장된 함수를 실행한다.
    // greet   : 함수 자체를 가리킨다.

    // 괄호가 있으면 함수를 실행한다.
    // 괄호가 없으면 함수를 값으로 전달하거나 참조할 수 있다.


    /*
        < 9. 화살표 함수(Arrow Function) >

        ES6에서 도입된 함수 표현식의 간결한 작성 방식이다.
        화살표 함수도 변수에 저장하여 사용할 수 있다.
    */

    /* < 9-1. 기본 형태 > */

    const addArrow = (a, b) => {
        return a + b;
    };

    console.log(addArrow(10, 20)); // 30

    // function 키워드 대신 => 기호를 사용한다.
    // 위 코드는 다음 함수 표현식과 같은 역할을 한다.

    /*
    const addArrow = function(a, b) {
        return a + b;
    };
    */


    /* < 9-2. 반환문을 생략하는 방법 > */

    // 함수 내부에 실행문이 하나이고
    // 그 결과를 그대로 반환한다면 중괄호와 return을 생략할 수 있다.

    const addShort = (a, b) => a + b;

    console.log(addShort(10, 20)); // 30

    // 다음 두 코드는 같은 결과를 반환한다.

    /*
    const square1 = function(num) {
        return num * num;
    };

    const square2 = num => num * num;
    */

    // 매개변수가 하나라면 소괄호도 생략할 수 있다.
    const square = num => num * num;

    console.log(square(5)); // 25
    console.log(square(8)); // 64

    // 매개변수가 없거나 두 개 이상이면 소괄호를 사용한다.
    // const hello = () => "안녕하세요.";
    // const sum = (a, b) => a + b;

    // console.log(hello());   // 안녕하세요.
    // console.log(sum(10, 20)); // 30

    // 주의 : 중괄호를 사용하면 일반적인 함수 본문이 되므로
    // 값을 반환하려면 return을 작성해야 한다.

    /*
    const square = num => {
        num * num;
    };

    console.log(square(5)); // undefined
    */

    // 위 코드는 return이 없으므로 계산 결과가 반환되지 않는다.
    // 올바른 작성 방법
    const squareWithReturn = num => {
        return num * num;
    };

    console.log(squareWithReturn(5)); // 25


    /*
        < 10. 함수를 매개변수로 전달하기 >

        함수는 숫자, 문자열처럼 값으로 취급할 수 있다.
        따라서 다른 함수의 매개변수로 전달할 수도 있다.
    */

    /* < 10-1. 함수 전달하기 > */

    function sayHello() {
        console.log("안녕하세요.");
    }

    function executeFunction(func) {
        func();
    }

    executeFunction(sayHello);

    // 실행 순서
    // 1. sayHello 함수를 executeFunction에 전달한다.
    // 2. 전달받은 함수는 func 매개변수에 저장된다.
    // 3. func()를 실행하면 sayHello 함수가 실행된다.

    // 여기서 func는 특별한 예약어가 아니다.
    // 함수를 전달받기 위해 임의로 정한 매개변수 이름이다.


    /* < 10-2. 함수 이름과 함수 호출의 차이 > */

    function printMessage() {
        console.log("메시지를 출력합니다.");
    }

    // 함수 이름만 전달 : 함수를 값으로 전달
    executeFunction(printMessage);

    // 함수 호출 : 함수를 즉시 실행
    printMessage();

    // 다음처럼 작성하면 함수가 먼저 실행된다.
    // printMessage()의 반환값이 executeFunction에 전달된다.
    // 반환값이 없으면 undefined가 전달된다.

    /*
    executeFunction(printMessage());
    */


    /*
        < 11. 콜백 함수(Callback Function) >

        콜백 함수 : 다른 함수의 매개변수로 전달되어
        해당 함수 내부에서 실행되는 함수

        함수를 전달받는 쪽에서 필요할 때 실행할 수 있다는 특징이 있다.
    */

    /* < 11-1. 함수 선언식으로 콜백 함수 전달하기 > */

    function introduce() {
        console.log("반갑습니다.");
    }

    function process(callback) {
        console.log("작업을 시작합니다.");
        callback();
        console.log("작업을 종료합니다.");
    }

    process(introduce);

    // 실행 결과
    // 작업을 시작합니다.
    // 반갑습니다.
    // 작업을 종료합니다.

    // introduce 함수가 process 함수에 전달되었다.
    // process 내부에서 callback()을 실행하면 introduce가 실행된다.
    // 이때 introduce가 콜백 함수이다.


    /* < 11-2. 익명 함수를 콜백으로 전달하기 > */

    // 함수 이름을 별도로 만들지 않고 바로 전달할 수도 있다.

    process(function() {
        console.log("전달한 익명 함수가 실행됩니다.");
    });

    // 실행 결과
    // 작업을 시작합니다.
    // 전달한 익명 함수가 실행됩니다.
    // 작업을 종료합니다.

    // 함수 표현식에서 사용한 익명 함수를
    // 다른 함수의 매개변수 위치에 직접 작성한 형태이다.


    /* < 11-3. 화살표 함수를 콜백으로 전달하기 > */

    // 화살표 함수를 사용하면 더 간결하게 작성할 수 있다.

    process(() => {
        console.log("화살표 함수가 실행됩니다.");
    });

    // 한 줄로 작성할 수도 있다.
    process(() => console.log("간단한 작업을 실행합니다."));

    // 실행 결과
    // 작업을 시작합니다.
    // 간단한 작업을 실행합니다.
    // 작업을 종료합니다.

    // 함수 선언식, 함수 표현식, 화살표 함수 모두
    // 콜백 함수로 전달할 수 있다.
    // 콜백 함수는 특정 문법의 이름이 아니라 함수의 역할을 나타내는 말이다.


    /* < 11-4. 매개변수를 전달받는 콜백 함수 > */

    function calculate(a, b, callback) {
        const result = a + b;
        callback(result);
    }

    calculate(10, 20, function(value) {
        console.log("계산 결과 : " + value);
    });

    // 실행 결과
    // 계산 결과 : 30

    // calculate 함수가 계산을 수행한 후
    // 계산 결과를 콜백 함수의 매개변수로 전달한다.
    // callback(result)를 호출하면 전달받은 함수가 실행되며,
    // result 값이 콜백 함수의 value 매개변수에 전달된다.

    // 화살표 함수로 작성하면 다음과 같다.
    calculate(10, 20, value => console.log("계산 결과 : " + value));


    /* < 11-5. 콜백 함수를 사용하는 이유 > */

    // 같은 기능을 수행하더라도
    // 전달하는 콜백 함수에 따라 실행 내용을 바꿀 수 있다.

    function order(callback) {
        console.log("주문을 접수했습니다.");
        callback();
    }

    order(() => console.log("음식을 준비합니다."));
    order(() => console.log("포장 주문을 준비합니다."));
    order(() => console.log("배달을 준비합니다."));

    // order 함수는 주문 접수라는 공통 작업을 수행한다.
    // 이후 어떤 작업을 할지는 전달받은 콜백 함수에 따라 달라진다.
    // 이렇게 함수를 전달하면 실행할 작업을 유연하게 바꿀 수 있다.


    // =======================================================
    function hello() {
        console.log("안녕하세요.");
    }

    // 1. 함수를 직접 실행
    hello();

    // 2. 함수를 값으로 전달
    executeFunction(hello);

    // 3. 익명 함수를 콜백으로 전달
    executeFunction(function() {
        console.log("안녕하세요.");
    });

    // 4. 화살표 함수를 콜백으로 전달
    executeFunction(() => console.log("안녕하세요."));

</script>

</body>
</html>
