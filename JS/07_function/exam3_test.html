<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    /*
        < 1. 함수 선언식으로 계산하기 >

        두 개의 숫자를 매개변수로 전달받아 곱한 결과를 반환하는
        함수 multiply()를 작성하세요.

        조건
        - 함수 선언식을 사용하세요.
        - 함수 내부에서 console.log()를 사용하지 말고 return으로 결과를 반환하세요.
        - 반환된 결과를 console.log()로 출력하세요.

        실행 예시
        console.log(multiply(5, 3));   // 15
        console.log(multiply(10, 7));  // 70
    */


    /*
        < 2. 함수 표현식으로 온도 변환하기 >

        섭씨 온도를 화씨 온도로 변환하는 함수를 작성하세요.

        변환 공식 : 화씨 = 섭씨 * 9 / 5 + 32

        조건
        - 함수 표현식을 사용하세요.
        - 함수 이름은 celsiusToFahrenheit로 작성하세요.
        - 변환된 온도를 반환하세요.

        실행 예시
        console.log(celsiusToFahrenheit(0));   // 32
        console.log(celsiusToFahrenheit(25));  // 77
    */


    /*
        < 3. 화살표 함수로 할인 금액 계산하기 >

        상품 가격과 할인율을 전달받아 할인된 가격을 반환하는
        화살표 함수 discountPrice()를 작성하세요.

        조건
        - 매개변수는 price와 rate입니다.
        - 할인율은 퍼센트 단위로 전달합니다.
        - 화살표 함수의 한 줄 반환 방식을 사용하세요.

        실행 예시
        console.log(discountPrice(10000, 10)); // 9000
        console.log(discountPrice(50000, 20)); // 40000
    */
    let discountPrice = (price, rate) => price * (1 - rate / 100);
    console.log(discountPrice(10000, 10)); // 9000
    console.log(discountPrice(50000, 20)); // 40000

    /*
        < 4. 함수를 매개변수로 전달하기 >

        다음 조건에 맞게 함수를 작성하세요.

        조건
        - hello()는 "안녕하세요!"를 출력합니다.
        - goodbye()는 "안녕히 가세요!"를 출력합니다.
        - execute()는 함수 하나를 매개변수로 전달받아 실행합니다.
        - execute()에 hello와 goodbye를 각각 전달하여 실행하세요.

        주의
        - execute(hello)와 execute(hello())의 차이를 생각하세요.

        실행 예시
        execute(hello);
        // 안녕하세요!

        execute(goodbye);
        // 안녕히 가세요!
    */


    /*
        < 5. 콜백 함수로 계산 결과 출력하기 >

        두 숫자와 콜백 함수를 전달받아 계산 결과를 처리하는
        calculate() 함수를 작성하세요.

        조건
        - calculate(a, b, callback) 형태로 작성하세요.
        - calculate() 내부에서 a와 b를 더하세요.
        - 더한 결과를 callback 함수에 전달하세요.
        - 콜백 함수는 전달받은 결과를 "결과 : 숫자" 형태로 출력하세요.
        - 콜백 함수는 화살표 함수로 작성하세요.

        실행 예시
        calculate(10, 20, ...);
        // 결과 : 30

        calculate(50, 30, ...);
        // 결과 : 80
    */


    /*
        < 6. 콜백 함수에 따라 결과 바꾸기 >

        숫자 두 개와 콜백 함수를 전달받아 계산하는
        operate() 함수를 작성하세요.

        조건
        - operate(a, b, callback) 형태로 작성하세요.
        - 실제 계산은 전달받은 콜백 함수가 수행하도록 만드세요.
        - 덧셈, 뺄셈, 곱셈 함수를 각각 작성하세요.
        - 각 함수를 콜백으로 전달하여 결과를 출력하세요.

        실행 예시
        operate(10, 5, ...); // 15
        operate(10, 5, ...); // 5
        operate(10, 5, ...); // 50

        힌트
        - operate() 내부에서 무조건 더하기를 수행하면 안 됩니다.
        - 전달받은 callback 함수에 a와 b를 전달하세요.
    */


    /*
        < 7. 콜백 함수로 메시지 만들기 >

        이름과 콜백 함수를 전달받아 인사 메시지를 출력하는
        greet() 함수를 작성하세요.

        조건
        - greet(name, callback) 형태로 작성하세요.
        - callback 함수에 name을 전달하세요.
        - 콜백 함수는 이름을 전달받아 인사 문장을 출력하세요.
        - 콜백 함수는 화살표 함수로 전달하세요.

        실행 예시
        greet("민수", ...);
        // 민수님, 환영합니다!

        greet("영희", ...);
        // 영희님, 오늘도 좋은 하루 보내세요!
    */


    /*
        < 8. 실행 순서 예측하기 >

        아래 코드를 실행했을 때 출력되는 결과를 순서대로 적으세요.
        코드를 직접 실행하기 전에 먼저 예측하세요.
    */

    function start(callback) {
        console.log("1. 시작");

        callback();

        console.log("3. 종료");
    }

    start(() => {
        console.log("2. 작업 중");
    });

    // 예상 출력 결과
    // 1.
    // 2.
    // 3.

    // 추가 질문
    // 1. callback()을 실행하는 줄을 삭제하면 어떻게 될까요?
    // 2. callback 대신 callback()을 전달하면 어떤 차이가 있을까요?


    /*
        < 9. 조건에 따라 다른 콜백 실행하기 >

        숫자와 두 개의 콜백 함수를 전달받는 checkNumber() 함수를 작성하세요.

        조건
        - 숫자가 0보다 크면 첫 번째 콜백 함수를 실행하세요.
        - 숫자가 0 이하이면 두 번째 콜백 함수를 실행하세요.
        - 숫자와 콜백 함수 두 개를 매개변수로 전달받으세요.
        - 결과 메시지는 콜백 함수 내부에서 출력하세요.

        실행 예시
        checkNumber(10, ..., ...);
        // 양수입니다.

        checkNumber(-3, ..., ...);
        // 양수가 아닙니다.

        checkNumber(0, ..., ...);
        // 양수가 아닙니다.

        힌트
        - if문을 사용하세요.
        - 콜백 함수는 화살표 함수로 전달하세요.
    */


    /*
        < 10. 종합 문제 - 간단한 주문 처리 시스템 >

        주문 금액과 콜백 함수를 전달받아 주문 결과를 출력하는
        processOrder() 함수를 작성하세요.

        조건
        - processOrder(price, callback) 형태로 작성하세요.
        - 주문 금액이 30000원 이상이면 "무료 배송"을 출력하세요.
        - 주문 금액이 30000원 미만이면 "배송비 3000원 추가"를 출력하세요.
        - 배송 정책을 판단하는 기능은 콜백 함수가 담당하도록 만드세요.
        - processOrder()는 주문 금액을 콜백 함수에 전달하세요.
        - 배송 정책 콜백은 화살표 함수로 작성하세요.
        - 서로 다른 주문 금액으로 3번 이상 테스트하세요.

        실행 예시
        processOrder(50000, ...);
        // 주문 금액: 50000원
        // 무료 배송

        processOrder(20000, ...);
        // 주문 금액: 20000원
        // 배송비 3000원 추가

        추가 도전
        - 배송비까지 포함한 최종 결제 금액도 출력하세요.
    */

</script>

</html>
