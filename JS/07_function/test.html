<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    
    /*
        JavaScript 종합 실습 문제
        범위 : 변수, 연산자, 조건문, 반복문, 배열, 함수, 콜백 함수
        구성 : 문제 + 정답

        사용 방법
        1. 문제를 먼저 읽고 직접 구현한다.
        2. 정답 부분을 확인한다.
        3. 문제별로 필요한 코드만 실행한다.
    */


    /*
        < 난이도 1. 편의점 판매 금액 계산 >

        [문제]
        편의점에서 상품을 판매한 금액을 계산하세요.

        조건
        - 상품 가격과 구매 수량을 매개변수로 전달받는다.
        - 상품의 총금액을 반환하는 함수를 작성한다.
        - 총금액이 3만원 이상이면 10% 할인한다.
        - 최종 결제 금액을 출력한다.

        실행 예시
        calculatePrice(5000, 7);
        // 상품 금액: 35000원
        // 할인 금액: 3500원
        // 결제 금액: 31500원
    */

    // [정답]
    function calculatePrice(price, quantity) {
        let total = price * quantity;
        let discount = 0;

        if (total >= 30000) {
            discount = total * 0.1;
        }

        let finalPrice = total - discount;

        console.log("상품 금액: " + total + "원");
        console.log("할인 금액: " + discount + "원");
        console.log("결제 금액: " + finalPrice + "원");

        return finalPrice;
    }

    calculatePrice(5000, 7);


    /*
        < 난이도 2. 온라인 쇼핑몰 장바구니 >

        [문제]
        여러 상품의 가격이 배열에 저장되어 있다.
        장바구니의 총금액과 평균 상품 가격을 계산하세요.

        조건
        - prices 배열에 상품 가격이 저장되어 있다.
        - 반복문을 사용해 총금액을 계산한다.
        - 상품 가격의 평균을 계산한다.
        - 총금액이 10만원 이상이면 5% 할인한다.
        - 총금액, 평균 가격, 할인 후 금액을 출력한다.
    */

    // [정답]
    function analyzeCart(prices) {
        let total = 0;

        for (let i = 0; i < prices.length; i++) {
            total += prices[i];
        }

        let average = 0;

        if (prices.length > 0) {
            average = total / prices.length;
        }

        let discount = 0;

        if (total >= 100000) {
            discount = total * 0.05;
        }

        console.log("장바구니 총금액: " + total + "원");
        console.log("평균 상품 가격: " + average.toFixed(0) + "원");
        console.log("할인 후 금액: " + (total - discount) + "원");
    }

    let cartPrices = [25000, 35000, 18000, 30000];

    analyzeCart(cartPrices);


    /*
        < 난이도 3. 쇼핑몰 재고 관리 >

        [문제]
        상품명과 재고 수량이 각각 별도의 배열에 저장되어 있다.

        조건
        - 재고가 5개 이하인 상품을 찾아 출력한다.
        - 재고가 0개인 상품은 "품절"이라고 출력한다.
        - 재고가 1~5개인 상품은 "재고 부족"이라고 출력한다.
        - 나머지는 출력하지 않는다.
        - 상품명과 재고 수량의 인덱스는 서로 대응한다.
    */

    // [정답]
    function checkInventory(productNames, stockCounts) {
        for (let i = 0; i < productNames.length; i++) {
            if (stockCounts[i] === 0) {
                console.log(productNames[i] + ": 품절");
            } else if (stockCounts[i] <= 5) {
                console.log(productNames[i] + ": 재고 부족 (" + stockCounts[i] + "개)");
            }
        }
    }

    let productNames = ["키보드", "마우스", "모니터", "헤드셋", "USB"];
    let stockCounts = [3, 20, 0, 5, 12];

    checkInventory(productNames, stockCounts);


    /*
        < 난이도 4. 온라인 강의 수강생 관리 >

        [문제]
        수강생들의 이름과 시험 점수가 배열에 저장되어 있다.

        조건
        - 60점 이상인 수강생의 이름을 새로운 배열에 저장한다.
        - 60점 미만인 수강생은 재시험 대상 배열에 저장한다.
        - 합격자 수와 재시험 대상 수를 출력한다.
        - 원본 배열은 수정하지 않는다.
    */

    // [정답]
    function analyzeStudents(names, scores) {
        let passNames = [];
        let retestNames = [];

        for (let i = 0; i < scores.length; i++) {
            if (scores[i] >= 60) {
                passNames.push(names[i]);
            } else {
                retestNames.push(names[i]);
            }
        }

        console.log("합격자: " + passNames.join(", "));
        console.log("합격 인원: " + passNames.length + "명");
        console.log("재시험 대상: " + retestNames.join(", "));
        console.log("재시험 인원: " + retestNames.length + "명");
    }

    let studentNames = ["민수", "영희", "철수", "지우", "수진"];
    let studentScores = [85, 45, 70, 55, 90];

    analyzeStudents(studentNames, studentScores);


    /*
        < 난이도 5. 고객 포인트 적립 및 사용 >

        [문제]
        쇼핑몰에서 구매 금액에 따라 포인트를 적립한다.

        조건
        - 구매 금액의 1%를 포인트로 적립한다.
        - 포인트는 소수점 이하를 버린다.
        - 기존 포인트와 사용할 포인트를 전달받는다.
        - 사용하려는 포인트가 보유 포인트보다 많으면 사용을 거절한다.
        - 포인트 사용이 가능하면 사용 후 잔여 포인트를 반환한다.
    */

    // [정답]
    function earnPoint(price) {
        return Math.floor(price * 0.01);
    }

    function usePoint(currentPoint, useAmount) {
        if (useAmount <= 0) {
            console.log("사용 포인트는 0보다 커야 합니다.");
            return currentPoint;
        }

        if (useAmount > currentPoint) {
            console.log("포인트가 부족합니다.");
            return currentPoint;
        }

        let remainingPoint = currentPoint - useAmount;

        console.log("사용 포인트: " + useAmount + "점");
        console.log("잔여 포인트: " + remainingPoint + "점");

        return remainingPoint;
    }

    let purchasePrice = 78500;
    let earnedPoint = earnPoint(purchasePrice);

    console.log("적립 포인트: " + earnedPoint + "점");

    let currentPoint = 1200 + earnedPoint;
    currentPoint = usePoint(currentPoint, 500);


    /*
        < 난이도 6. 일별 매출 분석 >

        [문제]
        일주일 동안의 매출이 배열에 저장되어 있다.

        조건
        - 전체 매출을 계산한다.
        - 일평균 매출을 계산한다.
        - 최고 매출과 최저 매출을 찾는다.
        - 매출이 50만원 이상인 날짜의 요일을 출력한다.
        - 배열의 첫 번째 값으로 최고 매출과 최저 매출을 초기화한다.
    */

    // [정답]
    function analyzeSales(sales, days) {
        if (sales.length === 0) {
            console.log("분석할 매출 데이터가 없습니다.");
            return;
        }

        let total = 0;
        let max = sales[0];
        let min = sales[0];

        for (let i = 0; i < sales.length; i++) {
            total += sales[i];

            if (sales[i] > max) {
                max = sales[i];
            }

            if (sales[i] < min) {
                min = sales[i];
            }
        }

        console.log("전체 매출: " + total + "원");
        console.log("일평균 매출: " + (total / sales.length).toFixed(0) + "원");
        console.log("최고 매출: " + max + "원");
        console.log("최저 매출: " + min + "원");
        console.log("매출 50만원 이상인 날짜:");

        for (let i = 0; i < sales.length; i++) {
            if (sales[i] >= 500000) {
                console.log(days[i] + "요일: " + sales[i] + "원");
            }
        }
    }

    let days = ["월", "화", "수", "목", "금", "토", "일"];
    let dailySales = [320000, 480000, 510000, 270000, 620000, 850000, 430000];

    analyzeSales(dailySales, days);


    /*
        < 난이도 7. 예약 가능 시간 확인 >

        [문제]
        시간대별 예약 인원이 배열에 저장되어 있다.
        각 시간대의 최대 예약 인원은 4명이다.

        조건
        - 예약 인원이 4명 미만인 시간대만 예약 가능하다.
        - 예약 가능한 시간대를 새로운 배열로 반환한다.
        - 예약 가능한 시간대가 몇 개인지 출력한다.
        - includes()를 활용해 특정 시간대가 예약 가능한지도 확인한다.
    */

    // [정답]
    function getAvailableTimes(times, reservationCounts) {
        let availableTimes = [];

        for (let i = 0; i < times.length; i++) {
            if (reservationCounts[i] < 4) {
                availableTimes.push(times[i]);
            }
        }

        return availableTimes;
    }

    let times = ["10:00", "11:00", "12:00", "13:00", "14:00"];
    let reservationCounts = [4, 2, 3, 4, 1];

    let availableTimes = getAvailableTimes(times, reservationCounts);

    console.log("예약 가능 시간: " + availableTimes.join(", "));
    console.log("예약 가능 시간대 수: " + availableTimes.length);
    console.log("11:00 예약 가능 여부: " + availableTimes.includes("11:00"));
    console.log("10:00 예약 가능 여부: " + availableTimes.includes("10:00"));


    /*
        < 난이도 8. 콜백 함수로 할인 정책 만들기 >

        [문제]
        쇼핑몰에서 회원 등급에 따라 할인 정책을 다르게 적용한다.

        조건
        - applyDiscount(price, callback) 함수를 작성한다.
        - callback에 상품 가격을 전달하고 할인된 가격을 반환받는다.
        - 일반 회원은 3% 할인한다.
        - VIP 회원은 10% 할인한다.
        - 쿠폰 회원은 5,000원을 할인한다.
        - 세 가지 정책을 화살표 함수 콜백으로 전달한다.
    */

    // [정답]
    function applyDiscount(price, callback) {
        return callback(price);
    }

    let normalPrice = applyDiscount(50000, price => price * 0.97);
    let vipPrice = applyDiscount(50000, price => price * 0.9);
    let couponPrice = applyDiscount(50000, price => price - 5000);

    console.log("일반 회원 결제 금액: " + normalPrice + "원");
    console.log("VIP 회원 결제 금액: " + vipPrice + "원");
    console.log("쿠폰 회원 결제 금액: " + couponPrice + "원");


    /*
        < 난이도 9. 상품 판매 데이터 분석 >

        [문제]
        상품별 판매 수량과 단가를 분석하는 프로그램을 작성한다.

        조건
        - 상품명, 단가, 판매 수량은 각각 별도의 배열로 관리한다.
        - 상품별 매출을 계산한다.
        - 전체 매출을 계산한다.
        - 매출이 10만원 이상인 상품명을 새로운 배열에 저장한다.
        - 상품별 매출 계산을 별도의 함수로 분리한다.
        - forEach()를 사용해 상품별 매출을 출력한다.
    */

    // [정답]
    function getProductSales(price, quantity) {
        return price * quantity;
    }

    function analyzeProductSales(names, prices, quantities) {
        let totalSales = 0;
        let bestProducts = [];

        names.forEach((name, index) => {
            let sales = getProductSales(prices[index], quantities[index]);

            totalSales += sales;

            console.log(name + ": " + sales + "원");

            if (sales >= 100000) {
                bestProducts.push(name);
            }
        });

        console.log("전체 매출: " + totalSales + "원");
        console.log("매출 10만원 이상 상품: " + bestProducts.join(", "));
    }

    let itemNames = ["키보드", "마우스", "모니터", "헤드셋"];
    let itemPrices = [50000, 25000, 180000, 70000];
    let itemQuantities = [3, 5, 2, 1];

    analyzeProductSales(itemNames, itemPrices, itemQuantities);


    /*
        < 난이도 10. 종합 프로젝트 - 쇼핑몰 주문 분석 >

        [문제]
        주문 금액과 주문 상태를 분석하는 프로그램을 작성한다.

        주문 상태는 다음과 같다.
        - "결제완료"
        - "배송중"
        - "취소"

        조건
        - 주문 번호, 주문 금액, 주문 상태를 각각 별도의 배열로 관리한다.
        - 취소된 주문은 매출 합계에서 제외한다.
        - 결제완료 및 배송중 주문만 정상 주문으로 집계한다.
        - 정상 주문의 총매출과 평균 주문 금액을 계산한다.
        - 5만원 이상인 정상 주문 번호를 새로운 배열에 저장한다.
        - 콜백 함수를 사용해 정상 주문인지 판단한다.
        - forEach()로 각 주문의 분석 결과를 출력한다.
        - 원본 배열을 수정하지 않는다.
    */

    // [정답]
    function isNormalOrder(status) {
        return status !== "취소";
    }

    function analyzeOrders(orderNumbers, amounts, statuses, callback) {
        let totalSales = 0;
        let normalOrderCount = 0;
        let highValueOrders = [];

        orderNumbers.forEach((orderNumber, index) => {
            let amount = amounts[index];
            let status = statuses[index];

            if (callback(status)) {
                totalSales += amount;
                normalOrderCount++;

                console.log(
                    orderNumber + ": " + amount + "원 (" + status + ")"
                );

                if (amount >= 50000) {
                    highValueOrders.push(orderNumber);
                }
            } else {
                console.log(orderNumber + ": 매출 집계 제외 (취소)");
            }
        });

        let average = 0;

        if (normalOrderCount > 0) {
            average = totalSales / normalOrderCount;
        }

        console.log("정상 주문 건수: " + normalOrderCount + "건");
        console.log("정상 주문 총매출: " + totalSales + "원");
        console.log("평균 주문 금액: " + average.toFixed(0) + "원");
        console.log("5만원 이상 주문: " + highValueOrders.join(", "));
    }

    let orderNumbers = ["ORD001", "ORD002", "ORD003", "ORD004", "ORD005"];
    let orderAmounts = [35000, 78000, 120000, 25000, 65000];
    let orderStatuses = ["결제완료", "배송중", "취소", "결제완료", "배송중"];

    analyzeOrders(
        orderNumbers,
        orderAmounts,
        orderStatuses,
        status => isNormalOrder(status)
    );

    // ================================================================================================

    //		도로 교통상황이 숫자로 주어진다.
    //		출발 70 80 60 20 30 50 10 80 77 89
    //			      ||    ||    ||
    //		    70 60 40 50 55 65 23 44 37 88 도착
            
    //		북쪽도로에서 남쪽도로로 건널수 있는 다리는 index번호로 주어진다.
    //		이때, 가장 최소 시간이 소요되는 다리는 몇번 다리인지 출력하고 최소시간을 함께 출력해보자!
            
    //		출력 예시) 다리번호: 6
    //				 최소시간: 512
            
    //		주의사항.
    //		1. 무조건 다리를 1번 건너야함 (도착지점이 남쪽이기 때문에)
    //		2. 다리를 여러번 건널수 없고 딱, 한번만 가능
    //		3. 다리를 건널때에는 남쪽, 분쪽 소요시간이 같이 소요됨. (즉, 같이 합산해야함)
    //		4. 소요시간이 같은 경우가 발생하면 낮은 다리번호를 출력

</script>
