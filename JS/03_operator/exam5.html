<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    /*
        < 비교 연산자 >
        == : 값이 같은지 비교 (타입 변환 가능)
        === : 값과 자료형이 모두 같은지 비교
        != : 값이 다른지 비교 (타입 변환 가능)
        !== : 값 또는 자료형이 다른지 비교
        > : 초과
        < : 미만
        >= : 이상
        <= : 이하

        비교 연산자의 결과는 Boolean(true / false)
    */
    console.log(10 == 10); // true
    console.log(10 == "10"); // true
    console.log(10 === "10"); // false
    console.log(10 != "10"); // false
    console.log(10 !== "10"); // true
    console.log(10 > 5); // true
    console.log(10 < 5); // false
    console.log(10 >= 10); // true
    console.log(5 <= 3); // false

    // 비교연산자를 통한 문자열(복수개의 문자) 크기 비교
    // => 복수개의 문자라 하더라도 앞에서부터 각각의 문자를 차례대로 아스키 코드 형태로 비교
    //    (참고> 아스키코드값 : 대문자 'A' = 65, 소문자 'a' = 97, 문자 '0' = 48)
    console.log("Javascript > javascript = " + ("Javascript" > "javascript")); // false
    // => 대문자는 소문자보다 항상 아스키코드값으로 32 만큼씩 작으므로
    //    "Javascript" 와 "javascript" 비교 시 첫 글자 "J" 와 "j" 를 비교하게 되기 때문에
    //    "Javasciprt" 가 "javascript" 보다 작다. 따라서, false

    console.log("Javascript > JavaScript = " + ("Javascript" > "JavaScript")); // true
    // => J, a, v, a 순으로 모두 같고, 소문자 s 가 대문자 S 보다 크다. 따라서, true 출력
</script>

</body>
</html>
