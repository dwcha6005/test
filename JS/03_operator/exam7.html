<!DOCTYPE html>

<script>
    /*
        < 삼항 연산자 >
        조건 ? 참일 때 값 : 거짓일 때 값
        조건에 따라 둘 중 하나의 값을 선택함
        조건문 단원에서 자세히 학습
    */
    let userAge = 20;
    let result = userAge >= 20 ? "성인" : "미성년자";

    console.log(result); // 성인

    // 짝수/홀수 판단
    let num = 10;
    let result2 = num % 2 == 0 ? "짝수" : "홀수";
    console.log(result2);
</script>
