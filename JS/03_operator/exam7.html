<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    /*
        < 삼항 연산자 >
        조건 ? 참일 때 값 : 거짓일 때 값
        조건에 따라 둘 중 하나의 값을 선택함
        조건문 단원에서 자세히 학습
    */
    let userAge = 20;
    let result = userAge >= 20 ? "성인" : "미성년자";

    console.log(result); // 성인

    // 짝수/홀수 판단
    let num = 10;
    let result2 = num % 2 == 0 ? "짝수" : "홀수";
    console.log(result2);

    /*
        < 삼항 연산자 중첩 >
        - 조건이 2개 이상일 때 사용

        문법)
        조건 ? 참일때값 : 조건 ? 참일때값 : 거짓일때 값

        조건 ? 참일때값 : 
        조건 ? 참일때값 : 
        조건 ? 참일때값 : 
        조건 ? 참일때값 : 
        ...
        조건 ? 참일때값 : 거짓일때 값
    */
   // 양수 음수 0 판별
    let n = 20;

    let rst = n > 0 ? "양수" :
              n < 0 ? "음수" : 0;

    console.log(rst);

</script>

<body>
    
</body>
</html>
