<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    /*
        < 1. 산술 연산자 >
        + : 더하기
        - : 빼기
        * : 곱하기
        / : 나누기
        % : 나머지
        ** : 거듭제곱
    */
    let num1 = 10;
    let num2 = 3;

    console.log(num1 + num2); // 13
    console.log(num1 - num2); // 7
    console.log(num1 * num2); // 30
    console.log(num1 / num2); // 3.333...
    console.log(num1 % num2); // 1
    console.log(num1 ** num2); // 1000

    /*
        < 2. 나머지 연산자 >
        % : 나눗셈의 나머지를 구함
        짝수/홀수 판별, 특정 주기의 반복 등에 활용
    */
    console.log(10 % 2); // 0
    console.log(11 % 2); // 1
    console.log(15 % 4); // 3

    /*
        < 3. 문자열 연결 연산자 >
        문자열과 +를 사용하면 문자열을 연결함
        숫자와 문자열을 +로 연결하면 문자열이 됨
    */
    console.log("안녕" + "하세요"); // 안녕하세요
    console.log("나이: " + 20); // 나이: 20
    console.log(10 + 20); // 30
    console.log("10" + 20); // 1020
    console.log("10" + "20"); // 1020
</script>

<body>
    
</body>
</html>
