
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="03_event_type_test.js" defer></script>
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4">상품 관리</h1>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <p class="text-secondary mb-0">상품명을 더블 클릭하면 바로 수정할 수 있습니다.</p>
            <button type="button" id="addButton" class="btn btn-primary">상품 등록</button>
        </div>

        <table class="table table-hover table-bordered align-middle">
            <thead class="table-light">
                <tr>
                    <th>상품 코드</th>
                    <th>상품명</th>
                    <th>카테고리</th>
                    <th class="text-end">가격</th>
                    <th>판매 상태</th>
                </tr>
            </thead>
            <tbody id="productTable">
                <tr>
                    <td>P-101</td>
                    <td class="product-name">무선 키보드</td>
                    <td>주변기기</td>
                    <td class="text-end">39,000원</td>
                    <td><span class="badge text-bg-success">판매 중</span></td>
                </tr>
                <tr>
                    <td>P-102</td>
                    <td class="product-name">무선 마우스</td>
                    <td>주변기기</td>
                    <td class="text-end">25,000원</td>
                    <td><span class="badge text-bg-success">판매 중</span></td>
                </tr>
                <tr>
                    <td>P-103</td>
                    <td class="product-name">USB-C 허브</td>
                    <td>컴퓨터 액세서리</td>
                    <td class="text-end">42,000원</td>
                    <td><span class="badge text-bg-warning">재고 부족</span></td>
                </tr>
                <tr>
                    <td>P-104</td>
                    <td class="product-name">노트북 거치대</td>
                    <td>데스크 액세서리</td>
                    <td class="text-end">31,000원</td>
                    <td><span class="badge text-bg-success">판매 중</span></td>
                </tr>
                <tr>
                    <td>P-105</td>
                    <td class="product-name">웹캠</td>
                    <td>화상 회의 장비</td>
                    <td class="text-end">58,000원</td>
                    <td><span class="badge text-bg-secondary">판매 중지</span></td>
                </tr>
            </tbody>
        </table>

        <p id="message" class="text-secondary">상품 행을 클릭하거나 상품명을 더블 클릭해 보세요.</p>
    </div>
</body>
</html>
