<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script src="final.js"></script>
</head>
<body>
	<!-- form 태그 실습과제 화면.png 실습 -->
	<div align="center">
		<h1>회원가입</h1>
		<form action="" name="joinForm">
			<table border="1">
				<tr>
					<th>이름</th>
					<td><input type="text" name="name"></td>
				</tr>
				<tr>
					<th>ID</th>
					<td>
						<!-- ID중복확인 버튼 클릭 시 함수 호출하여 새 창으로 "check_id.jsp" 열기 -->
						<input type="text" name="id" placeholder="4 ~ 8글자 사이 입력">
						<input type="button" value="ID중복확인" id="btnCheckId">
						<div id="checkIdResult"></div>
					</td>
				</tr>
				<tr>
					<th>비밀번호</th>
					<td>
						<!-- 
						비밀번호 입력란에 "키를 눌렀다 뗄 때" 함수 호출하여 비밀번호 입력값 길이 체크
						=> 비밀번호 텍스트 길이가 8글자 미만이거나 16글자 초과하면
						   "8 ~ 16글자 사이 입력 필수!" 메세지를 div 영역에 출력(빨간색)
						=> 비밀번호 길이가 8 ~ 16글자 사이면
						   "사용 가능한 비밀번호!" 메세지를 div 영역에 출력(초록색)
						-->
						<input type="password" id="passwd" name="passwd" placeholder="8 ~ 16글자 사이 입력">
						<div id="checkPasswdResult"></div>
					</td>
				</tr>
				<tr>
					<th>비밀번호확인</th>
					<td>
						<!--
						비밀번호 확인란에서 "커서가 빠져나갈 때" 함수 호출하여
						비밀번호 란에서 입력한 비밀번호와 비밀번호 확인란의 비밀번호를 비교하여
						두 비밀번호가 같을 경우 "비밀번호 확인 완료!"(초록색) div 영역에 출력하고
						다를 경우 "비밀번호 다름!"(빨간색) div 영역에 출력
						-->
						<input type="password" id="passwd2">
						<div id="checkPasswd2Result"></div>
					</td>
				</tr>
				<tr>
					<th>주민번호</th>
					<td>
						<!-- 
						주민번호 앞자리 입력란에서 "키 눌렀다 뗄 때" 입력값 체크하여
						앞자리 입력값 길이가 6글자이면 뒷자리 입력란으로 커서 이동하고
						뒷자리 입력값 길이가 7글자이면 뒷자리에서 커서 제거
						=> 텍스트박스에 maxLength 속성 지정 시 해당 자릿수만큼만 입력됨
						-->
						<input type="text" id="jumin1" name="jumin1" size="10" maxlength="6">-<input type="text" id="jumin2" name="jumin2" size="10" maxlength="7">
					</td>
				</tr>
				<tr>
					<th>주소</th>
					<td>
						<input type="text" id="postcode" name="postcode" size="6" readonly placeholder="우편번호">
						<input type="button" value="주소검색" id="btnSearchAddress"><br>
						<input type="text" id="address1" name="address1" size="25" readonly placeholder="기본주소"><br>
						<input type="text" id="address2" name="address2" size="25" placeholder="상세주소">
					</td>
				</tr>
				<tr>
					<th>E-Mail</th>
					<td>
						<input type="text" size="10" id="email1" name="email1">@<input type="text" size="10" id="email2" name="email2">
						<select id="emailDomain">
							<option value="">직접입력</option>
							<option value="naver.com">naver.com</option>
							<option value="nate.com">nate.com</option>
							<option value="gmail.com">gmail.com</option>
						</select>
					</td>
				</tr>
				<tr>
					<th>직업</th>
					<td>
						<select name="job">
							<option value="">항목을 선택하세요</option>
							<option value="개발자">개발자</option>
							<option value="DB엔지니어">DB엔지니어</option>
							<option value="관리자">관리자</option>
						</select>
					</td>
				</tr>
				<tr>
					<th>성별</th>
					<td>
						<input type="radio" name="gender" value="남">남
						<input type="radio" name="gender" value="여" checked>여
					</td>
				</tr>
				<tr>
					<th>취미</th>
					<td>
						<input type="checkbox" id="hobby1" name="hobby" value="여행"><label for="hobby1">여행</label>
						<input type="checkbox" id="hobby2" name="hobby" value="독서"><label for="hobby2">독서</label>
						<input type="checkbox" id="hobby3" name="hobby" value="게임"><label for="hobby3">게임</label>
						<input type="checkbox" id="check_all"><label for="check_all">전체선택</label>
					</td>
				</tr>
				<tr>
					<th>가입동기</th>
					<td>
						<textarea rows="5" cols="40" id="motivation" name="motivation"></textarea>
					</td>
				</tr>
				<tr>
					<td colspan="2" align="center">
						<input type="submit" value="가입">
						<input type="reset" value="초기화">
						<!-- 11. 돌아가기 버튼 클릭 시 이벤트 처리를 통해 이전 페이지로 이동 처리 -->
						<input type="button" value="돌아가기" onclick="history.back()">
					</td>
				</tr>
			</table>
		</form>
	</div>
	<!-- ==================================================================== -->
	<!-- 카카오(다음) 우편번호 검색 서비스 API 활용하여 주소검색 기능 구현하기 -->
	<!-- 해당 API 웹사이트 주소 : https://postcode.map.daum.net/guide -->
	<!-- 카카오(다음)에서 제공하는 우편번호 검색 스크립트 파일(postcode.v2.js) 로딩 필수 -->
	<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
	<script>
		document.querySelector("#btnSearchAddress").onclick = function() {
		    new daum.Postcode({ // postcode.v2.js 에서 제공하는 daum.Postcode 객체 생성
		    	// 주소 검색 창에서 주소 검색 후 검색된 주소를 사용자가 클릭 시
		    	// oncomplete 이벤트에 의해 이벤트 뒤의 익명함수가 자동으로 호출됨
	            // 사용자가 클릭한 주소 정보가 익명함수 파라미터 data 로 전달됨 
	            // => 주의! 이 익명함수는 개발자가 호출하는 것이 아니라
	            //    API 에 의해 자동으로 호출됨
	            //    (어떤 동작 수행 후 자동으로 호출되는 함수를 콜백(callback) 함수라고 함)
		        oncomplete: function(data) {
		            // 클릭(선택)된 주소 정보(객체)가 익명함수 파라미터 data 에 저장되어 있음
// 		            console.log(data);
		            // data 객체 접근을 위해 data.xxx 형식으로 주소 상세정보 접근 가능
		            // ---------------------------------------------------------------
		            // 1) 우편번호(= postcode 이지만, 최근 국가기초구역번호로 변경 = zonecode 사용)
		            document.joinForm.postcode.value = data.zonecode;
		    		
		    		// 2) 기본주소(address 속성값)
// 		            document.joinForm.address1.value = data.address;
		    		
		    		// 만약, 해당 주소에 건물명(buildingName 속성값)이 존재할 경우(널스트링 아님)
		    		// 기본주소 뒤에 건물명을 결합하여 출력
		    		// ex) 기본주소 : 부산광역시 부산진구 동천로109
		    		//     건물명 : 삼한골든게이트
		    		//     => 부산광역시 부산진구 동천로109 (삼한골든게이트)
		    		let address = data.address; // 기본 주소 저장
		    		
		    		if(data.buildingName != "") { // 건물명이 존재할 경우 판별
		    			address += " (" + data.buildingName + ")"; // 건물명 결합
		    		}
		    		
		    		document.joinForm.address1.value = address; // 기본 주소 출력
		    		
		    		// 상세주소 입력 항목(name 속성 address2)에 커서 요청
		    		document.joinForm.address2.focus();
		        }
		    }).open(); // 주소검색창 표시(새 창으로 열림)
		}
	</script>
</body>
</html>
