
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Event Delegation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="07_delegation.js" defer></script>
</head>
<body class="p-4">

    <h1>상품 관리</h1>
    <p>이벤트 위임을 이용하여 상품 조회, 삭제, 추가 기능을 구현합니다.</p>

    <section class="mt-4">
        <h2>1. 상품 목록</h2>
        <p>상품 행이나 상세 버튼을 클릭하면 상품 정보를 확인할 수 있습니다.</p>

        <button id="addProduct" class="btn btn-primary mb-3">상품 추가</button>

        <table id="productTable" class="table table-bordered table-hover">
            <thead class="table-light">
                <tr>
                    <th>상품 번호</th>
                    <th>상품명</th>
                    <th>가격</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="productList">
                <tr data-id="101" data-name="무선 키보드" data-price="39000">
                    <td>101</td>
                    <td>무선 키보드</td>
                    <td>39,000원</td>
                    <td>
                        <button class="btn btn-sm btn-success" data-action="detail">
                            <span>상세 보기</span>
                        </button>
                        <button class="btn btn-sm btn-danger" data-action="delete">
                            <span>삭제</span>
                        </button>
                    </td>
                </tr>
                <tr data-id="102" data-name="무선 마우스" data-price="25000">
                    <td>102</td>
                    <td>무선 마우스</td>
                    <td>25,000원</td>
                    <td>
                        <button class="btn btn-sm btn-success" data-action="detail">
                            <span>상세 보기</span>
                        </button>
                        <button class="btn btn-sm btn-danger" data-action="delete">
                            <span>삭제</span>
                        </button>
                    </td>
                </tr>
                <tr data-id="103" data-name="USB 허브" data-price="18000">
                    <td>103</td>
                    <td>USB 허브</td>
                    <td>18,000원</td>
                    <td>
                        <button class="btn btn-sm btn-success" data-action="detail">
                            <span>상세 보기</span>
                        </button>
                        <button class="btn btn-sm btn-danger" data-action="delete">
                            <span>삭제</span>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

    <hr>

    <section>
        <h2>2. 상품 상세 정보</h2>
        <div id="detailArea" class="border rounded p-3">
            <p>선택한 상품이 없습니다.</p>
        </div>
    </section>

    <hr>

    <section>
        <h2>3. 이벤트 정보</h2>
        <p>상품 목록을 클릭하고 실제 클릭한 요소와 리스너가 등록된 요소를 확인하세요.</p>
        <pre id="eventInfo" class="border rounded p-3">아직 이벤트가 발생하지 않았습니다.</pre>
    </section>

</body>
</html>
