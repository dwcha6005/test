
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 전파 실습 - 상품 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="06_propagation_test.js" defer></script>
    <style>
        .modal-layer {
            position: fixed;
            inset: 0;
            z-index: 1050;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.5);
        }
        .modal-box {
            width: 100%;
            max-width: 500px;
            padding: 1.5rem;
            background: white;
            border-radius: 0.5rem;
        }
        #productTable tbody tr {
            cursor: pointer;
        }
    </style>
</head>
<body class="p-4">

    <h1>상품 관리</h1>
    <p>상품 행을 클릭하면 상세 정보가 열립니다. 삭제 버튼과 상세 모달도 직접 테스트하세요.</p>

    <h2 class="mt-4">상품 목록</h2>

    <table id="productTable" class="table table-bordered table-hover">
        <thead class="table-light">
            <tr>
                <th>상품 번호</th>
                <th>상품명</th>
                <th>가격</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody>
            <tr data-id="101" data-name="무선 키보드" data-price="39000">
                <td>101</td>
                <td>무선 키보드</td>
                <td>39,000원</td>
                <td><button class="btn btn-danger btn-sm delete-button">삭제</button></td>
            </tr>
            <tr data-id="102" data-name="무선 마우스" data-price="25000">
                <td>102</td>
                <td>무선 마우스</td>
                <td>25,000원</td>
                <td><button class="btn btn-danger btn-sm delete-button">삭제</button></td>
            </tr>
            <tr data-id="103" data-name="USB 허브" data-price="18000">
                <td>103</td>
                <td>USB 허브</td>
                <td>18,000원</td>
                <td><button class="btn btn-danger btn-sm delete-button">삭제</button></td>
            </tr>
        </tbody>
    </table>

    <p id="message" class="border rounded p-3">상품을 선택하거나 삭제해 보세요.</p>

    <!-- 상품 상세 모달 -->
    <div id="detailModal" class="modal-layer d-none">
        <div id="modalBox" class="modal-box border">
            <h2>상품 상세 정보</h2>
            <p>상품 번호: <span id="detailId"></span></p>
            <p>상품명: <span id="detailName"></span></p>
            <p>가격: <span id="detailPrice"></span>원</p>
            <button id="closeModal" class="btn btn-secondary">닫기</button>
        </div>
    </div>

</body>
</html>
