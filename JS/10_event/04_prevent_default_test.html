<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04. 기본 동작 막기 실습</title>
    <script src="04_prevent_default_test.js" defer></script>
    <style>
        section { border: 1px solid #ccc; padding: 10px 14px; margin-bottom: 10px; }
        h2 { font-size: 16px; margin: 0 0 8px; }
        .error { color: red; font-size: 13px; }
        #termsBox { display: none; background-color: #f5f5f5; padding: 8px; }
        #contextArea { border: 1px dashed #999; padding: 16px; }
        label { display: inline-block; width: 100px; }
    </style>
</head>
<body>
    <h1>온라인 주문서</h1>

    <section>
        <h2>문제 1</h2>
        <a href="terms.html" id="termsLink">이용약관 보기</a>
        <div id="termsBox">제1조 (목적) 이 약관은 DOM 쇼핑몰의 이용 조건을 규정합니다.</div>
    </section>

    <section>
        <h2>문제 2</h2>
        <form id="searchForm" action="search.jsp">
            <input type="text" id="searchKeyword" placeholder="상품 검색">
            <button type="submit">검색</button>
        </form>
        <p id="searchMsg"></p>
    </section>

    <section>
        <h2>문제 3</h2>
        <p id="contextArea">이 상품 설명은 복사가 금지되어 있습니다. (우클릭 해보세요)</p>
        <p id="contextMsg"></p>
    </section>

    <section>
        <h2>문제 4</h2>
        <a href="https://www.google.com" id="outLink">제조사 홈페이지</a>
    </section>

    <section>
        <h2>문제 5</h2>
        <form id="orderForm" action="order.jsp">
            <p><label>받는 사람</label> <input type="text" id="receiver"></p>
            <p><label>연락처</label> <input type="text" id="contact"></p>
            <p><label>주소</label> <input type="text" id="address" size="40"></p>
            <button type="submit">주문하기</button>
        </form>
        <p id="orderMsg"></p>
    </section>

    <section>
        <h2>문제 6</h2>
        수량: <input type="text" id="qtyInput" value="1" size="4">
    </section>

    <section>
        <h2>문제 7</h2>
        <form name="couponForm" action="coupon.jsp">
            <input type="text" name="couponCode" placeholder="쿠폰 코드 6자리">
            <button type="submit">적용</button>
        </form>
    </section>

    <section>
        <h2>문제 8</h2>
        <form id="joinForm" action="join.jsp">
            <p><label>아이디</label> <input type="text" id="joinId"> <span class="error" id="idError"></span></p>
            <p><label>비밀번호</label> <input type="password" id="joinPw"> <span class="error" id="pwError"></span></p>
            <p><label>비밀번호 확인</label> <input type="password" id="joinPw2"> <span class="error" id="pw2Error"></span></p>
            <p><input type="checkbox" id="joinAgree"> 약관 동의 <span class="error" id="agreeError"></span></p>
            <button type="submit">가입하기</button>
        </form>
        <p id="joinResult"></p>
    </section>

    <section>
        <h2>문제 9</h2>
        출생 연도: <input type="text" id="birthYear" placeholder="예) 2010" size="6">
        <input type="checkbox" id="age14"> <label for="age14" style="width:auto">만 14세 이상입니다.</label>
    </section>

    <section>
        <h2>문제 10</h2>
        <form id="chatForm">
            <textarea id="chatText" rows="3" cols="40" placeholder="Enter: 전송 / Shift + Enter: 줄바꿈"></textarea>
            <button type="submit">전송</button>
        </form>
        <ul id="chatList"></ul>
    </section>
</body>
</html>
