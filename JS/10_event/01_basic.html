<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01. 이벤트 기초</title>
    <script src="01_basic.js" defer></script>
</head>
<body>
    <h1>01. 이벤트 기초</h1>

    <h2>2. 방법 1 - HTML 속성 (onclick="")</h2>
    <button type="button" onclick="sayHello()">인사하기</button>
    <p id="helloResult"></p>

    <h2>3. 방법 2 - 이벤트 프로퍼티 (요소.onclick = 함수)</h2>
    <button type="button" id="propertyBtn">프로퍼티 방식</button>

    <h2>4. 방법 3 - addEventListener()</h2>
    <button type="button" id="listenerBtn">addEventListener 방식</button>

    <h2>6. 자주 하는 실수 - 함수 뒤에 괄호</h2>
    <button type="button" id="mistakeBtn">실수 확인</button>

    <h2>7. 이벤트 제거 - 쿠폰은 한 번만</h2>
    <button type="button" id="couponBtn">쿠폰 받기</button>
    <p id="couponResult"></p>

    <h2>9. 실제 예 - 좋아요 버튼</h2>
    <button type="button" id="likeBtn">♡ 좋아요</button>
    <span id="likeCount">0</span>
    <button type="button" id="likeReset">초기화</button>
</body>
</html>
