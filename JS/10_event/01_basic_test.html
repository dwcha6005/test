<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01. 이벤트 기초 실습</title>
    <script src="01_basic_test.js" defer></script>
    <style>
        section { border: 1px solid #ccc; padding: 10px 14px; margin-bottom: 10px; }
        h2 { font-size: 16px; margin: 0 0 8px; }
        .active { background-color: royalblue; color: white; }
    </style>
</head>
<body>
    <h1>상품 상세 페이지 - 무선 이어폰</h1>

    <section>
        <h2>문제 1</h2>
        <button type="button" onclick="buyNow()">바로 구매</button>
        <p id="buyResult"></p>
    </section>

    <section>
        <h2>문제 2</h2>
        <button type="button" id="wishBtn">♡ 찜하기</button>
    </section>

    <section>
        <h2>문제 3</h2>
        <button type="button" id="shareBtn">공유하기</button>
        공유 횟수: <span id="shareCount">0</span>
    </section>

    <section>
        <h2>문제 4</h2>
        <button type="button" id="infoBtn">배송 정보 보기</button>
        <p id="infoText"></p>
    </section>

    <section>
        <h2>문제 5</h2>
        단가: 15,000원<br>
        <button type="button" id="minusBtn">-</button>
        <span id="qty">1</span>
        <button type="button" id="plusBtn">+</button>
        <p id="totalPrice">총 금액: 15,000원</p>
    </section>

    <section>
        <h2>문제 6</h2>
        <button type="button" id="testBtn">출력 예측 버튼</button>
    </section>

    <section>
        <h2>문제 7</h2>
        <button type="button" id="eventBtn">첫 구매 이벤트 응모</button>
        <p id="eventResult"></p>
    </section>

    <section>
        <h2>문제 8</h2>
        <button type="button" id="prevBtn">◀</button>
        <span id="imageView">상품 이미지 1 / 4</span>
        <button type="button" id="nextBtn">▶</button>
    </section>

    <section>
        <h2>문제 9</h2>
        <button type="button" class="tab-btn active">상품 설명</button>
        <button type="button" class="tab-btn">리뷰</button>
        <button type="button" class="tab-btn">문의</button>
        <p id="tabContent">고음질 무선 이어폰입니다.</p>
    </section>

    <section>
        <h2>문제 10</h2>
        <button type="button" id="reviewBtn">리뷰 작성</button>
        <ul id="reviewList"></ul>
    </section>
</body>
</html>
