<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03. 자주 쓰는 이벤트</title>
    <script src="03_event_type.js" defer></script>
    <style>
        #productBox {
            width: 200px;
            padding: 16px;
            border: 1px solid #999;
        }
        #productDesc {
            display: none;
            color: gray;
        }
        .over {
            color: red;
        }
        #topBtn {
            display: none;
            position: fixed;
            right: 20px;
            bottom: 20px;
        }
        #spacer {
            height: 1500px;
        }
    </style>
</head>
<body>
    <h1>03. 자주 쓰는 이벤트</h1>

    <h2>1. 마우스 - mouseenter / mouseleave</h2>
    <div id="productBox">
        무선 이어폰 (마우스를 올려 보세요)
        <p id="productDesc">노이즈 캔슬링 · 30시간 재생</p>
    </div>

    <h2>2. 키보드 - keydown (Enter로 검색)</h2>
    <input type="text" id="searchInput" placeholder="검색어 입력 후 Enter">
    <p id="searchResult"></p>

    <h2>3. input - 글자 수 세기</h2>
    <textarea id="review" rows="3" cols="40" placeholder="리뷰를 입력하세요 (최대 50자)"></textarea>
    <p id="reviewCount">0 / 50</p>

    <h2>4. change - 선택 값 변경</h2>
    <p>
        이메일:
        <input type="text" id="emailId" placeholder="아이디"> @
        <input type="text" id="emailDomainInput" placeholder="도메인">
        <select id="emailSelect">
            <option value="">직접입력</option>
            <option value="naver.com">naver.com</option>
            <option value="gmail.com">gmail.com</option>
            <option value="daum.net">daum.net</option>
        </select>
    </p>
    <p>
        <input type="checkbox" id="agree">
        <label for="agree">약관에 동의합니다.</label>
        <button type="button" id="nextBtn" disabled>다음 단계</button>
    </p>

    <h2>5. input vs change 비교</h2>
    <input type="text" id="compareInput" placeholder="입력 후 다른 곳 클릭">

    <h2>6. focus / blur - 아이디 검사</h2>
    <input type="text" id="userId" placeholder="아이디 (4~8자)">
    <span id="userIdMsg"></span>

    <h2>7. scroll - 맨 위로 버튼</h2>
    <p>아래로 스크롤해 보세요.</p>
    <div id="spacer"></div>
    <button type="button" id="topBtn">▲ TOP</button>
</body>
</html>
