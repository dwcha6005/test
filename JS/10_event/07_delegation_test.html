
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 위임 실습 - 고객 문의 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="07_delegation_test.js" defer></script>
</head>
<body class="p-4">
    <h1 class="mb-3">고객 문의 관리</h1>
    <p>문의 행을 클릭하면 선택되고, 버튼으로 답변 상태를 변경하거나 문의를 삭제할 수 있습니다.</p>

    <div class="mb-3">
        <button type="button" id="addInquiry" class="btn btn-primary">새 문의 추가</button>
    </div>

    <div class="border rounded p-3 mb-3">
        <h2 class="h5">문의 목록</h2>
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>문의 번호</th>
                    <th>고객명</th>
                    <th>문의 제목</th>
                    <th>상태</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="inquiryList">
                <tr data-id="201" data-name="김민수" data-title="배송 일정 문의" data-status="답변 대기">
                    <td>201</td>
                    <td>김민수</td>
                    <td class="inquiry-title">배송 일정 문의</td>
                    <td class="status">답변 대기</td>
                    <td>
                        <button type="button" class="btn btn-sm btn-success" data-action="reply">
                            <span>답변 완료</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-danger" data-action="delete">
                            <span>삭제</span>
                        </button>
                    </td>
                </tr>
                <tr data-id="202" data-name="이서연" data-title="상품 교환 요청" data-status="답변 완료">
                    <td>202</td>
                    <td>이서연</td>
                    <td class="inquiry-title">상품 교환 요청</td>
                    <td class="status">답변 완료</td>
                    <td>
                        <button type="button" class="btn btn-sm btn-success" data-action="reply">
                            <span>답변 완료</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-danger" data-action="delete">
                            <span>삭제</span>
                        </button>
                    </td>
                </tr>
                <tr data-id="203" data-name="박지훈" data-title="결제 오류 문의" data-status="답변 대기">
                    <td>203</td>
                    <td>박지훈</td>
                    <td class="inquiry-title">결제 오류 문의</td>
                    <td class="status">답변 대기</td>
                    <td>
                        <button type="button" class="btn btn-sm btn-success" data-action="reply">
                            <span>답변 완료</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-danger" data-action="delete">
                            <span>삭제</span>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="border rounded p-3 mb-3">
        <h2 class="h5">선택한 문의</h2>
        <p id="selectedInquiry" class="mb-0">선택한 문의가 없습니다.</p>
    </div>

    <div class="border rounded p-3">
        <h2 class="h5">이벤트 정보</h2>
        <pre id="eventInfo" class="mb-0">문의 목록을 클릭해 보세요.</pre>
    </div>
</body>
</html>
