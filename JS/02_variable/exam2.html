<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    document.write("<hr>");

    // 변수 선언문의 차이점(var vs let)
    // 1. var 키워드를 사용하여 변수 선언 시 동일한 이름의 변수를 선언하더라도 중복 선언이 가능하며,
    //    다른 데이터로 변경 시에도 아무런 문제가 발생하지 않는다!
    var varNum = 10;
    console.log("varNum = " + varNum + ", varNum 변수의 데이터타입 = " + typeof(varNum));
    document.write("varNum = " + varNum + ", varNum 변수의 데이터타입 = " + typeof(varNum) + "<br>");

    // 기존에 선언된 varNum 변수와 동일한 이름의 변수를 다시 선언하더라도 오류가 발생하지 않고
    // 해당 변수에 다른 데이터를 저장해서 덮어씀(변경된 데이터에 대한 데이터타입으로 변경됨)
    var varNum = "홍길동";
    console.log("varNum = " + varNum + ", varNum 변수의 데이터타입 = " + typeof(varNum));
    document.write("varNum = " + varNum + ", varNum 변수의 데이터타입 = " + typeof(varNum) + "<br>");
    // -----------------------------------------------------------------------------------------------
    // 2. let 키워드를 사용하여 변수 선언 시 동일한 이름의 변수 중복 선언 불가능(자바와 동일)
    let letNum = "홍길동";
    console.log("letNum = " + letNum + ", letNum 변수의 데이터타입 = " + typeof(letNum));
    document.write("letNum = " + letNum + ", letNum 변수의 데이터타입 = " + typeof(letNum) + "<br>");

    // 기존에 선언된 letNum 변수와 동일한 이름의 변수를 let 키워드로 다시 선언할 경우
    // 변수명 중복으로 인한 오류 발생함
    // => 자바스크립트 파일 내에서 오류 메세지 : Cannot redeclare block-scoped variable 'letNum'.
    // => 개발자 도구에서 오류 메세지 : Identifier 'letNum' has already been declared
    //let letNum = "홍길동";
    // => 주의! 이 오류로 인해 위쪽의 정상적인 코드들도 실행되지 못한다!

    // 단, let 으로 선언한 변수도 기존 변수값을 다른 값으로 변경 가능하다!
    letNum = 10;
    console.log("letNum = " + letNum + ", letNum 변수의 데이터타입 = " + typeof(letNum));
    document.write("letNum = " + letNum + ", letNum 변수의 데이터타입 = " + typeof(letNum) + "<br>");

    // <<<<<<<<<<<<<<<<<< 결론! 변수 선언 시 var 보다 let 을 사용하자!!!! >>>>>>>>>>>>>>>>>>
    // ================================================================================================
    // 3. const 키워드를 사용하여 선언한 변수는 [상수] 로 취급되어 처음 저장된 값 변경 불가능해짐
    //    => const = constant 의 약자로 상수를 의미함
    //    => 한 번 저장된 값은 불변이므로 다른 값으로 변경 자체가 불가능 => 변경 시 오류 발생!
    //    => const 키워드로 선언하는 변수는 반드시 데이터(값) 초기화도 함께 수행되어야 한다!
    //const constNum; // 오류 발생! 
    // 자바스크립트 파일 내에서 오류 메세지 : 'const' declarations must be initialized.
    // 개발자 도구에서 오류 메세지 : Missing initializer in const declaration
    const constNum = 10;
    console.log("constNum = " + constNum + ", constNum 변수의 데이터타입 = " + typeof(constNum));
    document.write("constNum = " + constNum + ", constNum 변수의 데이터타입 = " + typeof(constNum) + "<br>");

    // const 는 let 과 마찬가지로 변수 중복 선언 불가능
    //const constNum = 10; // 오류 발생

    // constNum 변수값을 변경할 경우 오류 발생(콘솔 메세지 : Assignment to constant variable.)
    //constNum = 20;
</script>

<body>
    
</body>
</html>
