<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    // < 문제1 >
    // 아래 정보를 연결연산자(+)와 템플릿 리터럴로 출력하세요.
    // 변수선언 및 초기화)
    // 상품명(product): 마우스
    // 가격(price): 25000
    // 출력 예시) 마우스의 가격은 25000원입니다.
    let product = "마우스";
    let price = 25000;
    console.log(`${product}의 가격은 ${price}원입니다.`);

    // < 문제2 >
    // prompt()를 두 번 사용해 상품명과 수량을 입력받고 다음과 같이 출력하세요.
    // 주문 상품: 아메리카노
    // 주문 수량: 3개
    // 주문이 접수되었습니다.
    let prod = prompt("주문 상품");
    let count = prompt("주문 수량");
    alert(
        `주문 상품: ${prod}
        주문 수량: ${count}개
        주문이 접수되었습니다.`)

    // < 문제3 >
    // prompt()로 사용자 이름을 입력받고, confirm()으로 개인정보 제공 동의 여부를 확인하세요. 다음 형식으로 이름과 동의 결과를 출력하세요.
    // 이름: 홍길동
    // 개인정보 제공 동의: true
    let userName = prompt("사용자 이름 입력")
    let agree = confirm("개인정보 제공에 동의 하시겠습니까?")
    console.log(
        `이름: ${userName}
        개인정보 제공 동의: ${agree}`
    );

    // < 문제4 >
    // prompt()로 고객명, 메뉴명, 수량을 입력받고 confirm()으로 주문 확인 여부를 받으세요. 다음과 같이 하나의 주문서로 출력하세요.
    // ===== 주문서 =====
    // 고객명: 김민수
    // 메뉴: 아이스 아메리카노
    // 수량: 2개
    // 주문 확인: true

    // < 문제5 >
    // 두 변수의 값을 교환하세요.
    // 예시) let a = 10; let b = 20;
    // 출력결과) a = 20, b = 10
    // ==================
    let a = 10;
    let b = 20;
    let temp = b;
    b = a;
    a = temp;
    console.log(`a = ${a}, b = ${b}`)
</script>

<body>
    
</body>
</html>
