<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    /*
    문제 1. 성적 등급 판별하기
    점수를 입력받아 다음 기준에 따라 등급을 출력하세요.
    점수	등급
    90점 이상	A
    80점 이상	B
    70점 이상	C
    60점 이상	D
    60점 미만	F
    예시: 85점 → B

    문제 2. 계절 판별하기
    월을 입력받아 해당하는 계절을 출력하세요.
    - 3~5월: 봄
    - 6~8월: 여름
    - 9~11월: 가을
    - 12~2월: 겨울
    - 그 외: 잘못된 월입니다.
    예시: 11 → 가을

    문제 3. 숫자 크기 구분하기
    정수 하나를 입력받아 다음과 같이 출력하세요.
    - 100 초과: 큰 수
    - 1~100: 양의 정수
    - 0: 0입니다.
    - 음수: 음수입니다.
    예시: 50 → 양의 정수

    2단계. 조건에 따른 계산
    문제 4. 놀이공원 입장료 계산하기
    나이를 입력받아 입장료를 계산하세요.
    - 7세 미만: 무료
    - 7세 이상 13세 미만: 5,000원
    - 13세 이상 19세 미만: 8,000원
    - 19세 이상: 15,000원
    예시: 15세 → 8,000원

    문제 5. 배송비 계산하기
    주문 금액에 따라 배송비를 계산하고 최종 결제 금액을 출력하세요.
    - 100,000원 이상: 배송비 무료
    - 50,000원 이상 100,000원 미만: 배송비 2,000원
    - 50,000원 미만: 배송비 3,000원
    예시: 70,000원 → 최종 결제 금액 72,000원

    문제 6. 택시 요금 계산하기
    이동 거리를 km 단위로 입력받아 요금을 계산하세요.
    - 2km 이하: 4,800원
    - 2km 초과 10km 이하: 4,800원 + 초과 거리 1km당 1,000원
    - 10km 초과: 12,800원 + 10km 초과 거리 1km당 1,500원
    예시: 5km → 7,800원
    ※ 거리 계산은 소수점 없이 정수 km 단위로 처리합니다.
    
    문제 8. BMI 비만도 판별하기
    키(cm)와 몸무게(kg)를 입력받아 BMI를 계산한 뒤 판별 결과를 출력하세요.
    \[
    BMI=\frac{\text{몸무게(kg)}}{(\text{키(m)})^2}
    \]

    - 18.5 미만: 저체중
    - 18.5 이상 23 미만: 정상
    - 23 이상 25 미만: 과체중
    - 25 이상 30 미만: 비만
    - 30 이상: 고도비만
    예시: 키 170cm, 몸무게 70kg → BMI 약 24.2, 과체중

    문제 9. 누진 전기요금 계산하기
    전기 사용량을 kWh 단위로 입력받아 다음 기준으로 요금을 계산하세요.
    - 100kWh 이하: 전체 사용량 × 100원
    - 100kWh 초과 200kWh 이하: 10,000원 + 100kWh 초과분 × 150원
    - 200kWh 초과: 25,000원 + 200kWh 초과분 × 200원
    예시: 250kWh → 35,000원

    문제 10. 간단한 계산기 만들기
    숫자 두 개와 연산 기호를 입력받아 계산 결과를 출력하세요.
    - +: 덧셈
    - -: 뺄셈
    - *: 곱셈
    - /: 나눗셈
    - 그 외: 잘못된 연산자입니다.
    단, 나누기 연산에서 두 번째 숫자가 0이면 0으로 나눌 수 없습니다.를 출력하세요.

    */
</script>

</body>
