<script>
    /*
    문제 2. 홀수와 짝수 판별하기
    정수 하나를 입력받아 짝수라면 짝수입니다., 홀수라면 홀수입니다.를 출력하세요.
    - 입력: 10 → 출력: 짝수입니다.
    - 입력: 7 → 출력: 홀수입니다.
    */
{
    let num = 7;
    if (num % 2 == 0) {
        console.log("짝수입니다.")
    } else {
        console.log("홀수입니다.")
    }
}
/*
    문제 3. 두 수 중 큰 수 구하기
    정수 두 개를 입력받아 더 큰 숫자를 출력하세요. 두 숫자가 같으면 두 숫자는 같습니다.를 출력하세요.
    - 입력: 15, 8 → 출력: 15
    - 입력: 4, 9 → 출력: 9
    - 입력: 5, 5 → 출력: 두 숫자는 같습니다.
    */
{
    let num1 = 15;
    let num2 = 7;

    if (num1 == num2) {
        console.log("두 숫자는 같습니다.")
    } else {
        // if (num1 > num2) {
        //     console.log(num1)
        // } else {
        //     console.log(num2)
        // }
        let max = num1 > num2 ? num1 : num2;
        console.log(max);
    }
}

/*
    2단계. 조건에 따른 계산
    문제 4. 배송비 계산하기
    주문 금액이 50,000원 이상이면 배송비는 무료이고, 미만이면 배송비 3,000원을 추가하세요. 최종 결제 금액을 출력하세요.
    - 입력: 60000 → 출력: 60000원
    - 입력: 30000 → 출력: 33000원

    문제 5. 할인 가격 계산하기
    상품 가격을 입력받으세요. 가격이 100,000원 이상이면 10% 할인하고, 미만이면 할인 없이 결제합니다.
    - 입력: 150000 → 출력: 135000원
    - 입력: 80000 → 출력: 80000원

    문제 6. 시험 합격 여부와 보너스
    시험 점수를 입력받으세요. 60점 이상이면 10점을 추가하고, 60점 미만이면 점수를 변경하지 마세요. 최종 점수를 출력하세요.
    - 입력: 70 → 출력: 80점
    - 입력: 45 → 출력: 45점
    추가 조건: 최종 점수는 100점을 초과할 수 없습니다. 이 조건까지 처리하려면 별도의 조건문을 추가해야 합니다.
    */
   /*
    문제 7. 두 수의 차이를 양수로 만들기
    정수 두 개를 입력받아 첫 번째 수에서 두 번째 수를 빼세요. 결과가 음수라면 부호를 바꿔 양수로 출력하세요.
    - 입력: 3, 10 → 출력: 7
    - 입력: 10, 3 → 출력: 7
    */
{
    let num1 = 10;
    let num2 = 3;

    let result = num1 - num2;
    if (result < 0) {
        result *= -1;
    }
    console.log(result);
}   
    


/*
    문제 8. 주차 요금 계산하기
    주차 시간을 분 단위로 입력받으세요. 주차 시간이 60분 이하라면 기본요금 2,000원, 60분 초과라면 기본요금 2,000원에 초과 시간 10분당 500원을 추가하세요. 초과 시간이 10분 단위로 딱 나누어지지 않으면 다음 10분으로 올림합니다.
    - 입력: 60 → 출력: 2000원
    - 입력: 70 → 출력: 2500원
    - 입력: 75 → 출력: 3000원
    힌트: Math.ceil()을 사용하면 올림할 수 있습니다. 이 문제는 조건문 외에 나눗셈과 올림 개념도 필요합니다.

    문제 9. 두 변수의 값 교환하기
    숫자 두 개를 입력받으세요. 첫 번째 숫자가 두 번째 숫자보다 크면 두 변수의 값을 서로 바꾸고, 그렇지 않으면 그대로 유지하세요.
    - 입력: 20, 10 → 출력: 10, 20
    - 입력: 5, 15 → 출력: 5, 15
    힌트: 임시 변수 하나를 사용하세요.

    문제 10. 전기요금 계산하기
    전기 사용량을 kWh 단위로 입력받으세요.
    - 100kWh 이하: kWh당 100원
    - 100kWh 초과: 전체 사용량에 대해 kWh당 150원
    if ~ else를 사용해 전기요금을 계산하세요.
    - 입력: 80 → 출력: 8000원
    - 입력: 120 → 출력: 18000원
    */

    /*
    세 개의 직선이 있다.
    숫자의 의미는 직선의 길이를 말한다.
    이 직선으로 삼각형을 만들 수 있는지 판단하는 프로그램을 작성하시오.
    삼각형의 성립 조건)
    a, b, c 가 변의 길이이고 c가 제일 긴 길이라고 한다면
    c < a + b 이면 삼각형이 성립됨.
    */
    let a = 10;
    let b = 20;
    let c = 11;
    let sum = a + b + c;

    let max = a > b ? a : b;
    max = max > c ? max : c;

    let ab = sum - max;
    console.log(max < ab ? "Yes" : "No");


    /*
    5. 수호는 30분 전으로 돌아가고 싶은 1인 이다.
    첫번째 입력받는 숫자는 시, 두번째는 분으로 입력받는다
    그러면 이 시간을 기준으로 30분전의 시간을 출력하시오.
    예)
    12 35  =====> 12 5
    12 0 ======> 11 30
    11 5 ======> 10 35
    0 10 ======> 23 40
    */
    let hour = 1;
    let min = 20;

    if (min < 30) {
        hour -= 1;
        min += 30
    } else {
        min -= 30;
    }

    if (hour < 0) {
        hour = 23;
    }    
    console.log(hour + " " + min);
