<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
    /*
    1. 절대값 구하기
    정수 하나를 입력받아 절대값을 출력하세요. 단, Math.abs()는 사용하지 마세요.
    - 입력: -7 → 출력: 7
    - 입력: 5 → 출력: 5
    - 입력: 0 → 출력: 0
    조건: 입력한 숫자가 0보다 작으면 양수로 변환하세요.

    2. 두 수의 차이를 양수로 만들기
    정수 두 개를 입력받아 두 수의 차이를 양수로 출력하세요.
    - 입력: 10, 3 → 출력: 7
    - 입력: 3, 10 → 출력: 7
    - 입력: 5, 5 → 출력: 0
    조건: 뺄셈 결과가 음수라면 부호를 바꾸세요.

    3. 음수라면 0으로 변경하기
    숫자 하나를 입력받으세요. 입력한 숫자가 음수라면 값을 0으로 변경한 뒤 출력하세요.
    - 입력: -5 → 출력: 0
    - 입력: 10 → 출력: 10
    조건: 변수에 저장된 값을 직접 변경하세요.

    4. 배송비 포함 금액 계산하기
    상품 금액을 입력받으세요. 상품 금액이 50,000원 미만이면 배송비 3,000원을 더한 최종 금액을 출력하세요. 50,000원 이상이면 배송비 없이 출력하세요.
    - 입력: 30000 → 출력: 33000
    - 입력: 60000 → 출력: 60000

    5. 보너스 점수 적용하기
    시험 점수와 보너스 점수를 입력받으세요. 시험 점수가 90점 이상이면 보너스 점수를 더한 최종 점수를 출력하세요.
    - 입력: 시험 점수 95, 보너스 3 → 출력: 98
    - 입력: 시험 점수 80, 보너스 3 → 출력: 80

    6. 홀수라면 다음 짝수로 변경하기
    정수 하나를 입력받으세요. 홀수라면 1을 더해 다음 짝수로 변경한 뒤 출력하세요.
    - 입력: 5 → 출력: 6
    - 입력: 8 → 출력: 8
    - 입력: -3 → 출력: -2

    7. 두 변수의 값 교환하기
    숫자 두 개를 입력받으세요. 첫 번째 숫자가 두 번째 숫자보다 크다면 두 변수의 값을 서로 바꾸세요.
    - 입력: 10, 3 → 출력: 3, 10
    - 입력: 2, 7 → 출력: 2, 7
    조건: 임시 변수 하나를 사용해 값을 교하세요. 
    두 번째 숫자가 더 크거나 같으면 교환하지 않습니다.

    8. 최대 허용 범위로 값 제한하기
    숫자 하나를 입력받으세요. 숫자가 100보다 크면 100으로 변경한 뒤 출력하세요.
    - 입력: 150 → 출력: 100
    - 입력: 80 → 출력: 80
    - 입력: 100 → 출력: 100
    */
</script>

<body>
    
</body>
</html>
