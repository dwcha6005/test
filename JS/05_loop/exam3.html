<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>
/*
[ do - while 문 ]
- while 문과 달리 반복 시작 시점에 조건식을 판별하지 않고 반복문을 먼저 실행한 후
  문장 실행이 끝난 뒤에 조건식을 판별하여 다음 반복 여부를 결정한다!
- 따라서, do - while 문은 블럭문 내의 코드가 무조건 한 번은 실행된다는 보장이 있지만
  while 문은 블럭문 내의 코드가 단 한 번도 실행되지 않을 수도 있다!

[ 기본 문법 ]
do {
 	[증감식;]		
 	// 조건식 결과가 true일 때 반복 실행할 문장
	[증감식;] // 증감식 위치는 반복할 문장보다 위에 올 수도 있다!
} while(조건식);
// => 주의! while 문 조건식 뒤에 세미콜론 필수!!!!
*/

// 패스워드를 입력받기
// => 단, 패스워드를 입력하지 않았을 경우(= 널스트링) 계속 입력받기 반복
// => 또한, 취소 버튼을 클릭했을 경우 "작업을 종료합니다" 출력하고
//    아니면, 입력받은 패스워드 : xxx 출력
let passwd;

do { // 조건 없이 무조건 블럭 내의 문장을 한 번 실행한다!
	// 널스트링일 경우 새로운 패스워드를 다시 입력받아 변수 passwd 에 저장
	passwd = prompt("패스워드를 입력하세요");
} while(passwd == ""); // 마지막 while 문 조건 뒤에 세미콜론 필수!
// => 블럭 내의 문장을 최소 한 번 실행한 후 마지막에 while 문을 통해 조건식을 판별하여 반복 결정

if(passwd == null) {
	document.write("작업을 종료합니다.<br>");
} else {
	document.write("입력받은 패스워드 : " + passwd + "<br>");
}


</script>

<body>
    
</body>
</html>
