    // < 문제 >
    // 2단부터 9단까지 출력하기
{
	for (let dan = 2; dan <= 9; dan++) {
		document.write("< " + dan + "단 ><br>")
		for (let i = 1; i <= 9; i++) {
			document.write(dan + " * " + i + " = " + dan*i + "<br>")
		}
		document.write("<br>")
	}
}



	/*
	어떤 수 n을 입력받으면 다음과 같은 삼각형을 출력한다.
	여기서 입력되는 n은 반드시 홀수이다.
	3부터 99 까지의 홀수 중 하나가 입력된다.
	(document.write() 사용)

	입력: 5 --> 출력:	*
					  ***
					 *****
	참고) &nbsp; --> 공백 한칸					 
	*/
{
	let num = 5;	
	let line = parseInt(num / 2 + 1);
	let star = 1;
	let space = parseInt(num / 2);

	for (let i = 0; i < line; i++) {
		
		for (let j = 0; j < space; j++) {
			document.write("&nbsp;")
		}

		for (let j = 0; j < star; j++) {
			document.write("*")
		}

		star += 2;
		space--;

		document.write("<br>")
	}
}
	/*
	주사위는 각 면에 1~6까지 적혀 있는 정육면체이다.
	이런 주사위 2개를 굴려 합이 k가 나오는 경우를 조사하려고 한다.
	예를 들어, 주사위 두개를 굴려 5가 나오는 경우는 1 4, 2 3, 3 2, 4 1 이다.
	그리고 주사위를 하나만 굴리는 경우는 없다.
	두 주사위를 굴려 나오는 합 k 가 입력된다. 

	입력: 5 --> 출력: 1 4
					 2 3
					 3 2
					 4 1
	*/
{
	let target = 5;	
	for (let i = 1; i <= 6; i++) {
		for (let j = 1; j <= 6; j++) {
			if (i + j === target) {
				document.write(i + " " + j + "<br>")
			}
		}
	}
}
